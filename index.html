<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestionale Pianoforti</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f3}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
nav{background:#fff;border-bottom:0.5px solid rgba(0,0,0,0.12);display:flex;position:sticky;top:0;z-index:10}
nav button{flex:1;padding:10px 2px;font-size:10px;font-weight:500;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;color:#666;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.active{border-bottom:2px solid #185FA5;color:#185FA5}
nav button svg{width:18px;height:18px}
main{flex:1;padding:12px;padding-bottom:80px}
.card{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:12px;padding:1rem;margin-bottom:12px}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.metric{background:#f5f5f3;border-radius:8px;padding:12px}
.metric-label{font-size:11px;color:#666;margin-bottom:4px}
.metric-value{font-size:22px;font-weight:500}
.metric-sub{font-size:11px;color:#666;margin-top:2px}
.section-title{font-size:11px;font-weight:500;color:#666;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px}
.scad-card{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.scad-card:hover{background:#f9f9f9}
.scad-card.urgente{border-left:3px solid #E24B4A}
.scad-card.warning{border-left:3px solid #EF9F27}
.scad-card.ok{border-left:3px solid #639922}
.scad-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.scad-nome{font-weight:500;font-size:14px}
.scad-meta{font-size:12px;color:#666;margin-top:3px}
.badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500;white-space:nowrap}
.badge-red{background:#FCEBEB;color:#791F1F}
.badge-orange{background:#FAEEDA;color:#633806}
.badge-green{background:#EAF3DE;color:#27500A}
.badge-blue{background:#E6F1FB;color:#0C447C}
.piano-card{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.piano-card:hover{background:#f9f9f9}
.piano-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.piano-meta{font-size:12px;color:#666;display:flex;gap:8px;flex-wrap:wrap}
.search-bar{margin-bottom:10px}
.search-bar input{width:100%;padding:8px 12px;border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;font-size:14px;background:#fff;color:#1a1a1a;outline:none}
.filter-row{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.filter-btn{padding:5px 12px;border:0.5px solid rgba(0,0,0,0.2);border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;background:#fff;color:#666}
.filter-btn.active{background:#185FA5;color:#fff;border-color:#185FA5}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:0.5px solid rgba(0,0,0,0.08);font-size:13px}
.summary-row:last-child{border-bottom:none}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:100;display:flex;align-items:flex-end}
.sheet{background:#fff;border-radius:16px 16px 0 0;padding:16px;width:100%;max-height:85vh;overflow-y:auto}
.detail-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:0.5px solid rgba(0,0,0,0.08);font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:#666;flex-shrink:0;margin-right:12px}
.close-btn{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:#666;line-height:1}
.btn-primary{background:#185FA5;color:#fff;border:none;padding:11px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;width:100%}
.btn-primary:hover{background:#0C447C}
.btn-secondary{background:none;color:#666;border:0.5px solid rgba(0,0,0,0.2);padding:9px;border-radius:8px;font-size:13px;cursor:pointer;width:100%;margin-top:8px}
.btn-google{background:#fff;color:#3c4043;border:0.5px solid rgba(0,0,0,0.2);padding:11px 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.btn-google:hover{background:#f5f5f5}
.upload-area{border:1.5px dashed rgba(0,0,0,0.2);border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;margin-bottom:12px}
.upload-area:hover{background:#f5f5f5}
.empty-state{text-align:center;padding:48px 16px;color:#666}
.alert-banner{border-radius:8px;padding:10px 14px;margin-bottom:10px;cursor:pointer}
.alert-red{background:#FCEBEB;border-left:3px solid #E24B4A}
.alert-orange{background:#FAEEDA;border-left:3px solid #EF9F27}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.month-nav button{background:none;border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;padding:7px 16px;cursor:pointer;font-size:13px;color:#1a1a1a}
.month-nav span{font-size:15px;font-weight:500}
.month-totals{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:0.5px solid rgba(0,0,0,0.08)}
.day-label{font-size:11px;font-weight:500;color:#666;text-transform:uppercase;letter-spacing:0.05em;margin:12px 0 6px}
.connected-dot{width:8px;height:8px;border-radius:50%;background:#639922;display:inline-block;margin-right:6px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:#185FA5;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

.wa-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.wa-box{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:440px}
.wa-box textarea{width:100%;height:120px;padding:10px;border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;margin:12px 0}
.wa-box .wa-nome{font-size:15px;font-weight:500;margin-bottom:4px}
.wa-box .wa-sub{font-size:12px;color:#666;margin-bottom:12px}
.btn-wa{background:#25D366;color:#fff;border:none;padding:11px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-wa:hover{background:#1da851}
.btn-wa-small{background:#25D366;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap}

</style>

<script>
const CLIENT_ID='267543971233-fsb8goidid2r97ddgii7lvn0ntl9fjnr.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/contacts.readonly';
const MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const MONTHS_SHORT=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
let pianos=[],contatti=[],lastSync=null,gToken=null;
let currentTab='dash',filterStato='ALL',searchQ='';
let viewMonth=new Date().getMonth(),viewYear=new Date().getFullYear();

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

function load(){
  try{const d=lsGet('pf_pianos');if(d)pianos=JSON.parse(d);}catch(e){}
  try{const d=lsGet('pf_contatti');if(d)contatti=JSON.parse(d);}catch(e){}
  try{const d=lsGet('pf_sync');if(d)lastSync=d;}catch(e){}
  try{const d=lsGet('pf_gtoken');if(d)gToken=d;}catch(e){}
  const hash=window.location.hash;
  if(hash&&hash.includes('access_token')){
    const params=new URLSearchParams(hash.substring(1));
    const tok=params.get('access_token');
    if(tok){
      gToken=tok;lsSet('pf_gtoken',tok);
      history.replaceState(null,'',window.location.pathname);
      setTimeout(()=>{showTab('sync');syncContatti();},500);
    }
  }
}

function showTab(t){
  currentTab=t;searchQ='';
  ['dash','scadenze','piani','sync','analisi','import'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('active',x===t));
  render();
}
function render(){
  const m=document.getElementById('main-content');
  if(currentTab==='dash')m.innerHTML=renderDash();
  else if(currentTab==='scadenze')m.innerHTML=renderScadenze();
  else if(currentTab==='piani')m.innerHTML=renderPiani();
  else if(currentTab==='sync')m.innerHTML=renderSync();
  else if(currentTab==='analisi')m.innerHTML=renderAnalisi();
  else if(currentTab==='import')m.innerHTML=renderImport();
}

function googleAuth(){
  const redirectUri=window.location.origin+window.location.pathname;
  const params=new URLSearchParams({client_id:CLIENT_ID,redirect_uri:redirectUri,response_type:'token',scope:SCOPE,prompt:'consent'});
  window.location.href='https://accounts.google.com/o/oauth2/v2/auth?'+params.toString();
}

async function apiGet(url){
  const res=await fetch(url,{headers:{Authorization:'Bearer '+gToken}});
  if(res.status===401){gToken=null;lsDel('pf_gtoken');render();throw new Error('Token scaduto. Riconnetti.');}
  const data=await res.json();
  if(data.error)throw new Error(data.error.message);
  return data;
}

async function syncContatti(){
  if(!gToken){googleAuth();return;}
  const setStatus=msg=>{const el=document.getElementById('sync-status');if(el)el.innerHTML=msg;};
  setStatus('<span class="spinner"></span>Cerco gruppi...');
  try{
    // Step 1: trova ID del gruppo NOLO LUNGO TERMINE
    const groupsData=await apiGet('https://people.googleapis.com/v1/contactGroups?pageSize=200&groupFields=name,formattedName,memberCount');
    const gruppi=groupsData.contactGroups||[];
    
    // Debug: mostra tutti i gruppi
    const nomiGruppi=gruppi.map(g=>g.name+'('+g.memberCount+')').join(' | ');
    setStatus('<span class="spinner"></span>Gruppi trovati: '+nomiGruppi);
    
    const gruppo=gruppi.find(g=>{
      const n=(g.name||'').toUpperCase();
      const fn=(g.formattedName||'').toUpperCase();
      return n.includes('NOLO')||fn.includes('NOLO');
    });
    
    if(!gruppo){
      setStatus('<span style="color:#A32D2D">Gruppo NOLO non trovato. Gruppi disponibili: '+nomiGruppi+'</span>');
      return;
    }

    setStatus('<span class="spinner"></span>Gruppo trovato: '+gruppo.name+' ('+gruppo.memberCount+' membri). Carico...');

    // Step 2: prendi i membri del gruppo
    const membData=await apiGet('https://people.googleapis.com/v1/'+gruppo.resourceName+'?maxMembers=500');
    const members=membData.memberResourceNames||[];
    
    if(!members.length){
      setStatus('<span style="color:#854F0B">Gruppo vuoto.</span>');
      return;
    }

    setStatus('<span class="spinner"></span>'+members.length+' contatti. Carico dettagli...');

    // Step 3: batch get dei contatti
    const parsed=[];
    for(let i=0;i<members.length;i+=50){
      const chunk=members.slice(i,i+50);
      const qp=new URLSearchParams();
      chunk.forEach(m=>qp.append('resourceNames',m));
      qp.set('personFields','names,phoneNumbers,addresses,biographies,events');
      const data=await apiGet('https://people.googleapis.com/v1/people:batchGet?'+qp.toString());
      (data.responses||[]).forEach(r=>{
        const p=r.person;if(!p)return;
        const dates=(p.events||[]).filter(e=>e.date&&e.date.month).map(e=>({
          date:(e.date.year||new Date().getFullYear())+'-'+String(e.date.month).padStart(2,'0')+'-'+String(e.date.day||1).padStart(2,'0'),
          label:e.formattedType||e.displayName||e.type||'Data importante'
        }));
        parsed.push({
          id:p.resourceName,
          nome:p.names?.[0]?.displayName||'—',
          telefono:p.phoneNumbers?.[0]?.value||'',
          indirizzo:p.addresses?.[0]?.formattedValue||'',
          notes:p.biographies?.[0]?.value||'',
          dates
        });
      });
      setStatus('<span class="spinner"></span>Caricati '+(i+chunk.length)+'/'+members.length+'...');
    }

    contatti=parsed;lastSync=new Date().toLocaleString('it-IT');
    lsSet('pf_contatti',contatti);lsSet('pf_sync',lastSync);
    setStatus('<span style="color:#3B6D11">✓ '+parsed.length+' contatti · '+contatti.reduce((s,c)=>s+(c.dates||[]).length,0)+' date importate.</span>');
    setTimeout(()=>render(),1500);

  }catch(err){
    setStatus('<span style="color:#A32D2D">Errore: '+err.message+'</span>');
  }
}

function disconnectGoogle(){if(!confirm('Disconnettere?'))return;gToken=null;lsDel('pf_gtoken');render();}

function parseCanone(notes){
  if(!notes)return null;
  const m=notes.match(/canone\s+annuo\s*[€£]?\s*(\d[\d.,]*)/i);
  if(m)return parseFloat(m[1].replace(',','.'));
  return null;
}
function calcolaGiorni(month,day){
  const oggi=new Date();oggi.setHours(0,0,0,0);
  const d=new Date(oggi.getFullYear(),month,day);d.setHours(0,0,0,0);
  return Math.round((d-oggi)/(1000*60*60*24));
}
function getScadenzePerMese(month){
  const result=[];
  contatti.forEach(c=>{
    (c.dates||[]).forEach(entry=>{
      if(!entry.date)return;
      const d=new Date(entry.date);if(isNaN(d.getTime()))return;
      if(d.getMonth()===month)result.push({contatto:c,day:d.getDate(),month:d.getMonth(),label:entry.label||'',canone:parseCanone(c.notes),gg:calcolaGiorni(d.getMonth(),d.getDate())});
    });
  });
  return result.sort((a,b)=>a.day-b.day);
}
function fmtGg(gg){if(gg<0)return Math.abs(gg)+'gg fa';if(gg===0)return 'Oggi';if(gg===1)return 'Domani';return 'fra '+gg+'gg';}
function badgeCls(gg){return gg<0?'badge-red':gg<=14?'badge-orange':'badge-green';}
function cardCls(gg){return gg<0?'urgente':gg<=14?'warning':'ok';}

function renderDash(){
  const oggi=new Date();
  const mc=getScadenzePerMese(oggi.getMonth());
  const mn=getScadenzePerMese((oggi.getMonth()+1)%12);
  const scadute=mc.filter(s=>s.gg<0);
  const prox7=mc.filter(s=>s.gg>=0&&s.gg<=7);
  const nAtt=pianos.filter(p=>p.stato==='N').length;
  const nDep=pianos.filter(p=>p.stato==='D').length;
  const revAnno=pianos.filter(p=>p.stato==='N').reduce((s,p)=>s+(parseFloat(p.canone)||0),0);
  const potM=mc.reduce((s,x)=>s+(x.canone||0),0);
  const valNol=pianos.filter(p=>p.stato==='N').reduce((s,p)=>s+(parseFloat(p.costo)||0),0);
  const valDep=pianos.filter(p=>p.stato==='D').reduce((s,p)=>s+(parseFloat(p.costo)||0),0);
  const valTot=valNol+valDep;
  const potN=mn.reduce((s,x)=>s+(x.canone||0),0);
  return `
  ${scadute.length?`<div class="alert-banner alert-red" onclick="showTab('scadenze')"><div style="font-weight:500;font-size:13px;color:#A32D2D">${scadute.length} scadenz${scadute.length===1?'a':'e'} già passata${scadute.length===1?'':'e'} questo mese</div><div style="font-size:12px;color:#791F1F;margin-top:2px">${[...new Set(scadute.map(s=>s.contatto.nome))].join(', ')}</div></div>`:''}
  ${prox7.length?`<div class="alert-banner alert-orange" onclick="showTab('scadenze')"><div style="font-weight:500;font-size:13px;color:#854F0B">${prox7.length} scadenz${prox7.length===1?'a':'e'} nei prossimi 7 giorni</div><div style="font-size:12px;color:#633806;margin-top:2px">${[...new Set(prox7.map(s=>s.contatto.nome))].join(', ')}</div></div>`:''}
  <div class="metric-grid">

function handleExcel(input){
  const file=input.files[0];if(!file)return;
  const status=document.getElementById('import-status');
  status.textContent='Lettura...';
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets['Anagrafica']||wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      const clean=k=>String(k||'').trim();
      const num=k=>{const v=parseFloat(k);return isNaN(v)?'':v;};
      const parsed=rows.map(r=>({numero:num(r['NUMERO']),stato:clean(r['STATO']),marca:clean(r['MARCA']),modello:clean(r['MODELLO']),matricola:clean(r['MATRICOLA']),silent:clean(r['SILENT']),categoria:clean(r['CATEGORIA']),colore:clean(r['COLORE']),finitura:clean(r['FINITURA']),annoAcq:clean(r['ANNO ACQUISTO   '])||clean(r['ANNO ACQUISTO']),fornitore:clean(r['FORNITORE']),costo:num(r['COSTO TOTALE '])||num(r['COSTO TOTALE']),cliente:clean(r['CLIENTI']),canone:num(r['CANONE ANNUO']),note:clean(r['NOTE PIANOFORTE']),annoVendita:num(r['ANNO VENDITA']),totVendita:num(r['TOTALE   VENDITA'])||num(r['TOTALE VENDITA'])})).filter(p=>p.numero&&p.stato&&['N','D','V','R','RIP'].includes(p.stato));
      pianos=parsed;lsSet('pf_pianos',pianos);
      status.innerHTML=`<span style="color:#3B6D11">✓ ${pianos.length} piani importati.</span>`;
      setTimeout(()=>showTab('dash'),1200);
    }catch(err){status.innerHTML=`<span style="color:#A32D2D">Errore: ${err.message}</span>`;}
  };
  reader.readAsBinaryString(file);
}


function renderAnalisi(){
  // ── TREND ACQUISTI PER ANNO ──
  const acquistiPerAnno={};
  pianos.forEach(p=>{
    if(!p.annoAcq||!p.costo) return;
    const anno='20'+String(p.annoAcq).replace('20','');
    if(!acquistiPerAnno[anno]) acquistiPerAnno[anno]={n:0,invest:0};
    acquistiPerAnno[anno].n++;
    acquistiPerAnno[anno].invest+=parseFloat(p.costo)||0;
  });
  const anni=Object.keys(acquistiPerAnno).sort();
  const maxN=Math.max(...anni.map(a=>acquistiPerAnno[a].n),1);
  const maxI=Math.max(...anni.map(a=>acquistiPerAnno[a].invest),1);

  // ── ANALISI FORNITORI ──
  const fornitori={};
  pianos.forEach(p=>{
    if(!p.fornitore||!p.costo) return;
    const f=p.fornitore.trim()||'?';
    if(!fornitori[f]) fornitori[f]={n:0,invest:0};
    fornitori[f].n++;
    fornitori[f].invest+=parseFloat(p.costo)||0;
  });
  const topForn=Object.entries(fornitori).sort((a,b)=>b[1].n-a[1].n).slice(0,8);
  const maxFN=Math.max(...topForn.map(f=>f[1].n),1);

  // ── RENDIMENTO PIANI ──
  const rendimento=pianos.filter(p=>p.stato==='N'&&parseFloat(p.canone)>0&&parseFloat(p.costo)>0).map(p=>({
    numero:p.numero,
    marca:(p.marca||'').trim(),
    modello:p.modello||'',
    costo:parseFloat(p.costo),
    canone:parseFloat(p.canone),
    rend:Math.round(parseFloat(p.canone)/parseFloat(p.costo)*100),
    anni:Math.round(parseFloat(p.costo)/parseFloat(p.canone)*10)/10,
  })).sort((a,b)=>b.rend-a.rend);
  const topRend=rendimento.slice(0,10);
  const bottomRend=rendimento.slice(-5).reverse();
  const rendMedio=rendimento.length?Math.round(rendimento.reduce((s,p)=>s+p.rend,0)/rendimento.length):0;

  // ── STATO PARCO NEL TEMPO ──
  const vendPerAnno={};
  pianos.filter(p=>p.stato==='V'&&p.annoVendita).forEach(p=>{
    const a='20'+String(p.annoVendita).replace('20','');
    vendPerAnno[a]=(vendPerAnno[a]||0)+1;
  });

  return `
  <div style="font-size:15px;font-weight:500;margin-bottom:12px">Analisi parco piani</div>

  <!-- TREND ACQUISTI -->
  <div class="card">
    <div class="section-title">Acquisti per anno</div>
    ${anni.map(a=>{
      const d=acquistiPerAnno[a];
      return `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#666;margin-bottom:3px">
          <span><strong style="color:#1a1a1a">${a}</strong> — ${d.n} piani</span>
          <span>€${Math.round(d.invest).toLocaleString('it')}</span>
        </div>
        <div style="height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${Math.round(d.n/maxN*100)}%;background:#185FA5;border-radius:4px"></div>
        </div>
      </div>`;
    }).join('')}
    <div style="font-size:11px;color:#999;margin-top:8px;padding-top:8px;border-top:0.5px solid rgba(0,0,0,0.08)">
      Totale: ${pianos.length} piani · ${anni.length} anni di attività
    </div>
  </div>

  <!-- RENDIMENTO MEDIO -->
  <div class="card">
    <div class="section-title">Rendimento piani a noleggio</div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px">
      <div style="background:#f5f5f3;border-radius:8px;padding:12px">
        <div style="font-size:11px;color:#666;margin-bottom:4px">Rendimento medio</div>
        <div style="font-size:22px;font-weight:500">${rendMedio}%</div>
        <div style="font-size:11px;color:#666;margin-top:2px">canone/costo annuo</div>
      </div>
      <div style="background:#f5f5f3;border-radius:8px;padding:12px">
        <div style="font-size:11px;color:#666;margin-bottom:4px">Ammortamento medio</div>
        <div style="font-size:22px;font-weight:500">${rendimento.length?Math.round(rendimento.reduce((s,p)=>s+p.anni,0)/rendimento.length*10)/10:0}a</div>
        <div style="font-size:11px;color:#666;margin-top:2px">anni per rientrare</div>
      </div>
    </div>
    <div class="section-title">Top 10 — più redditizi</div>
    ${topRend.map(p=>`<div class="summary-row">
      <div><div style="font-weight:500;font-size:13px">${p.marca} ${p.modello} <span style="color:#999">#${p.numero}</span></div>
      <div style="font-size:11px;color:#666">€${Math.round(p.costo).toLocaleString('it')} acquisto · €${Math.round(p.canone)}/a canone</div></div>
      <div style="text-align:right">

  </div>

    <div class="section-title">Top fornitori per numero piani</div>
    ${topForn.map(([f,d])=>`<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:#666;margin-bottom:3px">
        <span><strong style="color:#1a1a1a">${f}</strong> — ${d.n} piani</span>
        <span>€${Math.round(d.invest).toLocaleString('it')} · media €${Math.round(d.invest/d.n).toLocaleString('it')}</span>
      </div>
      <div style="height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${Math.round(d.n/maxFN*100)}%;background:#534AB7;border-radius:4px"></div>
      </div>
    </div>`).join('')}
  </div>

  <!-- VENDITE PER ANNO -->
  ${Object.keys(vendPerAnno).length?`<div class="card">
    <div class="section-title">Vendite per anno</div>
    ${Object.entries(vendPerAnno).sort().map(([a,n])=>`<div class="summary-row"><span>${a}</span><span style="font-weight:500">${n} piani venduti</span></div>`).join('')}
  </div>`:''}

  ${pianos.length===0?'<div class="empty-state">Importa il file Excel per vedere le analisi.</div>':''}`;
}



let waCurrentTel = '';
function openWa(nome, tel, dataStr, canone){
  waCurrentTel = tel ? tel.replace(/\s/g,'') : '';
  document.getElementById('wa-nome').textContent = nome;
  document.getElementById('wa-tel').textContent = tel || 'Nessun telefono';
  const canoneStr = canone ? ' (canone €'+Math.round(canone)+'/anno)' : '';
  document.getElementById('wa-text').value = 'Messaggio di Promemoria Generato Automaticamente\n\nGentile '+nome+', augurandomi che proceda tutto per il meglio, le ricordo che in data '+dataStr+' è scaduto il noleggio annuale del pianoforte.\n\nRimango a disposizione\nIn attesa di un suo cordiale riscontro.\n\nCordiali saluti.\nAndrea';
  document.getElementById('wa-modal').style.display='flex';
}
function closeWaModal(e){
  if(!e||e.target===document.getElementById('wa-modal')) document.getElementById('wa-modal').style.display='none';
}
function sendWa(){
  const text = document.getElementById('wa-text').value;
  const tel = waCurrentTel.startsWith('+') ? waCurrentTel : '+39'+waCurrentTel;
  const url = 'https://wa.me/'+tel.replace('+','')+'/?text='+encodeURIComponent(text);
  window.open(url,'_blank');
  document.getElementById('wa-modal').style.display='none';
}

function clearContatti(){if(!confirm('Svuotare i contatti?'))return;contatti=[];lastSync=null;lsDel('pf_contatti');lsDel('pf_sync');render();}
function clearAll(){if(!confirm('Svuotare tutto?'))return;pianos=[];contatti=[];lastSync=null;gToken=null;['pf_pianos','pf_contatti','pf_sync','pf_gtoken'].forEach(k=>lsDel(k));render();}

load();render();
