<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;-webkit-tap-highlight-color:transparent}
#home{max-width:480px;margin:0 auto;padding:14px 16px 36px;min-height:100vh}
.logo-wrap{text-align:center;padding:20px 0 4px}
.logo-wrap svg{width:60%;max-width:230px;height:auto}
.subtitle{text-align:center;font-size:12px;color:#999;letter-spacing:.03em;margin-bottom:24px}
.menu{display:flex;flex-direction:column;gap:11px}
.navbtn{display:flex;align-items:center;gap:14px;width:100%;background:#A01020;color:#fff;border:none;border-radius:14px;padding:18px 18px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;text-align:left;line-height:1.2;transition:transform .08s,background .15s}
.navbtn:hover{background:#8a0e1b}
.navbtn:active{transform:scale(.985)}
.navbtn svg{width:24px;height:24px;flex-shrink:0}
.navbtn .lbl{flex:1}
.navbtn .chev{font-size:20px;opacity:.55;font-weight:400}
.divider{height:1px;background:#e3e3e3;margin:5px 4px}
#viewer{display:none;position:fixed;inset:0;background:#fff;flex-direction:column;z-index:1000}
.topbar{display:flex;align-items:center;gap:11px;padding:10px 12px;background:#fff;border-bottom:.5px solid #e0e0e0;flex-shrink:0}
.backbtn{display:flex;align-items:center;gap:4px;background:#fff;border:.5px solid #A01020;color:#A01020;font-weight:600;font-size:14px;padding:8px 14px;border-radius:9px;cursor:pointer;font-family:inherit;white-space:nowrap}
.backbtn:active{background:#fdeced}
.sec-title{font-size:15px;font-weight:600;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
var SECTIONS=[
  {label:"Sincronizza Google",app:"https://farifarifarifari.github.io/gestionale-pianoforti/",tab:"sync"},
  {label:"Dashboard",app:"https://farifarifarifari.github.io/gestionale-pianoforti/",tab:"dash"},
  {label:"Clienti",app:"https://farifarifarifari.github.io/gestionale-pianoforti/",tab:"clienti"},
  {label:"Annunci Subito.it",app:"https://farifarifarifari.github.io/annunci-subito/",tab:"annuncio"},
  {label:"Preventivi",app:"https://farifarifarifari.github.io/annunci-subito/",tab:"preventivi"},
  {label:"Contratti",app:"https://farifarifarifari.github.io/gestionale-pianoforti/",tab:"contratti"},
  {label:"Concerti",app:"https://farifarifarifari.github.io/gestionale-pianoforti/",tab:"concerti"},
  {label:"Analisi",app:"https://farifarifarifari.github.io/gestionale-pianoforti/",tab:"analisi"},
  {label:"Importa Excel",app:"https://farifarifarifari.github.io/gestionale-pianoforti/",tab:"import"},
  {label:"Ricerca Matricole",app:"https://farifarifarifari.github.io/annunci-subito/",tab:"matricole"}
];
var FRAME=document.getElementById("frame");
var loadedApp=null;
function openSection(i){
  var s=SECTIONS[i];
  document.getElementById("sec-title").textContent=s.label;
  document.getElementById("home").style.display="none";
  document.getElementById("viewer").style.display="flex";
  window.scrollTo(0,0);
  if(loadedApp===s.app){applyTab(s.tab);}
  else{
    loadedApp=s.app;
    FRAME.onload=function(){injectHide();applyTab(s.tab);};
    FRAME.src=s.app;
  }
  history.pushState({pp:"sec"},"");
}
function applyTab(tab){
  try{if(FRAME.contentWindow&&FRAME.contentWindow.showTab)FRAME.contentWindow.showTab(tab);}catch(e){}
}
function injectHide(){
  try{
    var d=FRAME.contentDocument;
    if(!d||d.getElementById("pp-merge-style"))return;
    var st=d.createElement("style");
    st.id="pp-merge-style";
    st.textContent="nav{display:none!important}.tab-nav{display:none!important}";
    (d.head||d.documentElement).appendChild(st);
  }catch(e){}
}
function showHome(){
  document.getElementById("viewer").style.display="none";
  document.getElementById("home").style.display="block";
}
function goHome(){if(history.state&&history.state.pp==="sec"){history.back();}else{showHome();}}
window.addEventListener("popstate",showHome);
window.addEventListener("keydown",function(e){if(e.key==="Escape"&&document.getElementById("viewer").style.display!=="none")goHome();});

// Ritorno dal login Google: la pagina gestionale (fuori dalla Suite, dove Google
// e' tornato dopo l'OAuth) ci rimanda qui con ?tab=xxx per riaprire subito la sezione giusta.
(function(){
  var qp=new URLSearchParams(window.location.search);
  var tab=qp.get("tab");
  if(tab){
    var idx=SECTIONS.findIndex(function(s){return s.tab===tab;});
    if(idx>-1){
      history.replaceState(null,"",window.location.pathname);
      openSection(idx);
    }
  }
})();
</script>
