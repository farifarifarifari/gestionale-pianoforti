<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestionale Pianoforti</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f5}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
nav{background:#fff;border-bottom:0.5px solid #e0e0e0;display:flex;position:sticky;top:0;z-index:10;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none} nav button{flex:0 0 auto;padding:10px 8px;min-width:60px;font-size:10px;font-weight:500;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;color:#999;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.active{border-bottom:2px solid #A01020;color:#A01020}
nav button svg{width:18px;height:18px}
main{flex:1;padding:8px 12px;padding-bottom:20px}
.card{background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:1rem;margin-bottom:12px}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.metric{background:#f5f5f5;border-radius:8px;padding:12px;border:0.5px solid #e8e8e8}
.metric-label{font-size:11px;color:#888;margin-bottom:4px}
.metric-value{font-size:22px;font-weight:500;color:#1a1a1a}
.metric-sub{font-size:11px;color:#888;margin-top:2px}
.section-title{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px}
.scad-card{background:#fff;border:0.5px solid #e0e0e0;border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.scad-card:hover{background:#fafafa}
.scad-card.urgente{border-left:3px solid #E24B4A}
.scad-card.warning{border-left:3px solid #EF9F27}
.scad-card.ok{border-left:3px solid #639922}
.scad-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.scad-nome{font-weight:500;font-size:14px}
.scad-meta{font-size:12px;color:#888;margin-top:3px}
.badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500;white-space:nowrap}
.badge-red{background:#FCEBEB;color:#791F1F}
.badge-orange{background:#FAEEDA;color:#633806}
.badge-green{background:#EAF3DE;color:#A01020}
.badge-blue{background:#fdeced;color:#A01020}
.piano-card{background:#fff;border:0.5px solid #e0e0e0;border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.piano-card:hover{background:#fafafa}
.piano-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.piano-meta{font-size:12px;color:#888;display:flex;gap:8px;flex-wrap:wrap}
.search-bar{margin-bottom:10px}
.search-bar input{width:100%;padding:8px 12px;border:0.5px solid #e0e0e0;border-radius:8px;font-size:14px;background:#fff;color:#1a1a1a;outline:none}
.search-bar input:focus{border-color:#A01020}
.filter-row{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.filter-btn{padding:5px 12px;border:0.5px solid #e0e0e0;border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;background:#fff;color:#888}
.filter-btn.active{background:rgba(160,16,32,0.90);color:#fff;border-color:#A01020}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:0.5px solid #f0f0f0;font-size:13px}
.summary-row:last-child{border-bottom:none}
.bar-wrap{margin-bottom:8px}
.bar-label{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:3px}
.bar{height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:#555}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:100;display:flex;align-items:flex-end}
.sheet{background:#fff;border-radius:16px 16px 0 0;padding:16px;width:100%;max-height:85vh;overflow-y:auto}
.detail-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:0.5px solid #f0f0f0;font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:#888;flex-shrink:0;margin-right:12px}
.close-btn{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:#aaa;line-height:1}
.btn-primary{background:rgba(160,16,32,0.90);color:#fff;border:none;padding:11px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;width:100%}
.btn-primary:hover{background:#A01020}
.btn-secondary{background:none;color:#888;border:0.5px solid #e0e0e0;padding:9px;border-radius:8px;font-size:13px;cursor:pointer;width:100%;margin-top:8px}
.btn-google{background:#fff;color:#3c4043;border:0.5px solid #e0e0e0;padding:11px 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.btn-google:hover{background:#fafafa}
.upload-area{border:1.5px dashed #e0e0e0;border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;margin-bottom:12px}
.upload-area:hover{background:#fafafa}
.empty-state{text-align:center;padding:48px 16px;color:#888}
.alert-banner{border-radius:8px;padding:10px 14px;margin-bottom:10px;cursor:pointer}
.alert-red{background:#FCEBEB;border-left:3px solid #E24B4A}
.alert-orange{background:#FAEEDA;border-left:3px solid #EF9F27}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.month-nav button{background:none;border:0.5px solid #e0e0e0;border-radius:8px;padding:7px 16px;cursor:pointer;font-size:13px;color:#1a1a1a}
.month-nav span{font-size:15px;font-weight:500}
.month-totals{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:0.5px solid #f0f0f0}
.day-label{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin:12px 0 6px}
.connected-dot{width:8px;height:8px;border-radius:50%;background:#639922;display:inline-block;margin-right:6px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #e0e0e0;border-top-color:#A01020;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.wa-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.wa-box{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:440px}
.wa-box textarea{width:100%;height:120px;padding:10px;border:0.5px solid #e0e0e0;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;margin:12px 0}
.wa-box .wa-nome{font-size:15px;font-weight:500;margin-bottom:4px}
.wa-box .wa-sub{font-size:12px;color:#888;margin-bottom:12px}
.btn-wa{background:#25D366;color:#fff;border:none;padding:11px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-wa:hover{background:#1da851}
.btn-wa-small{background:#25D366;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap}
.sent-badge{font-size:10px;color:#A01020;background:#fdeced;padding:2px 6px;border-radius:8px;display:inline-flex;align-items:center;gap:3px;margin-top:3px}
.hero-card{background:rgba(160,16,32,0.90);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-end}
.report-banner{background:#fff;border:1.5px solid #A01020;border-radius:12px;padding:14px;margin-bottom:12px}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const CLIENT_ID='267543971233-fsb8goidid2r97ddgii7lvn0ntl9fjnr.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/contacts.readonly https://www.googleapis.com/auth/drive.file';
const MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const MONTHS_SHORT=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
let pianos=[],contatti=[],lastSync=null,gToken=null;
let currentTab='dash',filterStato='ALL',searchQ='';
let viewMonth=new Date().getMonth(),viewYear=new Date().getFullYear();
let clientiSezione='scadenze';

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

function load(){
  try{const d=lsGet('pf_pianos');if(d)pianos=JSON.parse(d);}catch(e){}
  try{const d=lsGet('pf_contatti');if(d)contatti=JSON.parse(d);}catch(e){}
  try{const d=lsGet('pf_sync');if(d)lastSync=d;}catch(e){}
  try{const d=lsGet('pf_gtoken');if(d)gToken=d;}catch(e){}
  const hash=window.location.hash;
  if(hash&&hash.includes('access_token')){
    const params=new URLSearchParams(hash.substring(1));
    const tok=params.get('access_token');
    if(tok){
      gToken=tok;lsSet('pf_gtoken',tok);
      history.replaceState(null,'',window.location.pathname);
      setTimeout(()=>{showTab('sync');syncContatti();},500);
    }
  }
}

function showTab(t){
  currentTab=t;searchQ='';
  ['dash','clienti','sync','analisi','import','contratti'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('active',x===t));
  render();
}
function render(){
  const m=document.getElementById('main-content');
  if(currentTab==='dash')m.innerHTML=renderDash();
  else if(currentTab==='clienti')m.innerHTML=renderClienti();
  else if(currentTab==='sync')m.innerHTML=renderSync();
  else if(currentTab==='analisi')m.innerHTML=renderAnalisi();
  else if(currentTab==='import')m.innerHTML=renderImport();
  else if(currentTab==='contratti')m.innerHTML=renderContratti();
}

function googleAuth(){
  const redirectUri=window.location.origin+window.location.pathname;
  const params=new URLSearchParams({client_id:CLIENT_ID,redirect_uri:redirectUri,response_type:'token',scope:SCOPE,prompt:'consent'});
  window.location.href='https://accounts.google.com/o/oauth2/v2/auth?'+params.toString();
}

async function apiGet(url){
  const res=await fetch(url,{headers:{Authorization:'Bearer '+gToken}});
  if(res.status===401){gToken=null;lsDel('pf_gtoken');render();throw new Error('Token scaduto. Riconnetti.');}
  const data=await res.json();
  if(data.error)throw new Error(data.error.message);
  return data;
}

async function syncContatti(){
  if(!gToken){googleAuth();return;}
  const setStatus=msg=>{const el=document.getElementById('sync-status');if(el)el.innerHTML=msg;};
  setStatus('<span class="spinner"></span>Cerco gruppi...');
  try{
    // Step 1: trova ID del gruppo NOLO LUNGO TERMINE
    const groupsData=await apiGet('https://people.googleapis.com/v1/contactGroups?pageSize=200&groupFields=name,memberCount');
    const gruppi=groupsData.contactGroups||[];
    
    // Debug: mostra tutti i gruppi
    const nomiGruppi=gruppi.map(g=>g.name+'('+g.memberCount+')').join(' | ');
    setStatus('<span class="spinner"></span>Gruppi trovati: '+nomiGruppi);
    
    const gruppo=gruppi.find(g=>{
      const n=(g.name||'').toUpperCase();
      const fn=(g.formattedName||'').toUpperCase();
      return n.includes('NOLO')||fn.includes('NOLO');
    });
    
    if(!gruppo){
      setStatus('<span style="color:#A32D2D">Gruppo NOLO non trovato. Gruppi disponibili: '+nomiGruppi+'</span>');
      return;
    }

    setStatus('<span class="spinner"></span>Gruppo trovato: '+gruppo.name+' ('+gruppo.memberCount+' membri). Carico...');

    // Step 2: prendi i membri del gruppo
    const membData=await apiGet('https://people.googleapis.com/v1/'+gruppo.resourceName+'?maxMembers=500');
    const members=membData.memberResourceNames||[];
    
    if(!members.length){
      setStatus('<span style="color:#854F0B">Gruppo vuoto.</span>');
      return;
    }

    setStatus('<span class="spinner"></span>'+members.length+' contatti. Carico dettagli...');

    // Step 3: batch get dei contatti
    const parsed=[];
    for(let i=0;i<members.length;i+=50){
      const chunk=members.slice(i,i+50);
      const qp=new URLSearchParams();
      chunk.forEach(m=>qp.append('resourceNames',m));
      qp.set('personFields','names,phoneNumbers,addresses,biographies,events');
      const data=await apiGet('https://people.googleapis.com/v1/people:batchGet?'+qp.toString());
      (data.responses||[]).forEach(r=>{
        const p=r.person;if(!p)return;
        const dates=(p.events||[]).filter(e=>e.date&&e.date.month).map(e=>({
          date:(e.date.year||new Date().getFullYear())+'-'+String(e.date.month).padStart(2,'0')+'-'+String(e.date.day||1).padStart(2,'0'),
          label:e.formattedType||e.displayName||e.type||'Data importante'
        }));
        parsed.push({
          id:p.resourceName,
          nome:p.names?.[0]?.displayName||'—',
          telefono:p.phoneNumbers?.[0]?.value||'',
          indirizzo:p.addresses?.[0]?.formattedValue||'',
          notes:p.biographies?.[0]?.value||'',
          dates
        });
      });
      setStatus('<span class="spinner"></span>Caricati '+(i+chunk.length)+'/'+members.length+'...');
    }

    contatti=parsed;lastSync=new Date().toLocaleString('it-IT');
    lsSet('pf_contatti',contatti);lsSet('pf_sync',lastSync);
    setStatus('<span style="color:#A01020">✓ '+parsed.length+' contatti · '+contatti.reduce((s,c)=>s+(c.dates||[]).length,0)+' date importate.</span>');
    setTimeout(()=>render(),1500);

  }catch(err){
    setStatus('<span style="color:#A32D2D">Errore: '+err.message+'</span>');
  }
}

function disconnectGoogle(){if(!confirm('Disconnettere?'))return;gToken=null;lsDel('pf_gtoken');render();}

function parseCanone(notes){
  if(!notes)return null;
  const m=notes.match(/canone\s+annuo\s*[€£]?\s*(\d[\d.,]*)/i);
  if(m)return parseFloat(m[1].replace(',','.'));
  return null;
}
function calcolaGiorni(month,day){
  const oggi=new Date();oggi.setHours(0,0,0,0);
  const d=new Date(oggi.getFullYear(),month,day);d.setHours(0,0,0,0);
  return Math.round((d-oggi)/(1000*60*60*24));
}
function getScadenzePerMese(month){
  const result=[];
  contatti.forEach(c=>{
    (c.dates||[]).forEach(entry=>{
      if(!entry.date)return;
      const d=new Date(entry.date);if(isNaN(d.getTime()))return;
      if(d.getMonth()===month)result.push({contatto:c,day:d.getDate(),month:d.getMonth(),label:entry.label||'',canone:parseCanone(c.notes),gg:calcolaGiorni(d.getMonth(),d.getDate())});
    });
  });
  return result.sort((a,b)=>a.day-b.day);
}
function fmtGg(gg){if(gg<0)return Math.abs(gg)+'gg fa';if(gg===0)return 'Oggi';if(gg===1)return 'Domani';return 'fra '+gg+'gg';}
function badgeCls(gg){return gg<0?'badge-red':gg<=14?'badge-orange':'badge-green';}
function cardCls(gg){return gg<0?'urgente':gg<=14?'warning':'ok';}

function renderDash(){
  const oggi=new Date();
  const mc=getScadenzePerMese(oggi.getMonth());
  const mn=getScadenzePerMese((oggi.getMonth()+1)%12);
  const scadute=mc.filter(s=>s.gg<0);
  const prox7=mc.filter(s=>s.gg>=0&&s.gg<=7);
  const nAtt=pianos.filter(p=>p.stato==='N').length;
  const nDep=pianos.filter(p=>p.stato==='D').length;
  const revAnno=pianos.filter(p=>p.stato==='N').reduce((s,p)=>s+(parseFloat(p.canone)||0),0);
  const potM=mc.reduce((s,x)=>s+(x.canone||0),0);

function handleExcel(input){
  const file=input.files[0];if(!file)return;
  const status=document.getElementById('import-status');
  status.textContent='Lettura...';
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets['Anagrafica']||wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      // Map column AB (index 27) by cell address for cinese
      const cinesiMap={};
      const range=XLSX.utils.decode_range(ws['!ref']||'A1');
      for(let r=range.s.r+1;r<=range.e.r;r++){
        const numCell=ws[XLSX.utils.encode_cell({r:r,c:0})];
        const cinCell=ws[XLSX.utils.encode_cell({r:r,c:28})];
        if(numCell&&cinCell&&cinCell.v) cinesiMap[parseFloat(numCell.v)]='C';
      }
      const clean=k=>String(k||'').trim();
      const num=k=>{const v=parseFloat(k);return isNaN(v)?'':v;};
      const parsed=rows.map(r=>({numero:num(r['NUMERO']),stato:clean(r['STATO']),marca:clean(r['MARCA']),modello:clean(r['MODELLO']),matricola:clean(r['MATRICOLA']),silent:clean(r['SILENT']),categoria:clean(r['CATEGORIA']),colore:clean(r['COLORE']),finitura:clean(r['FINITURA']),annoAcq:clean(r['ANNO ACQUISTO   '])||clean(r['ANNO ACQUISTO']),fornitore:clean(r['FORNITORE']),costo:num(r['COSTO TOTALE '])||num(r['COSTO TOTALE']),cliente:clean(r['CLIENTI']),canone:num(r['CANONE ANNUO']),note:clean(r['NOTE PIANOFORTE']),annoVendita:num(r['ANNO VENDITA']),totVendita:num(r['TOTALE   VENDITA'])||num(r['TOTALE VENDITA']),cinese:cinesiMap[parseFloat(r['NUMERO'])]||'',annoCostr:clean(r['ANNO COSTRUZIONE'])})).filter(p=>p.numero&&p.stato&&['N','D','V','R','RIP'].includes(p.stato));
      pianos=parsed;lsSet('pf_pianos',pianos);
      status.innerHTML=`<span style="color:#A01020">✓ ${pianos.length} piani importati.</span>`;
      setTimeout(()=>showTab('dash'),1200);
    }catch(err){status.innerHTML=`<span style="color:#A32D2D">Errore: ${err.message}</span>`;}
  };
  reader.readAsBinaryString(file);
}


function renderAnalisi(){
  // ── TREND ACQUISTI PER ANNO ──
  const acquistiPerAnno={};
  pianos.forEach(p=>{
    if(!p.annoAcq||!p.costo) return;
    const anno='20'+String(p.annoAcq).replace('20','');
    if(!acquistiPerAnno[anno]) acquistiPerAnno[anno]={n:0,invest:0};
    acquistiPerAnno[anno].n++;
    acquistiPerAnno[anno].invest+=parseFloat(p.costo)||0;
  });
  const anni=Object.keys(acquistiPerAnno).sort();
  const maxN=Math.max(...anni.map(a=>acquistiPerAnno[a].n),1);
  const maxI=Math.max(...anni.map(a=>acquistiPerAnno[a].invest),1);

  // ── ANALISI FORNITORI ──
  const fornitori={};
  pianos.forEach(p=>{
    if(!p.fornitore||!p.costo) return;
    const f=p.fornitore.trim()||'?';
    if(!fornitori[f]) fornitori[f]={n:0,invest:0};
    fornitori[f].n++;
    fornitori[f].invest+=parseFloat(p.costo)||0;
  });
  const topForn=Object.entries(fornitori).sort((a,b)=>b[1].n-a[1].n).slice(0,8);
  const maxFN=Math.max(...topForn.map(f=>f[1].n),1);

  // ── RENDIMENTO PIANI ──
  const rendimento=pianos.filter(p=>p.stato==='N'&&parseFloat(p.canone)>0&&parseFloat(p.costo)>0).map(p=>({
    numero:p.numero,
    marca:(p.marca||'').trim(),
    modello:p.modello||'',
    costo:parseFloat(p.costo),
    canone:parseFloat(p.canone),
    rend:Math.round(parseFloat(p.canone)/parseFloat(p.costo)*100),
    anni:Math.round(parseFloat(p.costo)/parseFloat(p.canone)*10)/10,
  })).sort((a,b)=>b.rend-a.rend);
  const topRend=rendimento.slice(0,10);
  const bottomRend=rendimento.slice(-5).reverse();
  const rendMedio=rendimento.length?Math.round(rendimento.reduce((s,p)=>s+p.rend,0)/rendimento.length):0;

  // ── STATO PARCO NEL TEMPO ──
  const vendPerAnno={};
  pianos.filter(p=>p.stato==='V'&&p.annoVendita).forEach(p=>{
    const a='20'+String(p.annoVendita).replace('20','');
    vendPerAnno[a]=(vendPerAnno[a]||0)+1;
  });

  return `

function getMondayBanner(){
  const oggi=new Date();
  if(oggi.getDay()!==1) return '';
  const MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const nextM=(oggi.getMonth()+1)%12;
  const nextMYear=oggi.getMonth()===11?oggi.getFullYear()+1:oggi.getFullYear();
  const scadNext=getScadenzePerMese(nextM);
  if(!scadNext.length||lsGet('pf_banner_'+oggi.toDateString())) return '';
  const tot=scadNext.reduce((s,x)=>s+(x.canone||0),0);
  return '<div class="report-banner">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">'
    +'<div><div style="font-size:13px;font-weight:600;color:#A01020">Report scadenze '+MONTHS[nextM]+'</div>'
    +'<div style="font-size:11px;color:#888;margin-top:2px">'+scadNext.length+' clienti · EUR '+Math.round(tot).toLocaleString('it')+' pot.</div></div>'
    +'<button onclick="dismissBanner()" style="background:none;border:none;cursor:pointer;color:#ccc;font-size:18px;line-height:1">x</button></div>'
    +'<button onclick="copyReport()" style="width:100%;background:rgba(160,16,32,0.90);color:#fff;border:none;padding:10px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer">Copia report negli appunti</button>'
    +'</div>';
}

function dismissBanner(){
  lsSet('pf_banner_'+new Date().toDateString(),'1');render();
}

function copyReport(){
  const oggi=new Date();
  const MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const nextM=(oggi.getMonth()+1)%12;
  const nextMYear=oggi.getMonth()===11?oggi.getFullYear()+1:oggi.getFullYear();
  const scadNext=getScadenzePerMese(nextM);
  let txt='SCADENZE NOLEGGIO - '+MONTHS[nextM].toUpperCase()+' '+nextMYear+'\n';
  txt+='================================\n\n';
  scadNext.forEach((s,i)=>{
    txt+=(i+1)+'. '+s.contatto.nome+'\n';
    txt+='   Data: '+s.day+' '+MONTHS[s.month]+'\n';
    if(s.contatto.telefono) txt+='   Tel: '+s.contatto.telefono+'\n';
    if(s.canone) txt+='   Canone: EUR '+Math.round(s.canone)+'/anno\n';
    txt+='\n';
  });
  const tot=scadNext.reduce((s,x)=>s+(x.canone||0),0);
  txt+='================================\n';
  txt+='Totale: '+scadNext.length+' clienti';
  if(tot>0) txt+=' - EUR '+Math.round(tot).toLocaleString('it')+' potenziali';
  navigator.clipboard.writeText(txt).then(()=>{
    const btn=document.querySelector('[onclick="copyReport()"]');
    if(btn){btn.textContent='Copiato!';setTimeout(()=>{if(btn)btn.textContent='Copia report negli appunti';},2000);}
  }).catch(()=>{});
}

function renderYamahaEta(){
  if(!pianos.length) return '';
  const oggi=new Date().getFullYear();
  function etaMedia(arr){
    const valid=arr.filter(p=>p.annoCostr&&parseInt(p.annoCostr)>1900);
    if(!valid.length) return null;
    const avg=valid.reduce((s,p)=>s+parseInt(p.annoCostr),0)/valid.length;
    return {anno:Math.round(avg),eta:Math.round(oggi-avg),n:valid.length};
  }
  function riga(label,stat){
    if(!stat) return '<div class="summary-row"><span>'+label+'</span><span style="color:#aaa">n/d</span></div>';
    return '<div class="summary-row"><span>'+label+' <span style="font-size:11px;color:#aaa">('+stat.n+')</span></span><div style="text-align:right"><span style="font-weight:500;color:#A01020">'+stat.anno+'</span><span style="font-size:11px;color:#888;margin-left:6px">~'+stat.eta+' anni</span></div></div>';
  }
  const yP=pianos.filter(p=>(p.marca||'').toUpperCase()==='YAMAHA'&&(p.stato==='N'||p.stato==='D'));
  const yV=pianos.filter(p=>(p.marca||'').toUpperCase()==='YAMAHA'&&p.stato==='V');
  let h='<div class="card"><div class="section-title">Yamaha — Eta media per categoria</div>';
  h+='<div style="font-size:12px;font-weight:600;color:#555;margin:4px 0 6px">In possesso (N + D)</div>';
  h+=riga('Verticali (tutti)',etaMedia(yP.filter(p=>p.categoria==='VE')));
  h+=riga('Code',etaMedia(yP.filter(p=>p.categoria==='CO')));
  h+=riga('Verticali Silent',etaMedia(yP.filter(p=>p.categoria==='VE'&&p.silent==='S')));
  h+='<div style="height:0.5px;background:#f0f0f0;margin:10px 0"></div>';
  h+='<div style="font-size:12px;font-weight:600;color:#555;margin-bottom:6px">Venduti</div>';
  h+=riga('Verticali (tutti)',etaMedia(yV.filter(p=>p.categoria==='VE')));
  h+=riga('Code',etaMedia(yV.filter(p=>p.categoria==='CO')));
  h+=riga('Verticali Silent',etaMedia(yV.filter(p=>p.categoria==='VE'&&p.silent==='S')));
  h+='</div>';
  return h;
}

function selezionaClienteContratto(id){
  const c=contatti.find(x=>x.id===id);
  if(!c) return;
  const notes=c.notes||'';

  // Parse notes line by line
  const lines=notes.split('\n');
  let cf='',marca='',modello='',matricola='',canone='',trasporto='',colore='',finitura='';
  const silentM=notes.toLowerCase().includes('silent');
  const emailM=notes.match(/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i);

  lines.forEach(line=>{
    const l=line.trim();
    // CF: "C.F. XXXXXXXXXXXXXXXX"
    const cfMatch=l.match(/C\.F\.\s+([A-Z0-9]{6,16})/i);
    if(cfMatch) cf=cfMatch[1].toUpperCase();

    // "Yamaha U3A Matricola 4272290"
    const pianoMatch=l.match(/^(\S+)\s+(\S+)\s+Matricola\s+(\d+)/i);
    if(pianoMatch){marca=pianoMatch[1].toUpperCase();modello=pianoMatch[2].toUpperCase();matricola=pianoMatch[3];}

    // "Canone Annuo € 660 + € 200 Trasporto"
    const canoneMatch=l.match(/Canone\s+Annuo[^\d]*(\d+)/i);
    if(canoneMatch) canone=canoneMatch[1];
    const trasportoMatch=l.match(/\+[^\d]*(\d+)\s*Trasporto/i);
    if(trasportoMatch) trasporto=trasportoMatch[1];

    // Colore/Finitura se scritti esplicitamente
    const coloreMatch=l.match(/^Colore[:\s]+(.+)/i);
    if(coloreMatch) colore=coloreMatch[1].trim().toUpperCase();
    const finituraMatch=l.match(/^Finitura[:\s]+(.+)/i);
    if(finituraMatch) finitura=finituraMatch[1].trim();
  });

  contrattoForm={
    ...contrattoForm,
    clienteId:c.id,
    nome:c.nome,
    indirizzo:(c.indirizzo||'').replace(/\n/g,' ').replace(/\s+/g,' ').trim(),
    telefono:(c.telefono||'').replace(/^\+39\s*/,''),
    email:emailM?emailM[0]:'',
    cf,marca,modello,matricola,colore,finitura,
    canone,
    trasportoConsegna:trasporto,
    silent:silentM,
  };
  contrattoClienteSearch='';
  render();
}

async function generaContratto(){
  const btn=document.getElementById('btn-genera');
  const status=document.getElementById('contratto-status');
  btn.disabled=true;btn.textContent='Generazione...';
  const f=contrattoForm;
  const num=parseInt(lsGet('pf_contratto_num')||'333');
  const canoneM=f.canone?Math.round(parseFloat(f.canone)/12):0;
  const rataMesi=f.tipoRata==='personalizzato'?f.mesiRata:
    f.tipoRata==='annuale'?12:f.tipoRata==='semestrale'?6:
    f.tipoRata==='quadrimestrale'?4:f.tipoRata==='trimestrale'?3:1;
  const rataLabel=f.tipoRata==='personalizzato'?'ogni '+f.mesiRata+' mesi':
    f.tipoRata==='annuale'?'Annuali Anticipate':
    f.tipoRata==='semestrale'?'Semestrali':
    f.tipoRata==='quadrimestrale'?'Quadrimestrali':
    f.tipoRata==='trimestrale'?'Trimestrali':'Mensili';
  const rataImporto=Math.round(parseFloat(f.canone||0)/12*rataMesi);
  const dataFmt=f.dataInizio?new Date(f.dataInizio).toLocaleDateString('it-IT'):'';

  try{
    status.innerHTML='<span class="spinner"></span>Invio dati ad Apps Script...';
    const payload={
      numero:num,
      nome:f.nome,
      indirizzo:f.indirizzo,
      telefono:f.telefono,
      cf:f.cf||'',
      email:f.email||'',
      marca:f.marca,
      modello:f.modello+(f.silent?' (SILENT)':''),
      colore:f.colore,
      finitura:f.finitura,
      matricola:f.matricola,
      valore:f.valore,
      valore_sgabello:'80',
      silent:f.silent,
      canone:f.canone,
      canone_mensile:String(canoneM)+'.00',
      tipo_rata:rataLabel,
      durata:f.durataAnni,
      trasporto_consegna:f.trasportoConsegna||'0',
      trasporto_ritiro:f.trasportoRitiro||'0',
      tipo_contratto:f.tipoContratto,
      data_inizio:f.dataInizio,
      luogo:f.luogo,
      nome_breve:f.nome.split(' ')[0],
    };

    // Apps Script requires no-cors for POST, use GET with params for simple calls
    // Or use a form submit approach
    const res=await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      body:JSON.stringify(payload),
      headers:{'Content-Type':'text/plain'},
      redirect:'follow'
    });
    const text=await res.text();
    let data;
    try{ data=JSON.parse(text); }
    catch(e){ throw new Error('Risposta non valida da Apps Script: '+text.substring(0,100)); }

    if(data.success){
      lsSet('pf_contratto_num',String(num+1));
      status.innerHTML='<span style="color:#A01020;font-weight:500">✓ Contratto #'+num+' salvato su Drive!</span>'
        +(data.pdfUrl?'<br><a href="'+data.pdfUrl+'" target="_blank" style="font-size:12px;color:#A01020">Apri PDF →</a>':'');
      btn.textContent='✓ Salvato';
    } else {
      throw new Error(data.error||'Errore sconosciuto');
    }
  }catch(err){
    status.innerHTML='<span style="color:#A32D2D">Errore: '+err.message+'</span>';
    btn.disabled=false;btn.textContent='Riprova';
  }
}

async function uploadDrive(blob,mime,name,folder){
  const meta={name,parents:[folder]};
  const form=new FormData();
  form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
  form.append('file',blob);
  const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
    method:'POST',headers:{Authorization:'Bearer '+gToken},body:form
  });
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'Upload fallito');}
  return res.json();
}

async function loadJSZip(){
  if(window.JSZip) return window.JSZip;
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload=()=>resolve(window.JSZip);
    s.onerror=()=>reject(new Error('JSZip non caricato'));
    document.head.appendChild(s);
  });
}
