<title>Gestionale Pianoforti</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f5}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
nav{background:#fff;border-bottom:0.5px solid #e0e0e0;display:flex;position:sticky;top:0;z-index:10;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none} nav button{flex:1 1 0;padding:10px 8px;min-width:60px;font-size:10px;font-weight:500;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;color:#999;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.active{border-bottom:2px solid #A01020;color:#A01020}
nav button svg{width:18px;height:18px}
main{flex:1;padding:8px 12px;padding-bottom:20px}
.card{background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:1rem;margin-bottom:12px}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.metric{background:#f5f5f5;border-radius:8px;padding:12px;border:0.5px solid #e8e8e8}
.metric-label{font-size:11px;color:#888;margin-bottom:4px}
.metric-value{font-size:22px;font-weight:500;color:#1a1a1a}
.metric-sub{font-size:11px;color:#888;margin-top:2px}

<script>
const CLIENT_ID='267543971233-fsb8goidid2r97ddgii7lvn0ntl9fjnr.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/contacts.readonly https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/tasks';
const MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const MONTHS_SHORT=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
let pianos=[],contatti=[],lastSync=null,gToken=null;
let currentTab='dash',filterStato='ALL',searchQ='';
let viewMonth=new Date().getMonth(),viewYear=new Date().getFullYear();
let clientiSezione='scadenze';

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

// Il token di Google vive circa un'ora. Prima restava salvato per sempre: la tab Sync
// diceva "Google connesso" anche quando era morto, e il primo comando che chiamava
// Google falliva chiedendo di ricollegarsi - il doppio passaggio. Ora la scadenza
// si segna al momento del login e si controlla prima di fidarsi del token.
function tokenBuono(){
  var s=lsGet('pf_gtoken_scad');
  if(!s) return true; // token vecchio stile, senza scadenza segnata: ci prova
  return Date.now() < (parseInt(s,10)||0);
}

function load(){
  try{const d=lsGet('pf_pianos');if(d)pianos=JSON.parse(d);}catch(e){}
  try{const d=lsGet('pf_contatti');if(d)contatti=JSON.parse(d);}catch(e){}
  try{const d=lsGet('pf_sync');if(d)lastSync=d;}catch(e){}
  try{const d=lsGet('pf_gtoken');if(d&&tokenBuono())gToken=d;else if(d){lsDel('pf_gtoken');lsDel('pf_gtoken_scad');}}catch(e){}
  // Se il file dei pagamenti su Drive contiene registrazioni che qui non ci sono
  // (telefono nuovo, cache svuotata), le rimette dentro. Non cancella mai nulla.
  if(gToken) setTimeout(function(){ leggiPagamentiDaDrive().then(function(n){ if(n) render(); }); },1500);
  const hash=window.location.hash;
  if(hash&&hash.includes('access_token')){
    const params=new URLSearchParams(hash.substring(1));
    const tok=params.get('access_token');
    if(tok){
      gToken=tok;lsSet('pf_gtoken',tok);
      var durata=parseInt(params.get('expires_in')||'3600',10);
      lsSet('pf_gtoken_scad',String(Date.now()+(durata-120)*1000));
      history.replaceState(null,'',window.location.pathname);
      if(lsGet('pf_return_to_suite')){
        lsDel('pf_return_to_suite');
        const backTab=lsGet('pf_return_tab')||'sync';
        lsDel('pf_return_tab');
        window.location.href='https://farifarifarifari.github.io/playpiano-suite/?tab='+backTab;
        return;
      }
      setTimeout(()=>{showTab('sync');syncContatti();},500);
    }
  }
}

// Scaricare i contatti era un passaggio a parte: chi si collegava a Google dalla Suite
// tornava indietro collegato ma con la rubrica vuota, e Scadenze Noleggi non mostrava
// niente. Se il collegamento c'e' e la rubrica manca, se la prende da sola.
function scaricaRubricaSeManca(){
  var daLogin=(window.location.hash||'').indexOf('access_token')>=0;
  if(gToken && !contatti.length && !daLogin) setTimeout(function(){ syncContatti(); },600);
}

function showTab(t){
  currentTab=t;searchQ='';
  ['dash','prossimi','agenda','clienti','sync','analisi','import','contratti','concerti','disponibilita','dipendenti','prezzi','primanota','foto'].forEach(function(x){var b=document.getElementById('tab-'+x); if(b) b.classList.toggle('active',x===t);});
  render();
  if(t==='prossimi') caricaProssimi(false);
  if(t==='agenda'){ caricaAgenda(false); caricaAttivita(false); }
}
function render(){
  const active=document.activeElement;
  const activeId=active&&active.id?active.id:null;
  const selStart=active&&typeof active.selectionStart==='number'?active.selectionStart:null;
  const selEnd=active&&typeof active.selectionEnd==='number'?active.selectionEnd:null;
  const m=document.getElementById('main-content');
  if(currentTab==='dash')m.innerHTML=renderDash();
  else if(currentTab==='prossimi')m.innerHTML=renderProssimi();
  else if(currentTab==='agenda')m.innerHTML=renderAgenda();
  else if(currentTab==='clienti')m.innerHTML=renderClienti();
  else if(currentTab==='sync')m.innerHTML=renderSync();
  else if(currentTab==='analisi')m.innerHTML=renderAnalisi();
  else if(currentTab==='import')m.innerHTML=renderImport();
  else if(currentTab==='contratti')m.innerHTML=renderContratti();
  else if(currentTab==='concerti')m.innerHTML=renderConcerti();
  else if(currentTab==='disponibilita')m.innerHTML=renderDisponibilita();
  else if(currentTab==='dipendenti')m.innerHTML=renderDipendenti();
  else if(currentTab==='prezzi')m.innerHTML=renderPrezzi();
  else if(currentTab==='primanota')m.innerHTML=renderPrimaNota();
  else if(currentTab==='foto')m.innerHTML=renderFoto();
  if(activeId){
    const el=document.getElementById(activeId);
    if(el&&el.focus){
      el.focus();
      if(selStart!==null&&el.setSelectionRange){
        try{el.setSelectionRange(selStart,selEnd);}catch(e){}
      }
    }
  }
}

let dispMarca='',dispStato='N';
const DISP_STATI=[['N','Noleggio'],['D','Deposito'],['V','Venduti']];
const MARCHE_IN_CIMA=['YAMAHA','KAWAI'];
// Cambiando gruppo si azzera anche la marca: le marche di un gruppo non sono
// quelle dell'altro, e un filtro rimasto acceso farebbe sembrare vuoto un elenco pieno.
function dispCambiaStato(s){ dispStato=s; dispMarca=''; render(); }
function renderDisponibilita(){
  const delGruppo=pianos.filter(p=>p.stato===dispStato);
  // Alfabetico, ma Yamaha e Kawai in cima: sono le due marche che si cercano ogni
  // giorno, e farle scorrere in mezzo alle altre e' tempo perso a ogni preventivo.
  const marche=[...new Set(delGruppo.map(p=>(p.marca||'').trim()).filter(Boolean))].sort(function(a,b){
    const ia=MARCHE_IN_CIMA.indexOf(a.toUpperCase()), ib=MARCHE_IN_CIMA.indexOf(b.toUpperCase());
    if(ia>=0||ib>=0){ if(ia<0) return 1; if(ib<0) return -1; return ia-ib; }
    return a.localeCompare(b);
  });
  const q=(searchQ||'').toLowerCase();
  const list=delGruppo
    .filter(p=>!dispMarca||(p.marca||'').trim()===dispMarca)
    .filter(p=>!q||(p.modello||'').toLowerCase().includes(q)||(p.matricola||'').toLowerCase().includes(q)||String(p.numero).includes(q))
    .sort((a,b)=>(a.marca||'').localeCompare(b.marca||'')||(a.modello||'').localeCompare(b.modello||''));

  if(!list.length){
    h+='<div class="empty-state">Nessun pianoforte trovato.'+(pianos.length?' Prova a cambiare filtro.':' Importa il file Excel per vedere i dati.')+'</div>';

    <div class="piano-header">
      <span style="font-weight:500;font-size:14px;flex:1">#${p.numero} — ${(p.marca||'').trim()} ${p.modello||''}</span>
      <span class="badge ${p.stato==='N'?'badge-blue':p.stato==='D'?'badge-orange':'badge-green'}">${p.stato}</span>${ftBadge(p)}

      <div>Anno costr.: <b>${p.annoCostr||'-'}</b></div>
      <div>Silent: <b>${p.silent==='S'?'Sì':'No'}</b></div>
      <div>Anno acq.: <b>${p.annoAcq?'20'+p.annoAcq:'-'}</b></div>

    </div>
  </div>`).join('');
  if(list.length>200) h+='<div class="empty-state" style="padding:16px">Mostrati i primi 200 risultati, affina il filtro per vederne altri.</div>';
  return h;
}

function googleAuth(){
  const redirectUri=window.location.origin+window.location.pathname;
  const params=new URLSearchParams({client_id:CLIENT_ID,redirect_uri:redirectUri,response_type:'token',scope:SCOPE,include_granted_scopes:'true'});
  const authUrl='https://accounts.google.com/o/oauth2/v2/auth?'+params.toString();
  if(window.self!==window.top){
    // Siamo dentro un iframe (es. Playpiano Suite). Google rifiuta di mostrare
    // la pagina di login se rileva di essere incorniciata (protezione anti-clickjacking),
    // quindi navighiamo la finestra TOP e segnamo tab e intenzione di tornare alla Suite dopo il login.
    lsSet('pf_return_to_suite','1');
    lsSet('pf_return_tab',currentTab);
    window.top.location.href=authUrl;
  }else{
    window.location.href=authUrl;
  }
}

async function apiGet(url){
  const res=await fetch(url,{headers:{Authorization:'Bearer '+gToken}});
  if(res.status===401){gToken=null;lsDel('pf_gtoken');render();throw new Error('Token scaduto. Riconnetti.');}
  const data=await res.json();
  if(data.error)throw new Error(data.error.message);
  return data;
}

// Riconosce un token Google scaduto/non valido in una risposta JSON e, se e' il caso,
// pulisce il token salvato e riavvia da solo il login (invece di limitarsi a mostrare l'errore).
function handleGoogleAuthError(data){
  if(data&&data.error&&(data.error.code===401||/invalid authentication credentials/i.test(data.error.message||''))){
    gToken=null;lsDel('pf_gtoken');
    googleAuth();
    return true;
  }
  return false;
}

async function syncContatti(){
  if(!gToken){googleAuth();return;}
  const setStatus=msg=>{const el=document.getElementById('sync-status');if(el)el.innerHTML=msg;};
  setStatus('<span class="spinner"></span>Cerco gruppi...');
  try{
    // Step 1: trova ID del gruppo NOLO LUNGO TERMINE
    const groupsData=await apiGet('https://people.googleapis.com/v1/contactGroups?pageSize=200&groupFields=name,memberCount');
    const gruppi=groupsData.contactGroups||[];
    
    // Debug: mostra tutti i gruppi
    const nomiGruppi=gruppi.map(g=>g.name+'('+g.memberCount+')').join(' | ');
    setStatus('<span class="spinner"></span>Gruppi trovati: '+nomiGruppi);
    
    const gruppo=gruppi.find(g=>{
      const n=(g.name||'').toUpperCase();
      const fn=(g.formattedName||'').toUpperCase();
      return n.includes('NOLO')||fn.includes('NOLO');
    });
    
    if(!gruppo){
      setStatus('<span style="color:#A32D2D">Gruppo NOLO non trovato. Gruppi disponibili: '+nomiGruppi+'</span>');
      return;
    }

    setStatus('<span class="spinner"></span>Gruppo trovato: '+gruppo.name+' ('+gruppo.memberCount+' membri). Carico...');

    // Step 2: prendi i membri del gruppo
    const membData=await apiGet('https://people.googleapis.com/v1/'+gruppo.resourceName+'?maxMembers=500');
    const members=membData.memberResourceNames||[];
    
    if(!members.length){
      setStatus('<span style="color:#854F0B">Gruppo vuoto.</span>');
      return;
    }

    setStatus('<span class="spinner"></span>'+members.length+' contatti. Carico dettagli...');

    // Step 3: batch get dei contatti
    const parsed=[];
    for(let i=0;i<members.length;i+=50){
      const chunk=members.slice(i,i+50);
      const qp=new URLSearchParams();
      chunk.forEach(m=>qp.append('resourceNames',m));
      qp.set('personFields','names,phoneNumbers,addresses,biographies,events');
      const data=await apiGet('https://people.googleapis.com/v1/people:batchGet?'+qp.toString());
      (data.responses||[]).forEach(r=>{
        const p=r.person;if(!p)return;
        const dates=(p.events||[]).filter(e=>e.date&&e.date.month).map(e=>({
          date:(e.date.year||new Date().getFullYear())+'-'+String(e.date.month).padStart(2,'0')+'-'+String(e.date.day||1).padStart(2,'0'),
          label:e.formattedType||e.displayName||e.type||'Data importante'
        }));
        parsed.push({
          id:p.resourceName,
          nome:p.names?.[0]?.displayName||'—',
          telefono:p.phoneNumbers?.[0]?.value||'',
          indirizzo:p.addresses?.[0]?.formattedValue||'',
          notes:p.biographies?.[0]?.value||'',
          dates
        });
      });
      setStatus('<span class="spinner"></span>Caricati '+(i+chunk.length)+'/'+members.length+'...');
    }

    contatti=parsed;lastSync=new Date().toLocaleString('it-IT');
    lsSet('pf_contatti',contatti);lsSet('pf_sync',lastSync);lsSet('pf_sync_iso',new Date().toISOString());
    setStatus('<span style="color:#A01020">✓ '+parsed.length+' contatti · '+contatti.reduce((s,c)=>s+(c.dates||[]).length,0)+' date importate.</span>');
    setTimeout(()=>render(),1500);

  }catch(err){
    setStatus('<span style="color:#A32D2D">Errore: '+err.message+'</span>');
  }
}

function parseCanone(notes){
  if(!notes)return null;
  const m=notes.match(/canone\s+annuo\s*[€£]?\s*(\d[\d.,]*)/i);
  if(m)return parseFloat(m[1].replace(',','.'));
  return null;
}
// --- INSOLUTI ---------------------------------------------------------
// DATA DI TAGLIO. Tutto cio' che scade entro questa data e' considerato
// SALDATO, per qualunque cliente e per qualunque anno di inizio noleggio:
// le posizioni arretrate precedenti si verificano fuori dall'app.
// Si valuta solo cio' che scade DOPO. Si cambia dal tab Sync.
function dataTaglio(){
  const v=lsGet('pf_data_taglio');
  return (v&&/^\d{4}-\d{2}-\d{2}$/.test(v))?v:'2026-06-30';
}
function setDataTaglio(v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v||'')){alert('Data non valida');return;}
  lsSet('pf_data_taglio',v);render();
}
function dataTaglioFmt(){
  const p=dataTaglio().split('-');
  return p[2]+'/'+p[1]+'/'+p[0];
}
// Anni la cui ricorrenza cade DOPO la data di taglio e non oltre oggi.
// Prima del taglio non si guarda: e' tutto dato per saldato. Cosi' l'anno di
// inizio del noleggio non conta piu' nulla, e i contratti vecchi non
// trascinano dietro arretrati inventati.
function anniDovuti(mese,giorno,tappo){
  const oggi=new Date();oggi.setHours(0,0,0,0);
  const taglio=new Date(dataTaglio()+'T00:00:00');
  const out=[];
  for(let a=taglio.getFullYear();a<=oggi.getFullYear();a++){
    const ric=new Date(a,mese,giorno);ric.setHours(0,0,0,0);
    if(ric<=taglio||ric>oggi) continue;
    if(tappo&&ric>tappo) continue;   // oltre la fine del noleggio non si incassa piu'
    out.push(a);
  }
  return out;
}
// Una data importante e' un TAPPO se la sua etichetta comincia con FINE
// (es. "FINE PROLUNGAMENTO 8 MESI"). Tutto il resto - etichetta vuota inclusa -
// e' una scadenza di pagamento.
function eTappo(label){
  return /^\s*FINE\b/i.test(label||'');
}
// L'ultima data di fine del contatto: oltre quella non si aspettano piu' incassi.
// Quando il noleggio viene prolungato, Andrea sposta in avanti questa stessa data.
function tappoContatto(c){
  let max=null;
  (c.dates||[]).forEach(function(e){
    if(!e.date||!eTappo(e.label)) return;
    const d=new Date(e.date); if(isNaN(d.getTime())) return;
    d.setHours(0,0,0,0);
    if(!max||d>max) max=d;
  });
  return max;
}
// Identifica la singola scadenza dentro l'anno: "23-08". Serve perche' un cliente
// trimestrale ha quattro incassi l'anno e vanno spuntati uno per uno.
function chiaveScad(mese,giorno){
  return String(giorno).padStart(2,'0')+'-'+String(mese+1).padStart(2,'0');
}
// Registrazioni riferite a questa scadenza. Le vecchie registrazioni senza 'scad'
// valgono per tutte le scadenze di quell'anno: cosi' non si perde nulla.
function pagatiScad(cid,key){
  return getPagati(cid).filter(function(x){return !x.scad||x.scad===key;});
}
// Una registrazione per scadenza e per anno. Dentro convivono due cose distinte:
// il flag del pagamento e gli appunti liberi. Le registrazioni vecchie non hanno
// il campo 'pagato': erano nate spuntando la casella, quindi valgono come pagate.
function recordScad(cid,key,anno){
  return pagatiScad(cid,key).filter(function(x){return x.anno===anno;})[0]||null;
}
function risultaPagato(x){ return !!x && x.pagato!==false; }
function haNota(cid,key){
  return pagatiScad(cid,key).some(function(x){return x.nota&&x.nota.length;});
}
// Il quadratino: spunta e togli, senza aprire niente. Gli appunti restano dove sono.
function togglePagato(cid,key){
  const anno=new Date().getFullYear();
  const tutte=getPagati(cid);
  const i=tutte.findIndex(function(x){return x.anno===anno&&(x.scad||'')===key;});
  if(i>-1){
    if(risultaPagato(tutte[i])){
      // toglie la spunta ma non butta via gli appunti
      if(tutte[i].nota&&tutte[i].nota.length){ tutte[i].pagato=false; tutte[i].fonte='mano'; tutte[i].rif=''; }
      else { tutte.splice(i,1); }
    } else {
      tutte[i].pagato=true; tutte[i].fonte='mano'; tutte[i].rif='';
    }
  } else {
    tutte.push({anno:anno,scad:key,pagato:true,nota:'',fonte:'mano',rif:''});
  }
  if(tutte.length) lsSet('pf_pagato_'+cid,JSON.stringify(tutte)); else lsDel('pf_pagato_'+cid);
  salvaPagamentiSuDrive();
  render();
}

/* ---------- I pagamenti su Drive ----------
   La spunta dei pagamenti nasce qui dentro e prima viveva solo nella memoria del
   browser: cambiavi telefono e la perdevi. Ora ogni modifica viene riscritta in un
   file che l'app crea e mantiene su Drive (permesso drive.file: l'app vede soltanto
   i file suoi). Il file si consulta, non si compila a mano: a scriverlo e' l'app. */
const PAG_FILE_NOME='PAGAMENTI PlayPiano.csv';
let pagFileId=lsGet('pf_pagamenti_fileid')||'';
let pagInCorso=false;

function pagamentiTutti(){
  const out=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||k.indexOf('pf_pagato_')!==0) continue;
    const cid=k.slice(10);
    let arr=[]; try{arr=JSON.parse(localStorage.getItem(k)||'[]');}catch(e){}
    arr.forEach(function(x){ out.push({cid:cid,anno:x.anno,scad:x.scad||'',pagato:!!risultaPagato(x),nota:x.nota||'',fonte:x.fonte||'mano',rif:x.rif||''}); });
  }
  return out;
}
function nomeDiContatto(cid){
  const c=(contatti||[]).filter(function(x){return x.id===cid;})[0];
  return c?(c.nome||''):'';
}
function pagamentiCsv(){
  const q=function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; };
  const adesso=new Date().toISOString().slice(0,16).replace('T',' ');
  const righe=[['contatto','nome','anno','scadenza','pagato','appunti','origine','riferimento','aggiornato'].map(q).join(',')];
  pagamentiTutti().forEach(function(r){
    righe.push([r.cid,nomeDiContatto(r.cid),r.anno,r.scad,r.pagato?'SI':'NO',r.nota,r.fonte,r.rif,adesso].map(q).join(','));
  });
  return '\ufeff'+righe.join('\r\n');
}
async function trovaFilePagamenti(){
  const url='https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files(id,name)&q='+encodeURIComponent("name='"+PAG_FILE_NOME+"' and trashed=false");
  const res=await fetch(url,{headers:{Authorization:'Bearer '+gToken}});
  const data=await res.json();
  if(data.error) return '';
  return (data.files&&data.files[0])?data.files[0].id:'';
}
async function salvaPagamentiSuDrive(){
  if(!gToken||pagInCorso) return;
  pagInCorso=true;
  try{
    if(!pagFileId) pagFileId=await trovaFilePagamenti();
    const corpo=new Blob([pagamentiCsv()],{type:'text/csv'});
    if(pagFileId){
      const res=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+pagFileId+'?uploadType=media',{method:'PATCH',headers:{Authorization:'Bearer '+gToken,'Content-Type':'text/csv'},body:corpo});
      if(!res.ok){ pagFileId=''; lsDel('pf_pagamenti_fileid'); }
    }
    if(!pagFileId){
      const meta={name:PAG_FILE_NOME,mimeType:'text/csv'};
      const form=new FormData();
      form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
      form.append('file',corpo);
      const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{Authorization:'Bearer '+gToken},body:form});
      const data=await res.json();
      if(data.id){ pagFileId=data.id; lsSet('pf_pagamenti_fileid',pagFileId); }
    }
  }catch(e){}
  pagInCorso=false;
}
// All'avvio: quello che sta nel file e qui non c'e' viene rimesso dentro. Non
// cancella mai niente in locale, serve a recuperare - per esempio su un telefono nuovo.
async function leggiPagamentiDaDrive(){
  if(!gToken) return 0;
  try{
    if(!pagFileId) pagFileId=await trovaFilePagamenti();
    if(!pagFileId) return 0;
    lsSet('pf_pagamenti_fileid',pagFileId);
    const res=await fetch('https://www.googleapis.com/drive/v3/files/'+pagFileId+'?alt=media',{headers:{Authorization:'Bearer '+gToken}});
    if(!res.ok) return 0;
    const testo=await res.text();
    const righe=testo.replace(/^\ufeff/,'').split(/\r?\n/).slice(1);
    let aggiunte=0;
    righe.forEach(function(r){
      if(!r.trim()) return;
      const celle=r.match(/"((?:[^"]|"")*)"/g);
      if(!celle||celle.length<8) return;
      const v=celle.map(function(x){return x.slice(1,-1).replace(/""/g,'"');});
      const cid=v[0], anno=parseInt(v[2],10), scad=v[3];
      if(!cid||!anno) return;
      const esistenti=getPagati(cid);
      if(esistenti.some(function(x){return x.anno===anno&&(x.scad||'')===scad;})) return;
      esistenti.push({anno:anno,scad:scad,pagato:(v[4]==='SI'),nota:v[5]||'',fonte:v[6]||'mano',rif:v[7]||''});
      esistenti.sort(function(a,b){return a.anno-b.anno;});
      lsSet('pf_pagato_'+cid,JSON.stringify(esistenti));
      aggiunte++;
    });
    return aggiunte;
  }catch(e){ return 0; }
}

function anniInsoluti(cid,key,mese,giorno,tappo){
  const pagati=pagatiScad(cid,key).filter(risultaPagato).map(function(x){return x.anno;});
  return anniDovuti(mese,giorno,tappo).filter(function(a){return pagati.indexOf(a)<0;});
}
// Quanti canoni annui compaiono nelle note: piu' di uno vuol dire piu' strumenti
// sullo stesso contatto, e il totale che mostriamo e' incompleto. Lo segnaliamo
// invece di sommare a caso o di ignorarne uno in silenzio.

function canoniBadgeHtml(s){

// Tutte le scadenze dell'anno rimaste scoperte, per la dashboard e il report.
function tuttiGliInsoluti(){

function insolutoBadgeHtml(s){

// --- RETE DI SICUREZZA PAGAMENTI --------------------------------------
// Le spunte "pagato" vivono solo in questo browser: se si svuotano i dati
// del sito spariscono. Qui si esportano e si rileggono da file.
function esportaPagamenti(){
  const dati={_tipo:'playpiano-pagamenti',_data:new Date().toISOString(),pagamenti:{},wa:{},contratto_num:lsGet('pf_contratto_num')||''};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k.indexOf('pf_pagato_')===0) dati.pagamenti[k]=localStorage.getItem(k);
      if(k.indexOf('pf_wa_')===0) dati.wa[k]=localStorage.getItem(k);
    }
  }catch(e){}
  const n=Object.keys(dati.pagamenti).length;
  const blob=new Blob([JSON.stringify(dati,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='playpiano-pagamenti-'+new Date().toISOString().substring(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  const el=document.getElementById('backup-status');
  if(el) el.innerHTML='<span style="color:#2e7d32">Salvati '+n+' clienti con pagamenti registrati.</span>';
}
function importaPagamenti(input){
  const file=input.files[0];if(!file)return;
  const el=document.getElementById('backup-status');
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const d=JSON.parse(e.target.result);
      if(!d||d._tipo!=='playpiano-pagamenti') throw new Error('Non e un backup dei pagamenti PlayPiano');
      const chiavi=Object.keys(d.pagamenti||{});
      if(!confirm('Il backup contiene '+chiavi.length+' clienti con pagamenti.\nI dati attuali per quei clienti verranno sostituiti. Procedere?')){input.value='';return;}
      chiavi.forEach(function(k){ lsSet(k,d.pagamenti[k]); });
      Object.keys(d.wa||{}).forEach(function(k){ lsSet(k,d.wa[k]); });
      if(d.contratto_num) lsSet('pf_contratto_num',String(d.contratto_num));
      if(el) el.innerHTML='<span style="color:#2e7d32">Ripristinati '+chiavi.length+' clienti.</span>';
      input.value='';
      render();
    }catch(err){
      if(el) el.innerHTML='<span style="color:#A32D2D">Errore: '+err.message+'</span>';
      input.value='';
    }
  };
  reader.readAsText(file);
}
function calcolaGiorni(month,day){
  const oggi=new Date();oggi.setHours(0,0,0,0);
  const d=new Date(oggi.getFullYear(),month,day);d.setHours(0,0,0,0);
  return Math.round((d-oggi)/(1000*60*60*24));
}
function getScadenzePerMese(month){
  const result=[];
  contatti.forEach(c=>{
    (c.dates||[]).forEach(entry=>{
      if(!entry.date)return;
      const d=new Date(entry.date);if(isNaN(d.getTime()))return;
      if(d.getMonth()===month){
        const annoOrig=d.getFullYear();
        const tipo=eTappo(entry.label)?'fine':'pagamento';
        const key=chiaveScad(d.getMonth(),d.getDate());
        const tappo=tappoContatto(c);
        const oggi0=new Date();oggi0.setHours(0,0,0,0);
        let insoluti=[],bivio=false,spuntato=false,gg;
        if(tipo==='fine'){
          // la data di fine e' una sola e non si ripete: si guarda quella vera, anno compreso
          gg=Math.round((d-oggi0)/(1000*60*60*24));
          bivio=(d<=oggi0);
          spuntato=risultaPagato(recordScad(c.id,key,annoOrig));
        }else{
          gg=calcolaGiorni(d.getMonth(),d.getDate());
          insoluti=anniInsoluti(c.id,key,d.getMonth(),d.getDate(),tappo);
          // Il quadratino parte VUOTO e si spunta solo se esiste una registrazione
          // di incasso per quell'anno: messa a mano, oppure trovata su Fatture in
          // Cloud o nei movimenti del conto. Vuoto significa "nessuna prova",
          // non "non ha pagato".
          spuntato=risultaPagato(recordScad(c.id,key,oggi0.getFullYear()));
        }
        result.push({contatto:c,day:d.getDate(),month:d.getMonth(),label:entry.label||'',
          canone:(tipo==='fine'?null:parseCanone(c.notes)),gg:gg,annoOrig:annoOrig,
          tipo:tipo,key:key,insoluti:insoluti,bivio:bivio,spuntato:spuntato});
      }
    });
  });
  return result.sort((a,b)=>a.day-b.day);
}
function fmtGg(gg){if(gg<0)return Math.abs(gg)+'gg fa';if(gg===0)return 'Oggi';if(gg===1)return 'Domani';return 'fra '+gg+'gg';}
function badgeCls(gg){return gg<0?'badge-red':gg<=14?'badge-orange':'badge-green';}
function cardCls(gg){return gg<0?'urgente':gg<=14?'warning':'ok';}

// Nell'indirizzo di Google il comune viene dopo il CAP: "Via Roma 12, 45100 Rovigo RO".
// Nella scheda cliente serve quello - la via dice poco, il paese dice se e' dietro
// l'angolo o dall'altra parte della provincia. La sigla finale si butta via.
function comuneDa(indirizzo){
  var s=String(indirizzo||'').replace(/\n/g,', ').replace(/\s+/g,' ').trim();
  if(!s) return '';
  var m=s.match(/\b\d{5}\b[\s,]*([^,]+)/);
  if(m&&m[1]) return m[1].replace(/\s*\([A-Za-z]{2}\)\s*$/,'').replace(/\s+[A-Za-z]{2}$/,'').trim();
  var p=s.split(',').map(function(x){return x.trim();}).filter(Boolean);
  if(p.length>2) return p[p.length-2];
  return p[p.length-1]||s;
}
function indirizzoPiano(indirizzo){
  return String(indirizzo||'').replace(/\n/g,', ').replace(/\s+/g,' ').trim();
}

/* ================= SCHEMA PREZZI =================
   Il canone non e' una percentuale qualsiasi del costo: guardando i 27 canoni in
   uso, quelli che tornano sono tutti multipli di 60 - 360, 420, 480, 540, 600 -
   perche' il prezzo lo si sceglie a gradini, non lo si calcola. Quindi il 20% e
   il 25% del costo vengono arrotondati al sessanta piu' vicino, che e' poi il
   numero che verrebbe fuori a mente.
   Attenzione a una coincidenza che sul preventivo conta: con il canone al 20%,
   "x1,30 piu' il canone" fa la stessa cifra dell'acquisto diretto a x1,50. */
// La prima tacca del listino e' 360 euro l'anno: sotto non si scende, nemmeno quando
// il 20% del costo direbbe di meno. In quei casi 360 vale piu' del 20%, e la
// percentuale vera va scritta invece di lasciarla intendere.
function gradinoCanone(v){ var g=Math.round(v/60)*60; return g<360?360:g; }
// Il punto delle migliaia me lo metto da solo: toLocaleString('it') non lo mette
// su tutti i dispositivi, e un prezzo scritto 3153 invece di 3.153 si legge male.
function eurIt(v){ return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function numIt(v,dec){ return v.toFixed(dec).replace('.',','); }

function schemaPrezzi(p){
  var costo=parseFloat(p.costo)||0;
  if(costo<=0) return '';
  var c20=gradinoCanone(costo*0.20), c25=gradinoCanone(costo*0.25);
  var sottoTacca=(Math.round(costo*0.20/60)*60)<360;
  function rigaPrezzo(et,val){
    return '<div style="display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:0.5px solid #f0f0f0">'
      +'<span style="font-size:11.5px;color:#aaa">'+et+'</span>'
      +'<span style="margin-left:auto;font-size:15px;font-weight:700;color:#A01020">&euro; '+eurIt(val)+'</span></div>';
  }
  var h='<div style="margin-top:18px"><div class="section-title">Noleggio annuale</div>';
  h+='<div class="detail-row"><span class="detail-label">al 20% &mdash; rientro in '+numIt(costo/c20,1)+' anni</span><span style="font-weight:700;color:#A01020">&euro; '+eurIt(c20)+'</span></div>';
  h+='<div class="detail-row"><span class="detail-label">al 25% &mdash; rientro in '+numIt(costo/c25,1)+' anni</span><span style="font-weight:700;color:#A01020">&euro; '+eurIt(c25)+'</span></div>';
  h+='<div style="font-size:10px;color:#bbb;margin-top:5px">Gradini da 60 &euro;: '+eurIt(c20)+' &euro; sono il '+numIt((c20/costo)*100,1)+'% del costo, '+eurIt(c25)+' &euro; il '+numIt((c25/costo)*100,1)+'%.</div>';
  if(sottoTacca) h+='<div style="font-size:10px;color:#C8791A;margin-top:4px">Prima tacca: sotto i 360 &euro;/anno non si scende. Qui 360 &euro; sono il '+numIt((360/costo)*100,1)+'% del costo.</div>';
  h+='</div>';

  h+='<div style="margin-top:18px"><div class="section-title">Se poi lo compra (canone '+eurIt(c20)+' &euro; incluso)</div>';
  [1.40,1.35,1.30].forEach(function(m){
    h+=rigaPrezzo(eurIt(costo)+' &times; '+numIt(m,2)+' + '+eurIt(c20), costo*m+c20);
  });
  h+='</div>';

  h+='<div style="margin-top:18px"><div class="section-title">Acquisto diretto</div>';
  [1.50,1.40,1.35,1.30].forEach(function(m){
    h+=rigaPrezzo(eurIt(costo)+' &times; '+numIt(m,2), costo*m);
  });
  h+='</div>';
  return h;
}

function handleExcel(input){
  const file=input.files[0];if(!file)return;
  const status=document.getElementById('import-status');
  status.textContent='Lettura...';
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets['Anagrafica']||wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      // Map column AB (index 27) by cell address for cinese
      const cinesiMap={};
      const range=XLSX.utils.decode_range(ws['!ref']||'A1');
      for(let r=range.s.r+1;r<=range.e.r;r++){
        const numCell=ws[XLSX.utils.encode_cell({r:r,c:0})];
        const cinCell=ws[XLSX.utils.encode_cell({r:r,c:28})];
        if(numCell&&cinCell&&cinCell.v) cinesiMap[parseFloat(numCell.v)]='C';
      }
      const clean=k=>String(k||'').trim();
      const num=k=>{const v=parseFloat(k);return isNaN(v)?'':v;};
      const parsed=rows.map(r=>({numero:num(r['NUMERO']),stato:clean(r['STATO']).toUpperCase(),marca:clean(r['MARCA']),modello:clean(r['MODELLO']),matricola:clean(r['MATRICOLA']),silent:clean(r['SILENT']),categoria:clean(r['CATEGORIA']),colore:clean(r['COLORE']),finitura:clean(r['FINITURA']),annoAcq:clean(r['ANNO ACQUISTO   '])||clean(r['ANNO ACQUISTO']),fornitore:clean(r['FORNITORE']),costo:num(r['COSTO TOTALE '])||num(r['COSTO TOTALE']),cliente:clean(r['CLIENTI']),canone:num(r['CANONE ANNUO']),note:clean(r['NOTE PIANOFORTE']),annoVendita:num(r['ANNO VENDITA']),totVendita:num(r['TOTALE   VENDITA'])||num(r['TOTALE VENDITA']),cinese:cinesiMap[parseFloat(r['NUMERO'])]||'',annoCostr:clean(r['ANNO COSTRUZIONE']),contanti:num(r['CONTANTI']),inCarico:clean(r['IN CARICO'])})).filter(p=>p.numero&&p.stato&&['N','D','V','R','RIP'].includes(p.stato));
      pianos=parsed;lsSet('pf_pianos',pianos);lsSet('pf_import_excel',new Date().toISOString());
      status.innerHTML=`<span style="color:#A01020">✓ ${pianos.length} piani importati.</span>`;
      // I dipendenti scelgono gli strumenti da una lista che vive nel foglio
      // LAVORI: se non gliela si rispedisce adesso, restano indietro.
      dpSpedisciPianoforti(true).then(function(r){
        if(r&&r.ok) status.innerHTML+=`<div style="font-size:12px;color:#888;margin-top:5px">Elenco spedito anche ai dipendenti (${r.quanti}).</div>`;
        else status.innerHTML+=`<div style="font-size:12px;color:#C8791A;margin-top:5px">Ai dipendenti non e' arrivato: ${r&&r.errore?r.errore:'errore'} &mdash; rifallo dalla tab Dipendenti.</div>`;
      });
      setTimeout(()=>showTab('dash'),3500);
    }catch(err){status.innerHTML=`<span style="color:#A32D2D">Errore: ${err.message}</span>`;}
  };
  reader.readAsBinaryString(file);
}


function renderAnalisi(){
  // ── TREND ACQUISTI PER ANNO ──
  const acquistiPerAnno={};
  pianos.forEach(p=>{
    if(!p.annoAcq||!p.costo) return;
    const anno='20'+String(p.annoAcq).replace('20','');
    if(!acquistiPerAnno[anno]) acquistiPerAnno[anno]={n:0,invest:0};
    acquistiPerAnno[anno].n++;
    acquistiPerAnno[anno].invest+=parseFloat(p.costo)||0;
  });
  const anni=Object.keys(acquistiPerAnno).sort();
  const maxN=Math.max(...anni.map(a=>acquistiPerAnno[a].n),1);
  const maxI=Math.max(...anni.map(a=>acquistiPerAnno[a].invest),1);

  // ── ANALISI FORNITORI ──
  const fornitori={};
  pianos.forEach(p=>{
    if(!p.fornitore||!p.costo) return;
    const f=p.fornitore.trim()||'?';
    if(!fornitori[f]) fornitori[f]={n:0,invest:0};
    fornitori[f].n++;
    fornitori[f].invest+=parseFloat(p.costo)||0;
  });
  const topForn=Object.entries(fornitori).sort((a,b)=>b[1].n-a[1].n).slice(0,8);
  const maxFN=Math.max(...topForn.map(f=>f[1].n),1);

  // ── RENDIMENTO PIANI ──
  const rendimento=pianos.filter(p=>p.stato==='N'&&parseFloat(p.canone)>0&&parseFloat(p.costo)>0).map(p=>({
    numero:p.numero,
    marca:(p.marca||'').trim(),
    modello:p.modello||'',
    costo:parseFloat(p.costo),
    canone:parseFloat(p.canone),
    rend:Math.round(parseFloat(p.canone)/parseFloat(p.costo)*100),
    anni:Math.round(parseFloat(p.costo)/parseFloat(p.canone)*10)/10,
  })).sort((a,b)=>b.rend-a.rend);
  const topRend=rendimento.slice(0,10);
  const bottomRend=rendimento.slice(-5).reverse();
  const rendMedio=rendimento.length?Math.round(rendimento.reduce((s,p)=>s+p.rend,0)/rendimento.length):0;

  // ── STATO PARCO NEL TEMPO ──
  const vendPerAnno={};
  pianos.filter(p=>p.stato==='V'&&p.annoVendita).forEach(p=>{
    const a='20'+String(p.annoVendita).replace('20','');
    vendPerAnno[a]=(vendPerAnno[a]||0)+1;
  });

  return `
  <div style="font-size:15px;font-weight:500;margin-bottom:12px">Analisi parco piani</div>

  <!-- TREND ACQUISTI -->
  <div class="card">
    <div class="section-title">Acquisti per anno</div>
    ${anni.map(a=>{
      const d=acquistiPerAnno[a];
      return `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#666;margin-bottom:3px">
          <span><strong style="color:#1a1a1a">${a}</strong> — ${d.n} piani</span>
          <span>€${Math.round(d.invest).toLocaleString('it')}</span>
        </div>
        <div style="height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${Math.round(d.n/maxN*100)}%;background:#555;border-radius:4px"></div>
        </div>
      </div>`;
    }).join('')}
    <div style="font-size:11px;color:#999;margin-top:8px;padding-top:8px;border-top:0.5px solid #f0f0f0">
      Totale: ${pianos.length} piani · ${anni.length} anni di attività
    </div>
  </div>

  <!-- RENDIMENTO MEDIO -->
  <div class="card">
    <div class="section-title">Rendimento piani a noleggio</div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px">
      <div style="background:#f5f5f5;border-radius:8px;padding:12px">
        <div style="font-size:11px;color:#666;margin-bottom:4px">Rendimento medio</div>
        <div style="font-size:22px;font-weight:500">${rendMedio}%</div>
        <div style="font-size:11px;color:#666;margin-top:2px">canone/costo annuo</div>
      </div>
      <div style="background:#f5f5f5;border-radius:8px;padding:12px">
        <div style="font-size:11px;color:#666;margin-bottom:4px">Ammortamento medio</div>
        <div style="font-size:22px;font-weight:500">${rendimento.length?Math.round(rendimento.reduce((s,p)=>s+p.anni,0)/rendimento.length*10)/10:0}a</div>
        <div style="font-size:11px;color:#666;margin-top:2px">anni per rientrare</div>
      </div>
    </div>
    <div class="section-title">Top 10 — più redditizi</div>
    ${topRend.map(p=>`<div class="summary-row">
      <div><div style="font-weight:500;font-size:13px">${p.marca} ${p.modello} <span style="color:#999">#${p.numero}</span></div>
      <div style="font-size:11px;color:#666">€${Math.round(p.costo).toLocaleString('it')} acquisto · €${Math.round(p.canone)}/a canone</div></div>
      <div style="text-align:right">
        <div style="font-weight:500;font-size:14px;color:#A01020">${p.rend}%</div>
        <div style="font-size:11px;color:#666">${p.anni}a ammort.</div>
      </div>
    </div>`).join('')}
    ${bottomRend.length?`<div class="section-title" style="margin-top:14px">Bottom 5 — meno redditizi</div>
    ${bottomRend.map(p=>`<div class="summary-row">
      <div><div style="font-weight:500;font-size:13px">${p.marca} ${p.modello} <span style="color:#999">#${p.numero}</span></div>
      <div style="font-size:11px;color:#666">€${Math.round(p.costo).toLocaleString('it')} acquisto · €${Math.round(p.canone)}/a canone</div></div>
      <div style="text-align:right">
        <div style="font-weight:500;font-size:14px;color:#A32D2D">${p.rend}%</div>
        <div style="font-size:11px;color:#666">${p.anni}a ammort.</div>
      </div>
    </div>`).join('')}`:''}
  </div>

  <!-- FORNITORI -->
  <div class="card">
    <div class="section-title">Top fornitori per numero piani</div>
    ${topForn.map(([f,d])=>`<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:#666;margin-bottom:3px">
        <span><strong style="color:#1a1a1a">${f}</strong> — ${d.n} piani</span>
        <span>€${Math.round(d.invest).toLocaleString('it')} · media €${Math.round(d.invest/d.n).toLocaleString('it')}</span>
      </div>
      <div style="height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${Math.round(d.n/maxFN*100)}%;background:#555;border-radius:4px"></div>
      </div>
    </div>`).join('')}
  </div>

  <!-- VENDITE PER ANNO -->
  ${Object.keys(vendPerAnno).length?`<div class="card">
    <div class="section-title">Vendite per anno</div>
    ${Object.entries(vendPerAnno).sort().map(([a,n])=>`<div class="summary-row"><span>${a}</span><span style="font-weight:500">${n} piani venduti</span></div>`).join('')}
  </div>`:''}

  ${pianos.length===0?'<div class="empty-state">Importa il file Excel per vedere le analisi.</div>':''}` + renderYamahaEta();
}



let waCurrentTel='';
let waCurrentContactId='';
let pagatoCurrentContactId='';
let pagatoCurrentScad='';
let pagatoCurrentTipo='pagamento';
function getPagati(cid){
  try{return JSON.parse(lsGet('pf_pagato_'+cid)||'[]');}catch(e){return [];}
}
// Da dove arriva una spunta: messa a mano, letta da una fattura, vista sul conto.
function origineHtml(x){
  if(!x||!x.fonte||x.fonte==='mano') return '';
  if(x.fonte==='fattura') return '<span class="rif-fic">● fattura '+(x.rif||'')+'</span>';
  if(x.fonte==='banca')   return '<span class="rif-fic">● movimento '+(x.rif||'')+'</span>';
  return '';
}
function pagatoBadgeHtml(cid,key,tipo){
  const arr=key?pagatiScad(cid,key):getPagati(cid);
  if(!arr.length) return '';
  const pagate=arr.filter(risultaPagato);
  const anni=pagate.map(function(x){return x.anno+origineHtml(x);}).join(', ');
  const parola=(tipo==='fine')?'Risolto':'Pagato';
  let h=!pagate.length?'':('<div><span class="paid-badge">\u2713 '+parola+': '+anni+'</span></div>');
  arr.filter(x=>x.nota).forEach(x=>{
    const notaSafe=x.nota.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    h+='<div style="font-size:11px;color:#666;margin-top:2px;padding-left:2px;line-height:1.4">'+x.anno+': '+notaSafe+'</div>';
  });
  return h;
}
function apriPagatoModal(cid,nome,key,tipo,giorno,mese,e){
  if(e){e.preventDefault();e.stopPropagation();}
  pagatoCurrentContactId=cid;
  pagatoCurrentScad=key||'';
  pagatoCurrentTipo=tipo||'pagamento';
  const quando=(giorno!==undefined&&mese!==undefined)?' · '+giorno+' '+MONTHS_SHORT[mese]:'';
  document.getElementById('pagato-nome').textContent=nome+quando;
  // Ricarica quello che c'e' gia' scritto per questa scadenza, cosi' la nota si
  // integra invece di doverla riscrivere da capo ogni volta.
  const gia=pagatiScad(cid,key);
  const annoOggi=new Date().getFullYear();
  const corr=gia.filter(function(x){return x.anno===annoOggi;})[0]||gia[gia.length-1];
  document.getElementById('pagato-anno').value=corr?corr.anno:annoOggi;
  document.getElementById('pagato-nota').value=corr?(corr.nota||''):'';
  document.getElementById('pagato-rimuovi-btn').style.display=gia.length?'block':'none';
  document.getElementById('pagato-modal').style.display='flex';
}
// Se si cambia l'anno nella finestrella, la nota mostrata deve essere quella di
// quell'anno: altrimenti si sovrascrive la nota del 2026 con quella del 2027.
function caricaNotaAnno(){
  const anno=parseInt(document.getElementById('pagato-anno').value,10);
  const gia=pagatiScad(pagatoCurrentContactId,pagatoCurrentScad);
  const corr=gia.filter(function(x){return x.anno===anno;})[0];
  document.getElementById('pagato-nota').value=corr?(corr.nota||''):'';
}
function rimuoviPagato(){
  if(!confirm('Cancellare gli appunti di questa scadenza? La spunta del pagamento resta com e.'))return;
  const anno=parseInt(document.getElementById('pagato-anno').value,10);
  const restanti=[];
  getPagati(pagatoCurrentContactId).forEach(function(x){
    if((x.scad||'')===pagatoCurrentScad&&x.anno===anno){
      if(risultaPagato(x)){ x.nota=''; restanti.push(x); }   // resta il pagamento, spariscono gli appunti
    } else { restanti.push(x); }
  });
  if(restanti.length) lsSet('pf_pagato_'+pagatoCurrentContactId,JSON.stringify(restanti));
  else lsDel('pf_pagato_'+pagatoCurrentContactId);
  salvaPagamentiSuDrive();
  document.getElementById('pagato-modal').style.display='none';
  render();
}
function closePagatoModal(e){
  if(!e||e.target===document.getElementById('pagato-modal')) document.getElementById('pagato-modal').style.display='none';
}
function salvaPagato(){
  const anno=parseInt(document.getElementById('pagato-anno').value,10);
  if(!anno||anno<2000||anno>2100){alert('Anno non valido');return;}
  const nota=document.getElementById('pagato-nota').value.trim();
  const esistenti=getPagati(pagatoCurrentContactId);
  const scad=pagatoCurrentScad||'';
  const idx=esistenti.findIndex(x=>x.anno===anno&&(x.scad||'')===scad);
  // Chi ha messo la spunta: qui e' sempre Andrea a mano. Se la registrazione
  // esisteva gia' ed era arrivata da una fattura o dal conto, l'origine resta
  // quella e la nota si limita ad aggiungersi.
  // Gli appunti sono una cosa, la spunta un'altra: salvare qui non accende nulla.
  const fonte=(idx>-1&&esistenti[idx].fonte)?esistenti[idx].fonte:'mano';
  const rif=(idx>-1&&esistenti[idx].rif)?esistenti[idx].rif:'';
  const pagato=(idx>-1)?risultaPagato(esistenti[idx]):false;

function copyReport(){
  const oggi=new Date();
  const MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const nextM=(oggi.getMonth()+1)%12;
  const nextMYear=oggi.getMonth()===11?oggi.getFullYear()+1:oggi.getFullYear();
  const scadNext=getScadenzePerMese(nextM);
  let txt='SCADENZE NOLEGGIO - '+MONTHS[nextM].toUpperCase()+' '+nextMYear+'\n';
  txt+='================================\n\n';
  scadNext.forEach((s,i)=>{
    txt+=(i+1)+'. '+s.contatto.nome+'\n';
    txt+='   Data: '+s.day+' '+MONTHS[s.month]+'\n';
    if(s.contatto.telefono) txt+='   Tel: '+s.contatto.telefono+'\n';
    if(s.canone) txt+='   Canone: EUR '+Math.round(s.canone)+'/anno\n';
    txt+='\n';
  });
  const ins=tuttiGliInsoluti();
  if(ins.length){
    txt+='--------------------------------\n';
    txt+='DA INCASSARE (scadenze dopo il '+dataTaglioFmt()+')\n\n';
    ins.forEach(function(s){
      txt+='- '+s.contatto.nome+': '+s.insoluti.join(', ');
      if(s.canone) txt+='  (EUR '+Math.round(s.canone*s.insoluti.length).toLocaleString('it')+')';
      txt+='\n';
    });
    txt+='\n';
  }
  const tot=scadNext.reduce((s,x)=>s+(x.canone||0),0);
  txt+='================================\n';
  txt+='Totale: '+scadNext.length+' clienti';
  if(tot>0) txt+=' - EUR '+Math.round(tot).toLocaleString('it')+' potenziali';
  navigator.clipboard.writeText(txt).then(()=>{
    const btn=document.querySelector('[onclick="copyReport()"]');
    if(btn){btn.textContent='Copiato!';setTimeout(()=>{if(btn)btn.textContent='Copia report negli appunti';},2000);}
  }).catch(()=>{});
}

function renderYamahaEta(){
  if(!pianos.length) return '';
  const oggi=new Date().getFullYear();
  function etaMedia(arr){
    const valid=arr.filter(p=>p.annoCostr&&parseInt(p.annoCostr)>1900);
    if(!valid.length) return null;
    const avg=valid.reduce((s,p)=>s+parseInt(p.annoCostr),0)/valid.length;
    return {anno:Math.round(avg),eta:Math.round(oggi-avg),n:valid.length};
  }
  function riga(label,stat){
    if(!stat) return '<div class="summary-row"><span>'+label+'</span><span style="color:#aaa">n/d</span></div>';
    return '<div class="summary-row"><span>'+label+' <span style="font-size:11px;color:#aaa">('+stat.n+')</span></span><div style="text-align:right"><span style="font-weight:500;color:#A01020">'+stat.anno+'</span><span style="font-size:11px;color:#888;margin-left:6px">~'+stat.eta+' anni</span></div></div>';
  }
  const yP=pianos.filter(p=>(p.marca||'').toUpperCase()==='YAMAHA'&&(p.stato==='N'||p.stato==='D'));
  const yV=pianos.filter(p=>(p.marca||'').toUpperCase()==='YAMAHA'&&p.stato==='V');
  let h='<div class="card"><div class="section-title">Yamaha — Eta media per categoria</div>';
  h+='<div style="font-size:12px;font-weight:600;color:#555;margin:4px 0 6px">In possesso (N + D)</div>';
  h+=riga('Verticali (tutti)',etaMedia(yP.filter(p=>p.categoria==='VE')));
  h+=riga('Code',etaMedia(yP.filter(p=>p.categoria==='CO')));
  h+=riga('Verticali Silent',etaMedia(yP.filter(p=>p.categoria==='VE'&&p.silent==='S')));
  h+='<div style="height:0.5px;background:#f0f0f0;margin:10px 0"></div>';

  h+=riga('Verticali (tutti)',etaMedia(yV.filter(p=>p.categoria==='VE')));
  h+=riga('Code',etaMedia(yV.filter(p=>p.categoria==='CO')));
  h+=riga('Verticali Silent',etaMedia(yV.filter(p=>p.categoria==='VE'&&p.silent==='S')));
  h+='</div>';

/* ============ IL PIANOFORTE SCRITTO NELLE NOTE DEL CLIENTE ============
   Nelle note dei contatti il pianoforte e' scritto come viene: "PIANOFORTE
   YAMAHA U1A 4.356.515", "KAWAI<tab>HAT20 2194899", "U5AS SILENT MATRICOLA
   5407792", "YAMAHA U3D + KIT SILENT GENIO MATRICOLA 910648", e la parola
   matricola a volte non c'e' o e' storpiata (MATRCIOLA, MATRCOLA, Matrciola).
   Prima si pretendeva la parola "Matricola" e si prendeva come marca la prima
   parola della riga: su 155 clienti col pianoforte nelle note ne uscivano 122.
   Adesso la marca si riconosce da un elenco - che si allarga da solo con le
   marche dell'Excel - e il numero si cerca anche senza la parola. */
const MARCHE_NOTE=['PEARL RIVER','YOUNG CHANG','WILH STEINBERG','B. STEINER','GRAND HAUS',
  'YAMAHA','KAWAI','SAMICK','DIAPASON','SCHIMMEL','STEINWAY','BECHSTEIN','SEILER','ESSEX',
  'BOSTON','PETROF','BOSENDORFER','RITMULLER','HOFFMANN','ZIMMERMANN','GAVEAU','PLEYEL',
  'ERARD','BLUTHNER','FEURICH','GROTRIAN','SAUTER','IBACH','FAZIOLI','NORDISKA','WEINBACH',
  'ROSLER','SCHOLZE','SIHEKO','STEINER','STEINBERG','KNIGHT','WEBER','HYUNDAI','BERGMANN',
  'CHALLEN','KEMBLE','WALDSTEIN','EISENBERG','HAESSLER','BENTLEY','BRODMANN','KINGSBURG',
  'CLAVINOVA','ROLAND','CASIO','GENERALMUSIC','TOKAI','ATLAS','FAZER','ANELLI'];

// Le marche dell'Excel valgono quanto quelle scritte qui: cosi' l'elenco si
// aggiorna da solo a ogni importazione, senza che nessuno lo ritocchi a mano.
function marcheConosciute(){
  const s=new Set(MARCHE_NOTE);
  (typeof pianos!=='undefined'?pianos:[]).forEach(function(p){
    const m=String(p.marca||'').trim().toUpperCase();
    if(m.length>2) s.add(m);
  });
  return Array.from(s).sort(function(a,b){ return b.length-a.length; }); // prima quelle di due parole
}

// Una matricola e' un gruppo unico di lettere e cifre con almeno cinque cifre:
// 1937493, J25161932, D3637787, 4.356.515 (i punti si buttano). Cosi' restano
// fuori i modelli (U3H, B113, MC301) e gli importi del canone.
function matricolaDaTesto(t){
  const p=String(t||'').replace(/[.\s]/g,'');
  if(!/^[A-Za-z0-9-]{5,14}$/.test(p)) return '';
  return (p.match(/\d/g)||[]).length>=5 ? p.toUpperCase() : '';
}

function leggiPianoDaRiga(riga){
  const t=String(riga).replace(/\s+/g,' ').trim();
  if(!t) return null;
  const su=t.toUpperCase();
  let marca='', iMarca=-1;
  const marche=marcheConosciute();
  for(let k=0;k<marche.length;k++){
    const i=su.indexOf(marche[k]);
    if(i>=0 && (i===0 || /[^A-Z]/.test(su.charAt(i-1)))){ marca=marche[k]; iMarca=i+marche[k].length; break; }
  }
  const parlaDiPiano = marca || /pianoforte/i.test(t);
  const kw=t.match(/\bmatr[a-z]*\b\.?\s*:?/i);
  let matricola='', prima = iMarca>=0 ? t.slice(iMarca) : t;
  if(kw){
    // Detta la parola, il numero viene dopo: qui si e' piu' larghi (bastano due
    // cifre) perche' a dirlo e' la nota stessa. Es. "Matricola I 0G07427".
    const pezzi=t.slice(kw.index+kw[0].length).split(' ');
    for(let i=0;i<pezzi.length;i++){
      const p=pezzi[i].replace(/[.\s]/g,'');
      if(/^[A-Za-z0-9-]{4,14}$/.test(p) && (p.match(/\d/g)||[]).length>=2){ matricola=p.toUpperCase(); break; }
    }
    prima = t.slice(iMarca>=0?iMarca:0, kw.index);
  } else if(parlaDiPiano && !/\b(cell|tel|telefono|cellulare|iban|p\.?\s?iva|c\.f)\b/i.test(t)){
    // Senza la parola si prende l'ultimo gruppo che somiglia a una matricola,
    // ma solo su righe che parlano di pianoforti: su una riga di recapiti un
    // numero di telefono finirebbe per sembrare una matricola.
    const pezzi=t.split(' ');
    for(let i=pezzi.length-1;i>=0;i--){
      const v=matricolaDaTesto(pezzi[i]);
      if(v){ matricola=v; prima=pezzi.slice(0,i).join(' '); if(iMarca>=0) prima=prima.slice(iMarca); break; }
    }
  }
  if(!marca && !matricola) return null;
  let modello=prima.split(/\+/)[0]
    .replace(/^\s*(?:PIANOFORTE|PIANO)\b/i,'').replace(/\bMODELLO\b/i,'')
    .replace(/\b(SILENT|ADSILENT|KORG|KYOSHI|GENIO|PREMIUM|KIT|ORIGINALE)\b/gi,'')
    .replace(/[-–,:]/g,' ').replace(/\s+/g,' ').trim().toUpperCase();
  let colore='';
  const c=modello.match(/^(.*?)\s*\b(BIANCO|NERO)\b\s*$/);
  if(c){ modello=c[1].trim(); colore=c[2]; }
  return {marca:marca, modello:modello, matricola:matricola, colore:colore};
}

// Nelle note puo' esserci piu' di un pianoforte (uno cambiato, uno reso): vince
// l'ultimo che porta una matricola, perche' e' quello buono adesso.
function leggiPianoDaNote(notes){
  const trovati=[];
  String(notes||'').split('\n').forEach(function(l){
    const r=leggiPianoDaRiga(l);
    if(r) trovati.push(r);
  });
  if(!trovati.length) return {marca:'',modello:'',matricola:'',colore:''};
  const conMatricola=trovati.filter(function(x){ return x.matricola; });
  return conMatricola.length ? conMatricola[conMatricola.length-1] : trovati[trovati.length-1];
}

function selezionaClienteContratto(id){
  const c=contatti.find(x=>x.id===id);
  if(!c) return;
  const notes=c.notes||'';

  // Parse notes line by line
  const lines=notes.split('\n');
  let cf='',canone='',trasporto='',colore='',finitura='';
  const piano=leggiPianoDaNote(notes);
  const silentM=notes.toLowerCase().includes('silent');
  const emailM=notes.match(/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i);

  lines.forEach(line=>{
    const l=line.trim();
    // CF: "C.F. XXXXXXXXXXXXXXXX"
    const cfMatch=l.match(/C\.F\.\s+([A-Z0-9]{6,16})/i);
    if(cfMatch) cf=cfMatch[1].toUpperCase();

    // "Canone Annuo € 660 + € 200 Trasporto"
    const canoneMatch=l.match(/Canone\s+Annuo[^\d]*(\d+)/i);
    if(canoneMatch) canone=canoneMatch[1];
    const trasportoMatch=l.match(/\+[^\d]*(\d+)\s*Trasporto/i);
    if(trasportoMatch) trasporto=trasportoMatch[1];

    // Colore/Finitura se scritti esplicitamente
    const coloreMatch=l.match(/^Colore[:\s]+(.+)/i);
    if(coloreMatch) colore=coloreMatch[1].trim().toUpperCase();
    const finituraMatch=l.match(/^Finitura[:\s]+(.+)/i);
    if(finituraMatch) finitura=finituraMatch[1].trim();
  });

  contrattoForm={
    ...contrattoForm,
    clienteId:c.id,
    nome:c.nome,
    indirizzo:(c.indirizzo||'').replace(/\n/g,' ').replace(/\s+/g,' ').trim(),
    telefono:(c.telefono||'').replace(/^\+39\s*/,''),
    email:emailM?emailM[0]:'',
    cf,marca:piano.marca,modello:piano.modello,matricola:piano.matricola,
    colore:colore||piano.colore||contrattoForm.colore,
    finitura:finitura||contrattoForm.finitura,
    canone,
    trasportoConsegna:trasporto,
    silent:silentM,
  };
  contrattoClienteSearch='';
  render();
}

async function generaContratto(){
  const btn=document.getElementById('btn-genera');
  const status=document.getElementById('contratto-status');
  btn.disabled=true;btn.textContent='Generazione...';
  const f=contrattoForm;
  const num=parseInt(lsGet('pf_contratto_num')||'333');
  const canoneM=f.canone?Math.round(parseFloat(f.canone)/12):0;
  const rataMesi=f.tipoRata==='personalizzato'?f.mesiRata:
    f.tipoRata==='annuale'?12:f.tipoRata==='semestrale'?6:
    f.tipoRata==='quadrimestrale'?4:f.tipoRata==='trimestrale'?3:1;
  const rataLabel=f.tipoRata==='personalizzato'?'ogni '+f.mesiRata+' mesi':
    f.tipoRata==='annuale'?'Annuali Anticipate':
    f.tipoRata==='semestrale'?'Semestrali':
    f.tipoRata==='quadrimestrale'?'Quadrimestrali':
    f.tipoRata==='trimestrale'?'Trimestrali':'Mensili';
  const rataImporto=Math.round(parseFloat(f.canone||0)/12*rataMesi);
  const dataFmt=f.dataInizio?new Date(f.dataInizio).toLocaleDateString('it-IT'):'';

  try{
    status.innerHTML='<span class="spinner"></span>Invio dati ad Apps Script...';
    const payload={
      numero:num,
      nome:f.nome,
      indirizzo:f.indirizzo,
      telefono:f.telefono,
      cf:f.cf||'',
      email:f.email||'',
      marca:f.marca,
      modello:f.modello+(f.silent?' (SILENT)':''),
      colore:f.colore,
      finitura:f.finitura,
      matricola:f.matricola,
      valore:f.valore,
      valore_sgabello:f.valoreSgabello||'80',
      silent:f.silent,
      prezzo_in_contratto:f.prezzoInContratto!==false,
      canone:f.canone,
      canone_mensile:String(canoneM)+'.00',
      tipo_rata:rataLabel,
      durata:f.durataAnni,
      trasporto_consegna:f.trasportoConsegna||'0',
      trasporto_ritiro:f.trasportoRitiro||'0',
      tipo_contratto:f.tipoContratto,
      data_inizio:f.dataInizio,
      luogo:f.luogo,
      nome_breve:f.nome.split(' ')[0],
    };

    // Apps Script requires no-cors for POST, use GET with params for simple calls
    // Or use a form submit approach
    const res=await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      body:JSON.stringify(payload),
      headers:{'Content-Type':'text/plain'},
      redirect:'follow'
    });
    const text=await res.text();
    let data;
    try{ data=JSON.parse(text); }
    catch(e){ throw new Error('Risposta non valida da Apps Script: '+text.substring(0,100)); }

    if(data.success){
      lsSet('pf_contratto_num',String(num+1));
      status.innerHTML='<span style="color:#A01020;font-weight:500">✓ Contratto #'+num+' salvato su Drive!</span><br>'
        +(data.wordUrl?'<a href="'+data.wordUrl+'" target="_blank" style="font-size:12px;color:#555;margin-right:12px">📄 Apri Word</a>':'')
        +(data.pdfUrl?'<a href="'+data.pdfUrl+'" target="_blank" style="font-size:12px;color:#A01020">📕 Apri PDF</a>':'');
      btn.textContent='✓ Salvato';
    } else {
      throw new Error(data.error||'Errore sconosciuto');
    }
  }catch(err){
    status.innerHTML='<span style="color:#A32D2D">Errore: '+err.message+'</span>';
    btn.disabled=false;btn.textContent='Riprova';
  }
}

async function uploadDrive(blob,mime,name,folder){
  const meta={name,parents:[folder]};
  const form=new FormData();
  form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
  form.append('file',blob);
  const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
    method:'POST',headers:{Authorization:'Bearer '+gToken},body:form
  });
  if(res.status===401){gToken=null;lsDel('pf_gtoken');googleAuth();throw new Error('Sessione Google scaduta, riconnessione in corso...');}
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'Upload fallito');}
  return res.json();
}

async function loadJSZip(){
  if(window.JSZip) return window.JSZip;
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload=()=>resolve(window.JSZip);
    s.onerror=()=>reject(new Error('JSZip non caricato'));
    document.head.appendChild(s);
  });
}

function xmlEsc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// Legge i campi che l'app scrive nella descrizione. Ogni campo deve stare a inizio
// riga: prima bastava che la parola comparisse dentro una frase, e una riga come
// "Consegna pianoforte ore 16" diventava un pianoforte chiamato "ORE 16".
// Le righe che non sono campi finiscono in altreRighe: e' il testo scritto a mano
// su Google, e quando si salva una modifica deve restare dov'e'.
// Consegna e Ritiro si scrivono AAAA-MM-GG (li legge anche Prossimi 3 giorni), ma
// si accetta pure GG/MM/AAAA: prima il modulo cercava solo quello, e riaprendo un
// concerto la consegna spariva.
function parseNotesConcerto(notes){
  const r={altreRighe:[]};
  if(!notes) return r;
  const giornoIso=function(s){
    const m=String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    return m?(m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2)):s;
  };
  const referente=function(testo){
    const p=testo.trim().split(' ');
    return p.length>1?{nome:p.slice(0,-1).join(' '),tel:p[p.length-1]}:{nome:p[0]||'',tel:''};
  };
  notes.split('\n').forEach(function(l){
    let m;
    if((m=l.match(/^\s*Pianoforte[:\s]+(.+)/i))) r.pianoforte=m[1].trim().toUpperCase();
    else if((m=l.match(/^\s*Location[:\s]+(.+)/i))) r.location=m[1].trim();
    else if((m=l.match(/^\s*Indirizzo[:\s]+(.+)/i))) r.indirizzo=m[1].trim();
    else if((m=l.match(/^\s*Compenso[:\s]+(.+)/i))) r.compenso=m[1].trim().replace(/\+\s*IVA/i,'').trim();
    else if((m=l.match(/^\s*Pagamento[:\s]+(.+)/i))) r.metodoPagamento=m[1].trim();
    else if((m=l.match(/^\s*Consegna[:\s]+(\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{4})\s+(\d{1,2}[:.]\d{2})/i))){ r.dataConsegna=giornoIso(m[1]); r.oraConsegna=m[2].replace('.',':'); }
    else if((m=l.match(/^\s*Ritiro[:\s]+(\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{4})\s+(\d{1,2}[:.]\d{2})/i))){ r.dataRitiro=giornoIso(m[1]); r.oraRitiro=m[2].replace('.',':'); }
    else if((m=l.match(/^\s*Referente([123])[:\s]+(.+)/i))){ const x=referente(m[2]); r['contatto'+m[1]+'nome']=x.nome; r['contatto'+m[1]+'tel']=x.tel; }
    else if((m=l.match(/^\s*Note[:\s]+(.+)/i))) r.note=m[1].trim();
    else if(l.trim()) r.altreRighe.push(l);
  });
  return r;
}

async function syncConcerti(){
  if(!gToken){googleAuth();return;}
  const st=document.getElementById('concerti-status');
  if(st) st.innerHTML='<span class="spinner"></span>Carico...';
  try{
    const from=new Date(new Date().getFullYear()-1,0,1).toISOString();
    const to=new Date(new Date().getFullYear()+2,11,31).toISOString();

    // 1. Prende lista di tutti i calendari
    const calListRes=await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList',{headers:{Authorization:'Bearer '+gToken}});
    const calList=await calListRes.json();
    if(handleGoogleAuthError(calList))return;
    if(calList.error) throw new Error(calList.error.message);

    // 2. Per ogni calendario recupera TUTTI gli eventi (con paginazione: un calendario
    // pieno di storico puo' superare i 500 eventi per pagina, tagliando fuori quelli piu' recenti)
    const allItems=[];
    for(const cal of (calList.items||[])){
      let pageToken='';
      do{
        const url='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(cal.id)+'/events?timeMin='+encodeURIComponent(from)+'&timeMax='+encodeURIComponent(to)+'&singleEvents=true&orderBy=startTime&maxResults=500'+(pageToken?'&pageToken='+encodeURIComponent(pageToken):'');
        const res=await fetch(url,{headers:{Authorization:'Bearer '+gToken}});
        const data=await res.json();
        if(handleGoogleAuthError(data))return;
        if(data.error) break;
        (data.items||[]).forEach(e=>{e.__calId=cal.id;e.__calNome=cal.summaryOverride||cal.summary||cal.id;allItems.push(e);});
        pageToken=data.nextPageToken||'';
      }while(pageToken);
    }

    // 3. Filtra per keyword nel titolo OPPURE marcatori strutturati nella descrizione
    concerti=allItems.filter(e=>{
      const titolo=(e.summary||'').toLowerCase();
      const desc=(e.description||'').toLowerCase();
      return KEYWORDS_CONCERTI.some(k=>titolo.includes(k))||DESC_MARKERS_CONCERTI.some(k=>desc.includes(k));
    }).map(e=>{
      const p=parseNotesConcerto(e.description||'');
      return {id:e.id,titolo:e.summary||'',data:(e.start.date||e.start.dateTime||'').substring(0,10),luogo:e.location||'',location:p.location||'',indirizzo:p.indirizzo||'',pianoforte:p.pianoforte||'',compenso:p.compenso||'',metodoPagamento:p.metodoPagamento||'',dataConsegna:p.dataConsegna||'',oraConsegna:p.oraConsegna||'',dataRitiro:p.dataRitiro||'',oraRitiro:p.oraRitiro||'',contatto1nome:p.contatto1nome||'',contatto1tel:p.contatto1tel||'',contatto2nome:p.contatto2nome||'',contatto2tel:p.contatto2tel||'',contatto3nome:p.contatto3nome||'',contatto3tel:p.contatto3tel||'',note:p.note||'',calId:e.__calId||'',calNome:e.__calNome||'',altreRighe:p.altreRighe||[]};
    });

    lsSet('pf_concerti',concerti);
    if(st) st.innerHTML='<span style="color:#A01020">✓ '+concerti.length+' eventi</span>';
    setTimeout(()=>render(),800);
  }catch(err){
    if(st) st.innerHTML='<span style="color:#A32D2D">Errore: '+err.message+'</span>';
  }
}

// Google vuole la data di fine ESCLUSIVA: per un evento di un giorno solo la fine
// e' il giorno dopo. Scrivendo fine = inizio l'evento dura zero e i calendari non
// lo disegnano. Cosi' invece appare, e appare solo nel giorno scelto.
function pfGiornoDopo(d){
  if(!d) return d;
  var p=String(d).split('-');
  if(p.length!==3) return d;
  var dt=new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
  dt.setUTCDate(dt.getUTCDate()+1);
  return dt.toISOString().slice(0,10);
}

/* ================= DA FARE (Google Tasks) =================
   Le cose in sospeso stanno sopra la giornata, dentro Agenda: si vedono senza
   cercarle, e la barra si chiude quando danno fastidio. Vengono da Google Tasks,
   che NON e' il calendario: gli eventi e le attivita' sono due mondi diversi e
   l'API del calendario le attivita' non le restituisce, per questo serve una
   chiamata a parte e un permesso a parte. Il quadratino le chiude davvero su
   Google; "in agenda" apre il modulo dell'Agenda gia' compilato, cosi' una
   pendenza diventa un impegno con una data. */
let taskListe=[];
let taskAttivita=[];
let taskCaricateAlle=0;
let taskAperto=true;
let taskTutte=false;
let taskPermesso=true;
let taskMotivo='';
const TASK_COLORI=['#3F51B5','#0F9D58','#C8791A','#8E24AA','#039BE5','#D81B60'];
const TASK_QUANTE=4;

function taskColore(listId){
  for(var i=0;i<taskListe.length;i++){ if(taskListe[i].id===listId) return TASK_COLORI[i%TASK_COLORI.length]; }
  return '#bbb';
}
function taskNomeLista(listId){
  for(var i=0;i<taskListe.length;i++){ if(taskListe[i].id===listId) return taskListe[i].titolo; }
  return '';
}

// Una scadenza vecchia di quattro anni non e' "in ritardo": e' un relitto. Dirlo
// a chiare lettere serve, nasconderlo no.
function taskScadenza(due){
  if(!due) return '';
  var d=new Date(due); if(isNaN(d.getTime())) return '';
  var oggi=new Date(); oggi.setHours(0,0,0,0);
  var g=Math.round((new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-oggi)/86400000);
  if(g>1) return {testo:'fra '+g+' giorni',vecchia:false};
  if(g===1) return {testo:'domani',vecchia:false};
  if(g===0) return {testo:'oggi',vecchia:false};
  var r=-g;
  if(r>=365) { var a=Math.floor(r/365); return {testo:'scaduta da '+a+(a===1?' anno':' anni'),vecchia:true}; }
  if(r>=30) { var m=Math.floor(r/30); return {testo:'scaduta da '+m+(m===1?' mese':' mesi'),vecchia:true}; }
  return {testo:'scaduta da '+r+(r===1?' giorno':' giorni'),vecchia:true};
}

async function caricaAttivita(forza){
  if(!gToken) return;
  if(!forza && taskAttivita.length && (Date.now()-taskCaricateAlle)<180000) return;
  try{
    const res=await fetch('https://tasks.googleapis.com/tasks/v1/users/@me/lists?maxResults=50',{headers:{Authorization:'Bearer '+gToken}});
    const data=await res.json();
    // 403 = il token e' buono ma non copre le attivita': e' il permesso nuovo,
    // va chiesto una volta sola e con un bottone, non con un salto improvviso.
    if(res.status===403||(data.error&&data.error.code===403)){ taskPermesso=false; taskMotivo=(data.error&&data.error.message)||''; render(); return; }
    if(handleGoogleAuthError(data))return;
    if(data.error) throw new Error(data.error.message);
    taskPermesso=true;
    taskListe=(data.items||[]).map(function(l){ return {id:l.id,titolo:l.title||''}; });
    const tutte=[];
    for(const lista of taskListe){
      const u='https://tasks.googleapis.com/tasks/v1/lists/'+encodeURIComponent(lista.id)+'/tasks?showCompleted=false&showHidden=false&maxResults=100';
      const r2=await fetch(u,{headers:{Authorization:'Bearer '+gToken}});
      const d2=await r2.json();
      if(d2.error) continue;
      (d2.items||[]).forEach(function(t){
        if(t.status==='completed') return;
        if(!t.title||!t.title.trim()) return;
        tutte.push({id:t.id,listId:lista.id,titolo:t.title.trim(),note:t.notes||'',due:t.due||'',pos:t.position||''});
      });
    }
    // Prima quelle con una data (le piu' vecchie in cima), poi quelle senza.
    tutte.sort(function(a,b){
      if(a.due&&b.due) return a.due.localeCompare(b.due);
      if(a.due) return -1;
      if(b.due) return 1;
      return 0;
    });
    taskAttivita=tutte;
    taskCaricateAlle=Date.now();
    lsSet('pf_task',{liste:taskListe,attivita:taskAttivita});
    render();
  }catch(err){ /* silenzio: il blocco semplicemente non compare */ }
}

/* ================= AGENDA, PROSSIMI 3 GIORNI E DA FARE, IN GRANDE =================
   Le tre sezioni che si guardano fuori dall'ufficio, rifatte con la misura dei
   tasti della home: fascia colorata con l'ora a sinistra, titolo che si legge,
   Mappa e Chiama grandi abbastanza da centrarli in piedi. Tutto in colonna:
   si scorre solo in verticale, niente che scappi di lato. */

// Sul giallo e sul celeste dei calendari il bianco sparisce: il testo della
// fascia segue il colore, non il contrario.
function agTestoSu(hex){
  var c=String(hex||'').replace('#','');
  if(c.length===3) c=c.charAt(0)+c.charAt(0)+c.charAt(1)+c.charAt(1)+c.charAt(2)+c.charAt(2);
  if(c.length!==6) return '#fff';
  var r=parseInt(c.slice(0,2),16), g=parseInt(c.slice(2,4),16), b=parseInt(c.slice(4,6),16);
  if(isNaN(r)||isNaN(g)||isNaN(b)) return '#fff';
  return (0.299*r+0.587*g+0.114*b)>165 ? '#17131a' : '#fff';
}

// In Prossimi 3 giorni di ogni evento resta scritto solo il NOME del calendario,
// non il suo id: il colore si cerca prima per id, poi per nome.
function agColorePer(calId,nome){
  if(calId){ var c=agCal(calId); if(c) return c.colore; }
  for(var i=0;i<agCalendari.length;i++){ if(agCalendari[i].nome===nome) return agCalendari[i].colore; }
  return '#A01020';
}

function grFascia(colore,grande,piccola){
  return '<div class="gr-ora" style="background:'+colore+';color:'+agTestoSu(colore)+'">'
    +'<span class="g">'+grande+'</span>'
    +(piccola?'<span class="p">'+piccola+'</span>':'')+'</div>';
}
function grGiorno(etichetta,quanti){
  return '<div class="gr-giorno"><b>'+agEsc(etichetta)+'</b>'
    +(quanti?'<span class="q">'+quanti+(quanti===1?' impegno':' impegni')+'</span>':'')
    +'<span class="filo"></span></div>';
}
function grCampo(etichetta,valore,onchange,tipo,id){
  return '<div class="gr-campo"><label for="'+id+'">'+etichetta+'</label>'
    +'<input id="'+id+'" type="'+(tipo||'text')+'" value="'+agEsc(valore||'')+'" onchange="'+onchange+'"></div>';
}
function grLeva(acceso,testo,onclick){
  return '<button class="gr-sw" onclick="'+onclick+'">'+testo
    +'<span class="gr-leva'+(acceso?' on':'')+'"><i></i></span></button>';
}
const GR_GIORNI=['dom','lun','mar','mer','gio','ven','sab'];
function grOraDi(r){
  if(r.giornoIntero) return {g:'&#9679;', p:'tutto il giorno'};
  return {g:('0'+r.quando.getHours()).slice(-2)+':'+('0'+r.quando.getMinutes()).slice(-2),
          p:GR_GIORNI[r.quando.getDay()]};
}

/* ---------------- Prossimi 3 giorni ---------------- */

function grTelefono(t){
  if(!t.tel) return t.nome?'<span class="et" style="font-size:12.5px;color:#999;align-self:center">'+agEsc(t.nome)+'</span>':'';
  var wa=t.tel.replace(/\D/g,'');
  if(wa.length===10&&wa.charAt(0)==='3') wa='39'+wa;
  return '<a href="tel:'+agEsc(t.tel)+'"><span>&#9742;</span><span class="et">'+agEsc(t.nome||t.tel)+'</span></a>'
    +'<a href="https://wa.me/'+wa+'" target="_blank" rel="noopener" style="color:#A01020"><span class="et">WhatsApp</span></a>';
}

function renderProssimi(){
  if(!prossimiEventi.length){ try{const d=lsGet('pf_prossimi'); if(d) prossimiEventi=JSON.parse(d);}catch(e){} }
  if(!agCalendari.length){ try{const d=lsGet('pf_calendari'); if(d) agCalendari=JSON.parse(d);}catch(e){} }
  let h='<div style="font-size:12.5px;color:#888;margin-bottom:12px">Oggi, domani e dopodomani: tutto quello che c\'e\' in calendario</div>';
  h+='<button class="gr-chiaro" onclick="caricaProssimi(true)">&#8635; Aggiorna da Google</button>';
  h+='<div id="prossimi-status" style="font-size:12.5px;color:#888;margin-bottom:8px"></div>';
  if(!gToken) return h+'<div class="gr-vuoto">Connetti Google dalla tab Sync</div>';
  const righe=prossimiRighe();
  if(!righe.length) return h+'<div class="gr-vuoto">Nessun impegno nei prossimi tre giorni</div>';

  const quanti={};
  righe.forEach(function(r){ const k=r.quando.toDateString(); quanti[k]=(quanti[k]||0)+1; });
  let giorno='';
  righe.forEach(function(r){
    const k=r.quando.toDateString();
    if(k!==giorno){ giorno=k; h+=grGiorno(prossimiEtichettaGiorno(r.quando),quanti[k]); }
    const col=agColorePer(r.calId,r.cal);
    const o=grOraDi(r);
    h+='<div class="gr-ev">'+grFascia(col,o.g,o.p)+'<div class="gr-corpo">';
    h+='<div class="gr-tit">'+(r.tipo?'<span class="gr-eti">'+agEsc(r.tipo)+'</span>':'')+agEsc(r.titolo)+'</div>';
    const az=[];
    if(r.luogo) az.push('<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.luogo)+'" target="_blank" rel="noopener"><span>&#128205;</span><span class="et">'+agEsc(r.luogo)+'</span></a>');
    if(r.tel&&r.tel.length) r.tel.forEach(function(t){ const b=grTelefono(t); if(b) az.push(b); });
    if(az.length) h+='<div class="gr-az">'+az.join('')+'</div>';
    if(r.cal) h+='<div class="gr-sotto"><i class="gr-pallino" style="background:'+col+'"></i>'+agEsc(r.cal)+'</div>';
    h+='</div></div>';
  });
  return h;
}

/* ---------------- Da fare (Google Tasks) ---------------- */

const GR_MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function taskGiornoCorto(due){
  if(!due) return '';
  var d=new Date(due);
  if(isNaN(d.getTime())) return '';
  return d.getUTCDate()+' '+GR_MESI[d.getUTCMonth()];
}

function renderDaFare(){
  if(!gToken) return '';
  if(!taskPermesso){
    // Due rifiuti diversi si somigliano: "non mi hai dato il permesso" si aggiusta
    // con un consenso, "la Tasks API del progetto e' spenta" no, e un bottone
    // Consenti manderebbe solo in giro a vuoto. Il messaggio vero di Google resta
    // scritto sotto in piccolo, cosi' anche un terzo caso si riconosce.
    var spenta=/has not been used|is disabled|accessNotConfigured|SERVICE_DISABLED/i.test(taskMotivo||'');
    var testo=spenta
      ? 'Le attivita\' non arrivano: nel progetto Google la Tasks API risulta spenta.'
      : 'Per vedere qui le cose in sospeso serve il permesso alle attivita\' di Google.';
    return '<div class="card" style="padding:13px 14px;margin-bottom:12px">'
     +'<div style="font-size:13.5px;color:#666;line-height:1.4;margin-bottom:'+(spenta?'0':'10px')+'">'+testo+'</div>'
     +(spenta?'':'<button class="gr-chiaro" style="margin:0" onclick="googleAuth()">Dai il permesso</button>')
     +(taskMotivo?'<div style="font-size:10.5px;color:#bbb;margin-top:8px;word-break:break-word">'+agEsc(taskMotivo).slice(0,220)+'</div>':'')
     +'</div>';
  }
  if(!taskListe.length&&!taskAttivita.length) return '';

  let h='<div class="gr-testa" onclick="taskToggleBlocco()">'
   +'<span class="nome">DA FARE</span>'
   +(taskAttivita.length?'<span class="conta">'+taskAttivita.length+'</span>':'')
   +'<span style="flex:1"></span>'
   +'<button class="gr-piu" onclick="event.stopPropagation();taskNuovo()">&#43; Nuova</button>'
   +'<span style="color:#bbb;font-size:15px">'+(taskAperto?'&#9662;':'&#9656;')+'</span></div>';
  if(!taskAperto) return h;
  if(!taskAttivita.length) return h+'<div class="gr-vuoto" style="padding:18px 14px;font-size:13.5px">Niente in sospeso</div>';

  const quante=taskTutte?taskAttivita.length:Math.min(TASK_QUANTE,taskAttivita.length);
  for(let i=0;i<quante;i++){
    const t=taskAttivita[i];
    const col=taskColore(t.listId);
    const s=taskScadenza(t.due);
    const giorno=taskGiornoCorto(t.due);
    h+='<div class="gr-ev">'+grFascia(col,giorno||'&#9679;',giorno?'scadenza':'senza data')+'<div class="gr-corpo">';
    h+='<div class="gr-tit" style="cursor:pointer" onclick="taskApri('+i+')">'+agEsc(t.titolo)+'</div>';
    h+='<div class="gr-az">'
      +'<button onclick="taskCompleta('+i+')" style="border-color:#1f8a4c;color:#1f8a4c;font-weight:600"><span>&#10003;</span><span class="et">Fatta</span></button>'
      +'<button onclick="taskInAgenda('+i+')"><span>&#128197;</span><span class="et">In agenda</span></button>'
      +'</div>';
    h+='<div class="gr-sotto"><i class="gr-pallino" style="background:'+col+'"></i>'+agEsc(taskNomeLista(t.listId))
      +(s?'<span style="color:'+(s.vecchia?'#C8791A':'#999')+'">&middot; '+s.testo+'</span>':'')+'</div>';
    h+='</div></div>';
  }
  if(taskAttivita.length>quante){
    h+='<button class="gr-chiaro" onclick="taskTutte=true;render()">Vedi le altre '+(taskAttivita.length-quante)+'</button>';
  }else if(taskTutte&&taskAttivita.length>TASK_QUANTE){
    h+='<button class="gr-chiaro" onclick="taskTutte=false;render()">Mostra meno</button>';
  }
  return h;
}

const GR_ORE=['08:30','09:00','10:00','11:00','14:30','16:00','18:00'];
function agOraPiu(ora,minuti){
  var p=String(ora||'09:00').split(':');
  var m=(parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0)+minuti;
  m=((m%1440)+1440)%1440;
  return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2);
}
