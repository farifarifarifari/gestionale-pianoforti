function taskToggleBlocco(){ taskAperto=!taskAperto; lsSet('pf_task_aperto',taskAperto?'1':'0'); render(); }

async function taskCompleta(i){
  const t=taskAttivita[i]; if(!t||!gToken) return;
  // Sparisce subito dall'elenco: se Google dice di no, torna al suo posto.
  taskAttivita.splice(i,1); render();
  try{
    const u='https://tasks.googleapis.com/tasks/v1/lists/'+encodeURIComponent(t.listId)+'/tasks/'+encodeURIComponent(t.id);
    const res=await fetch(u,{method:'PATCH',headers:{Authorization:'Bearer '+gToken,'Content-Type':'application/json'},body:JSON.stringify({status:'completed'})});
    const data=await res.json();
    if(data.error) throw new Error(data.error.message);
    lsSet('pf_task',{liste:taskListe,attivita:taskAttivita});
  }catch(err){
    taskAttivita.splice(i,0,t); render();
    alert('Non sono riuscito a chiuderla: '+err.message);
  }
}

// Il titolo e le note dell'attivita' entrano nell'evento: sulle fatture le note
// contengono CIG, determina e codice univoco, ed e' roba che serve averci dentro.
function taskInAgenda(i){
  const t=taskAttivita[i]; if(!t) return;
  agForm=agFormVuoto();
  agForm.titolo=t.titolo;
  agForm.note=t.note||'';
  if(t.due){ const d=new Date(t.due); if(!isNaN(d.getTime())){ const s=d.toISOString().slice(0,10); if(s>=agOggi()) agForm.data=s; } }
  render();
}

/* Il passaggio nei due sensi: come per gli eventi, un'attivita' si crea, si
   corregge e si cancella da qui, e su Google si vede subito. Cambiare lista
   vuol dire in realta' rifarla nell'altra e togliere la vecchia - Google non
   sa spostarle - ma da fuori si vede solo l'attivita' che cambia posto. */
let taskForm=null;

function taskFormVuoto(){
  const pref=lsGet('pf_task_ultima_lista');
  const lista=(pref&&taskNomeLista(pref))?pref:((taskListe[0]&&taskListe[0].id)||'');
  return {modo:'nuovo',listId:lista,listOrig:'',id:'',titolo:'',note:'',data:''};
}
function taskNuovo(){ if(!taskListe.length){alert('Nessuna lista di attivita\' trovata su Google');return;} taskForm=taskFormVuoto(); render(); }
function taskApri(i){
  const t=taskAttivita[i]; if(!t) return;
  let data='';
  if(t.due){ const d=new Date(t.due); if(!isNaN(d.getTime())) data=d.toISOString().slice(0,10); }
  taskForm={modo:'modifica',listId:t.listId,listOrig:t.listId,id:t.id,titolo:t.titolo,note:t.note||'',data:data,indice:i};
  render();
}
function taskScegliLista(i){ if(taskListe[i]&&taskForm){ taskForm.listId=taskListe[i].id; render(); } }

function taskCorpo(f){
  const c={title:f.titolo,notes:f.note||''};
  if(f.data) c.due=f.data+'T00:00:00.000Z';
  return c;
}

async function taskSalva(){
  if(!gToken){googleAuth();return;}
  const f=taskForm;
  if(!f.titolo||!f.titolo.trim()){alert('Serve almeno il titolo');return;}
  const btn=document.getElementById('btn-salva-task');
  if(btn){btn.disabled=true;btn.textContent='Salvataggio...';}
  try{
    const corpo=taskCorpo(f);
    if(f.modo==='modifica'&&f.listOrig&&f.listOrig!==f.listId){
      // Google non sposta un'attivita' da una lista all'altra: la si rifa' di la'
      // e si toglie di qua.
      const c1=await fetch('https://tasks.googleapis.com/tasks/v1/lists/'+encodeURIComponent(f.listId)+'/tasks',{method:'POST',headers:{Authorization:'Bearer '+gToken,'Content-Type':'application/json'},body:JSON.stringify(corpo)});
      const d1=await c1.json();
      if(handleGoogleAuthError(d1))return;
      if(d1.error) throw new Error(d1.error.message);
      await fetch('https://tasks.googleapis.com/tasks/v1/lists/'+encodeURIComponent(f.listOrig)+'/tasks/'+encodeURIComponent(f.id),{method:'DELETE',headers:{Authorization:'Bearer '+gToken}});
    }else{
      const url=(f.modo==='nuovo')
        ? 'https://tasks.googleapis.com/tasks/v1/lists/'+encodeURIComponent(f.listId)+'/tasks'
        : 'https://tasks.googleapis.com/tasks/v1/lists/'+encodeURIComponent(f.listId)+'/tasks/'+encodeURIComponent(f.id);
      const res=await fetch(url,{method:(f.modo==='nuovo'?'POST':'PATCH'),headers:{Authorization:'Bearer '+gToken,'Content-Type':'application/json'},body:JSON.stringify(corpo)});
      const data=await res.json();
      if(handleGoogleAuthError(data))return;
      if(data.error) throw new Error(data.error.message);
    }
    lsSet('pf_task_ultima_lista',f.listId);
    taskForm=null;
    await caricaAttivita(true);

}

/* ================= AGENDA =================
   Il calendario di amministrazione non e' uno solo: e' il negozio (blu), Andrea
   (verde), Rodolfo (ocra), l'UFFICIO (viola), gli Aiutanti Collaboratori. Qui
   dentro ci sono tutti, con il loro colore vero preso da Google, e ci si scrive
   dentro: si sceglie il calendario, il giorno, l'ora oppure tutto il giorno, e
   l'evento nasce su Google. Quello che si scrive qui si vede la', quello che si
   scrive la' si vede qui. Le voci gia' in calendario si aprono, si correggono e
   si cancellano da qui, e si possono anche spostare da un calendario all'altro. */
let agCalendari=[];
let agEventi=[];
let agCaricatoAlle=0;
let agNascosti={};
let agMostraPassati=false;
let agForm=null;
let agRigheCache=[];
const AG_INDIETRO=30, AG_AVANTI=180;

function agEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function agCal(id){for(var i=0;i<agCalendari.length;i++){if(agCalendari[i].id===id)return agCalendari[i];}return null;}
function agColore(id){var c=agCal(id);return c?c.colore:'#bbb';}
function agNome(id){var c=agCal(id);return c?c.nome:id;}
function agOggi(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function agPallino(id){return '<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+agColore(id)+';flex-shrink:0"></span>';}

async function agCaricaCalendari(){
  const res=await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList',{headers:{Authorization:'Bearer '+gToken}});
  const data=await res.json();
  if(handleGoogleAuthError(data))return false;
  if(data.error) throw new Error(data.error.message);
  agCalendari=(data.items||[]).map(function(c){
    return {id:c.id,nome:c.summaryOverride||c.summary||c.id,colore:c.backgroundColor||'#A01020',
            scrivibile:(c.accessRole==='owner'||c.accessRole==='writer'),primario:!!c.primary};
  });
  lsSet('pf_calendari',agCalendari);
  return true;
}

async function caricaAgenda(forza){
  if(!gToken){googleAuth();return;}
  if(!forza && agEventi.length && (Date.now()-agCaricatoAlle)<180000) return;
  const st=document.getElementById('agenda-status');
  if(st) st.innerHTML='<span class="spinner"></span>Carico...';
  try{
    if(!(await agCaricaCalendari())) return;
    const da=new Date(); da.setHours(0,0,0,0); da.setDate(da.getDate()-AG_INDIETRO);
    const a=new Date(); a.setHours(0,0,0,0); a.setDate(a.getDate()+AG_AVANTI);
    const tutti=[];
    for(const cal of agCalendari){
      let pageToken='';
      do{
        const url='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(cal.id)+'/events?timeMin='+encodeURIComponent(da.toISOString())+'&timeMax='+encodeURIComponent(a.toISOString())+'&singleEvents=true&orderBy=startTime&maxResults=250'+(pageToken?'&pageToken='+encodeURIComponent(pageToken):'');
        const res=await fetch(url,{headers:{Authorization:'Bearer '+gToken}});
        const data=await res.json();
        if(handleGoogleAuthError(data))return;
        if(data.error) break;
        (data.items||[]).forEach(function(e){ e.__calId=cal.id; tutti.push(e); });
        pageToken=data.nextPageToken||'';
      }while(pageToken);
    }
    agEventi=tutti;
    agCaricatoAlle=Date.now();
    lsSet('pf_agenda',tutti);
    render();
  }catch(err){ if(st) st.innerHTML='<span style="color:#A32D2D">Errore: '+err.message+'</span>'; }
}

function agRighe(){
  const oggi=new Date(); oggi.setHours(0,0,0,0);
  const out=[];
  agEventi.forEach(function(e){
    if(agNascosti[e.__calId]) return;
    if(e.status==='cancelled') return;
    const gi=!!(e.start&&e.start.date);
    const iso=(e.start&&(e.start.dateTime||e.start.date))||'';
    if(!iso) return;
    const q=gi?new Date(+iso.substring(0,4),+iso.substring(5,7)-1,+iso.substring(8,10)):new Date(iso);
    if(!agMostraPassati && q<oggi) return;
    out.push({id:e.id,calId:e.__calId,titolo:e.summary||'(senza titolo)',luogo:e.location||'',
              note:e.description||'',quando:q,giornoIntero:gi,ev:e});
  });
  out.sort(function(x,y){return x.quando-y.quando;});
  return out;
}

function agToggleCal(i){
  const c=agCalendari[i]; if(!c) return;
  if(agNascosti[c.id]) delete agNascosti[c.id]; else agNascosti[c.id]=true;
  lsSet('pf_agenda_nascosti',agNascosti);
  render();
}

function agFormVuoto(){
  const scrivibili=agCalendari.filter(function(c){return c.scrivibile;});
  const pref=lsGet('pf_agenda_ultimo_cal');
  const cal=(pref&&agCal(pref)&&agCal(pref).scrivibile)?pref:((scrivibili[0]&&scrivibili[0].id)||'primary');
  return {modo:'nuovo',calendarId:cal,calOrig:'',id:'',titolo:'',data:agOggi(),dataFine:'',
          tuttoIlGiorno:true,oraInizio:'09:00',oraFine:'10:00',luogo:'',note:''};
}
function agNuovo(){ agForm=agFormVuoto(); render(); }

function agApri(i){
  const r=agRigheCache[i]; if(!r) return;
  const e=r.ev;
  const gi=!!(e.start&&e.start.date);
  let data='',dataFine='',oraI='',oraF='';
  if(gi){
    data=e.start.date.substring(0,10);
    // Google tiene la fine esclusiva: l'ultimo giorno vero e' quello prima.
    const f=e.end&&e.end.date?e.end.date.substring(0,10):'';
    if(f){ const d=new Date(f+'T00:00:00'); d.setDate(d.getDate()-1);
      const s=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
      if(s!==data && s>data) dataFine=s; }
  }else{
    const si=e.start.dateTime, fi=(e.end&&e.end.dateTime)||'';
    const sd=new Date(si);
    data=sd.getFullYear()+'-'+('0'+(sd.getMonth()+1)).slice(-2)+'-'+('0'+sd.getDate()).slice(-2);
    oraI=('0'+sd.getHours()).slice(-2)+':'+('0'+sd.getMinutes()).slice(-2);
    if(fi){ const fd=new Date(fi);
      oraF=('0'+fd.getHours()).slice(-2)+':'+('0'+fd.getMinutes()).slice(-2);
      const fs=fd.getFullYear()+'-'+('0'+(fd.getMonth()+1)).slice(-2)+'-'+('0'+fd.getDate()).slice(-2);
      if(fs!==data) dataFine=fs;
    }
  }
  agForm={modo:'modifica',calendarId:r.calId,calOrig:r.calId,id:r.id,titolo:e.summary||'',data:data,dataFine:dataFine,
          tuttoIlGiorno:gi,oraInizio:oraI||'09:00',oraFine:oraF||'10:00',luogo:e.location||'',note:e.description||''};
  render();
}

function agScegliCal(i){
  const scrivibili=agCalendari.filter(function(c){return c.scrivibile;});
  if(scrivibili[i]&&agForm){ agForm.calendarId=scrivibili[i].id; render(); }
}
function agUsaTitolo(i){
  if(!agForm) return;
  const r=agTitoliRecenti(agForm.calendarId);
  if(r[i]){ agForm.titolo=r[i]; render(); }
}

// I titoli gia' usati in quel calendario: nella riga dei collaboratori i nomi
// tornano sempre gli stessi, e riscriverli ogni volta e' tempo buttato.
function agTitoliRecenti(calId){
  const visti=[];
  agEventi.filter(function(e){return e.__calId===calId&&e.summary;})
    .sort(function(a,b){return String((b.start&&(b.start.dateTime||b.start.date))||'').localeCompare(String((a.start&&(a.start.dateTime||a.start.date))||''));})
    .forEach(function(e){ const t=e.summary.trim(); if(t&&visti.indexOf(t)<0&&visti.length<6) visti.push(t); });
  return visti;
}

function agCorpoEvento(f){
  const ev={summary:f.titolo,location:f.luogo||'',description:f.note||''};
  if(f.tuttoIlGiorno){
    ev.start={date:f.data};
    ev.end={date:pfGiornoDopo(f.dataFine&&f.dataFine>f.data?f.dataFine:f.data)};
  }else{
    const fine=(f.dataFine&&f.dataFine>f.data)?f.dataFine:f.data;
    ev.start={dateTime:f.data+'T'+(f.oraInizio||'09:00')+':00',timeZone:'Europe/Rome'};
    ev.end={dateTime:fine+'T'+(f.oraFine||f.oraInizio||'10:00')+':00',timeZone:'Europe/Rome'};
  }
  return ev;
}

async function agSalva(){
  if(!gToken){googleAuth();return;}
  const f=agForm;
  if(!f.titolo||!f.data){alert('Servono almeno il titolo e la data');return;}
  if(!f.tuttoIlGiorno && (!f.dataFine||f.dataFine===f.data) && f.oraFine && f.oraFine<=f.oraInizio){
    alert('L\'ora di fine deve venire dopo quella di inizio');return;
  }
  const btn=document.getElementById('btn-salva-agenda');
  if(btn){btn.disabled=true;btn.textContent='Salvataggio...';}
  try{
    const corpo=agCorpoEvento(f);
    let url,metodo;
    if(f.modo==='nuovo'){
      url='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(f.calendarId)+'/events';
      metodo='POST';
    }else{
      // Se e' cambiato calendario l'evento va prima spostato: l'id resta lo stesso
      // ma vive in un altro calendario, e la PATCH deve andare a bussare la'.
      if(f.calOrig&&f.calOrig!==f.calendarId){
        const mv=await fetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(f.calOrig)+'/events/'+encodeURIComponent(f.id)+'/move?destination='+encodeURIComponent(f.calendarId),{method:'POST',headers:{Authorization:'Bearer '+gToken}});
        const mvd=await mv.json();
        if(handleGoogleAuthError(mvd))return;
        if(mvd.error) throw new Error(mvd.error.message);
      }
      url='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(f.calendarId)+'/events/'+encodeURIComponent(f.id);
      metodo='PATCH';
    }
    const res=await fetch(url,{method:metodo,headers:{Authorization:'Bearer '+gToken,'Content-Type':'application/json'},body:JSON.stringify(corpo)});
    const data=await res.json();
    if(handleGoogleAuthError(data))return;
    if(data.error) throw new Error(data.error.message);
    lsSet('pf_agenda_ultimo_cal',f.calendarId);
    agForm=null;
    await caricaAgenda(true);
  }catch(err){
    alert('Errore: '+err.message);
    if(btn){btn.disabled=false;btn.textContent='Salva sul calendario';}
  }
}

async function agElimina(){
  if(!agForm||agForm.modo!=='modifica') return;
  if(!confirm('Eliminare "'+agForm.titolo+'" dal calendario '+agNome(agForm.calendarId)+'?')) return;
  try{
    const res=await fetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(agForm.calOrig||agForm.calendarId)+'/events/'+encodeURIComponent(agForm.id),{method:'DELETE',headers:{Authorization:'Bearer '+gToken}});
    if(res.status!==204&&res.status!==200){
      const data=await res.json().catch(function(){return {};});
      if(handleGoogleAuthError(data))return;
      throw new Error((data.error&&data.error.message)||('errore '+res.status));
    }
    agForm=null;
    await caricaAgenda(true);
  }catch(err){ alert('Errore: '+err.message); }
}


/* ================= PROSSIMI 3 GIORNI =================
   La giornata come la si vive fuori dall'ufficio: tutto quello che c'e' in
   calendario - concerti, consegne, ritiri, appuntamenti in negozio, personali -
   in un elenco solo, in ordine di ora, con l'indirizzo che apre Maps e il numero
   che parte con un tocco. Le righe Consegna: e Ritiro: scritte dentro un concerto
   diventano voci a se', perche' sono momenti diversi della giornata. */
let prossimiEventi=[];
let prossimiCaricatoAlle=0;
const GIORNI_SETT=['domenica','lunedi','martedi','mercoledi','giovedi','venerdi','sabato'];

function prossimiFinestra(){
  const da=new Date(); da.setHours(0,0,0,0);
  const a=new Date(da); a.setDate(a.getDate()+3);
  return {da:da,a:a};
}
function prossimiTelefoni(desc){
  const out=[];
  (desc||'').split('\n').forEach(function(r){
    const m=r.match(/^\s*Referente\d*\s*:\s*(.+)$/i);
    if(!m) return;
    const t=m[1].match(/(\+?\d[\d\s\.\-]{6,})/);
    out.push({nome:m[1].replace(/(\+?\d[\d\s\.\-]{6,})/,'').trim(), tel:t?t[1].replace(/[\s\.\-]/g,''):''});
  });
  return out;
}
function prossimiLuogo(e){
  const d=e.description||'';
  const loc=(d.match(/^\s*Location\s*:\s*(.+)$/im)||[])[1]||'';
  const ind=(d.match(/^\s*Indirizzo\s*:\s*(.+)$/im)||[])[1]||'';
  return [e.location||'',loc,ind].filter(Boolean).join(' - ');
}
function prossimiRighe(){
  const f=prossimiFinestra(), righe=[];
  prossimiEventi.forEach(function(e){
    if(!e.start) return;
    const giornoIntero=!!e.start.date;
    const inizio=giornoIntero?new Date(String(e.start.date).slice(0,10)+'T00:00:00'):new Date(e.start.dateTime);
    if(isNaN(inizio)) return;
    if(inizio>=f.da&&inizio<f.a) righe.push({quando:inizio,giornoIntero:giornoIntero,tipo:'',titolo:e.summary||'(senza titolo)',luogo:prossimiLuogo(e),tel:prossimiTelefoni(e.description),cal:e.__cal||'',calId:e.__calId||''});
    ['Consegna','Ritiro'].forEach(function(voce){
      const m=(e.description||'').match(new RegExp('^\\s*'+voce+'\\s*:\\s*(\\d{4}-\\d{2}-\\d{2})\\s+(\\d{1,2}[:.]\\d{2})','im'));
      if(!m) return;
      const q=new Date(m[1]+'T'+m[2].replace('.',':')+':00');
      if(isNaN(q)||q<f.da||q>=f.a) return;
      righe.push({quando:q,giornoIntero:false,tipo:voce,titolo:voce+' - '+(e.summary||''),luogo:prossimiLuogo(e),tel:prossimiTelefoni(e.description),cal:e.__cal||'',calId:e.__calId||''});
    });
  });
  righe.sort(function(a,b){
    const ga=a.quando.toDateString(), gb=b.quando.toDateString();
    if(ga!==gb) return a.quando-b.quando;
    if(a.giornoIntero!==b.giornoIntero) return a.giornoIntero?-1:1;
    return a.quando-b.quando;
  });
  return righe;
}
async function caricaProssimi(forza){
  if(!gToken){googleAuth();return;}
  if(!forza && prossimiEventi.length && (Date.now()-prossimiCaricatoAlle)<300000) return;
  const st=document.getElementById('prossimi-status');
  if(st) st.innerHTML='<span class="spinner"></span>Carico...';
  try{
    const f=prossimiFinestra();
    const calRes=await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList',{headers:{Authorization:'Bearer '+gToken}});
    const calList=await calRes.json();
    if(handleGoogleAuthError(calList))return;
    if(calList.error) throw new Error(calList.error.message);
    const tutti=[];
    for(const cal of (calList.items||[])){
      const url='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(cal.id)+'/events?timeMin='+encodeURIComponent(f.da.toISOString())+'&timeMax='+encodeURIComponent(f.a.toISOString())+'&singleEvents=true&orderBy=startTime&maxResults=250';
      const res=await fetch(url,{headers:{Authorization:'Bearer '+gToken}});
      const data=await res.json();
      if(data.error) continue;
      (data.items||[]).forEach(function(e){ e.__cal=cal.summary||''; e.__calId=cal.id; tutti.push(e); });
    }
    prossimiEventi=tutti;
    prossimiCaricatoAlle=Date.now();
    lsSet('pf_prossimi',JSON.stringify(tutti));
    render();
  }catch(err){ if(st) st.innerHTML='<span style="color:#A32D2D">Errore: '+err.message+'</span>'; }
}
function prossimiEtichettaGiorno(d){
  const oggi=new Date(); oggi.setHours(0,0,0,0);
  const diff=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-oggi)/86400000);
  const testa=diff===0?'Oggi':(diff===1?'Domani':GIORNI_SETT[d.getDay()]);
  return testa+' '+d.getDate()+' '+MONTHS_SHORT[d.getMonth()];
}
function prossimiTelHtml(t){
  if(!t.tel) return t.nome?('<span style="color:#888">'+t.nome+'</span>'):'';
  let wa=t.tel.replace(/\D/g,'');
  if(wa.length===10&&wa.charAt(0)==='3') wa='39'+wa;
  return '<a href="tel:'+t.tel+'" style="color:#A01020;text-decoration:none">&#9742; '+(t.nome||t.tel)+'</a>'
    + ' <a href="https://wa.me/'+wa+'" target="_blank" style="color:#888;text-decoration:none;font-size:11px">WhatsApp</a>';
}
// Conteggio dell'anno solare mostrato: 1 gennaio - 31 dicembre. Sta sotto ai mesi e
// non cambia scorrendo i mesi; cambia solo passando a un altro anno.
function riepilogoAnnoConcerti(anno){
  var dellAnno=concerti.filter(function(c){ return c.data && String(c.data).slice(0,4)===String(anno); });
  var c3=0,c7=0,altri=0;
  dellAnno.forEach(function(c){
    var p=String(c.pianoforte||'').toUpperCase();
    if(/\bC3\b/.test(p)) c3++;
    else if(/\bC7\b/.test(p)) c7++;
    else altri++;
  });
  function chip(et,n){ return '<span style="background:#f5f5f5;border-radius:10px;padding:7px 12px;white-space:nowrap">'+et+' <b style="color:#A01020;font-size:14px">'+n+'</b></span>'; }
  return '<div style="display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:13px;color:#888;margin:0 0 14px">'
    + '<span style="font-weight:600">Anno '+anno+'</span>'
    + chip('C3',c3) + chip('C7',c7) + chip('Altri',altri) + chip('Totale',dellAnno.length)
    + '</div>';
}

// Come e' stato pagato, a colpo d'occhio: la sezione Concerti serve anche da
// promemoria per la fatturazione. Sull'evento resta scritto il valore di sempre
// (Fattura, Cash, Gratis, Sponsorizzazione): cambia solo come si mostra. Un
// concerto senza pagamento indicato ha la sua targhetta grigia, perche' e'
// proprio quello che resta da sistemare.
const LOGO_P_MINI='<svg viewBox="96 78 64 60" width="16" height="15" style="vertical-align:-3px"><path fill="#c03" d="M126.94,136.09H97.65v-2.83h8.49L122.9,88.42s1.42-4.92-2.35-3.71-11.45,15.36-11.45,15.36l-1.84-.11s5.72-9.88,8.44-13.63c7.41-10.24,13.47-5,14,.67,14.85-13.74,27.94-3.55,24.14,11-3.71,14.28-22.38,26.26-28.11,13.73l-.74,1.48-6.33,20.21H127Zm3.5-39.71c-3.44,8.71-3.69,15.09-.56,16.33s8.47-3.13,11.91-11.84,3.7-15.09.57-16.33S133.89,87.67,130.44,96.38Z"/></svg>';
const PAGAMENTI_CONCERTO=[
  {valore:'Fattura',            icona:'&#128221;', testo:'Fattura'},
  {valore:'Cash',               icona:'&#128181;', testo:'Contanti'},
  {valore:'Sponsorizzazione',   icona:LOGO_P_MINI, testo:'Sponsor'},
  {valore:'Gratis',             icona:'<span style="color:#d32f2f;font-weight:700">&#10010;</span>', testo:'Gratis'}
];
function pagamentoConcerto(metodo){
  const v=String(metodo||'').trim(), k=v.toLowerCase();
  for(let i=0;i<PAGAMENTI_CONCERTO.length;i++){
    const p=PAGAMENTI_CONCERTO[i];
    if(k===p.valore.toLowerCase()) return p;
    if(p.valore==='Cash'&&k.indexOf('contant')===0) return p;
  }
  return v?{valore:v,icona:'&euro;',testo:v}:null;
}
function chipPagamento(metodo){
  const p=pagamentoConcerto(metodo);
  if(!p) return '<span class="gr-chip" style="cursor:default;color:#b0b0b0" title="Pagamento non indicato">? pagamento</span>';
  return '<span class="gr-chip" style="cursor:default" title="Pagamento: '+agEsc(p.valore)+'">'+p.icona+' <span class="et">'+agEsc(p.testo)+'</span></span>';
}

// Rosso quello passato, arancio quello entro la settimana, verde il resto: sono
// gli stessi colori delle scadenze, cosi' non c'e' un secondo codice da imparare.
function concertoColore(gg){ return gg<0?'#E24B4A':(gg<=7?'#EF9F27':'#639922'); }

function renderConcerti(){
  try{const d=lsGet('pf_concerti');if(d&&!concerti.length)concerti=JSON.parse(d);}catch(e){}
  if(showFormConcerto) return renderFormConcerto();
  const mc=concerti.filter(function(c){ if(!c.data) return false; const d=new Date(c.data); return d.getMonth()===concertiMonth&&d.getFullYear()===concertiYear; });

  let h='<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">'
   +'<button class="gr-chip" onclick="prevMonthConcerti()" style="padding:12px 14px;font-weight:600">&lsaquo; '+MONTHS_SHORT[(concertiMonth+11)%12]+'</button>'
   +'<div style="flex:1;text-align:center;font-size:17px;font-weight:700">'+MONTHS[concertiMonth]+' '+concertiYear+'</div>'
   +'<button class="gr-chip" onclick="nextMonthConcerti()" style="padding:12px 14px;font-weight:600">'+MONTHS_SHORT[(concertiMonth+1)%12]+' &rsaquo;</button></div>';
  h+=riepilogoAnnoConcerti(concertiYear);
  h+='<button class="gr-tasto" onclick="editingConcertoId=null;concertoForm=concertoVuoto();showFormConcerto=true;render()">&#43;&nbsp;&nbsp;Nuovo concerto<span class="fr">&rsaquo;</span></button>';

  else h+='<div class="gr-vuoto">Connetti Google dalla tab Sync</div>';
  if(!mc.length) return h+'<div class="gr-vuoto">Nessun concerto in '+MONTHS[concertiMonth]+'</div>';

  mc.sort(function(a,b){ return new Date(a.data)-new Date(b.data); }).forEach(function(c){
    const d=new Date(c.data);
    const gg=Math.round((d-new Date().setHours(0,0,0,0))/86400000);
    const col=concertoColore(gg);
    const quando=gg<0?Math.abs(gg)+'gg fa':(gg===0?'Oggi':(gg===1?'Domani':'fra '+gg+'gg'));
    h+='<div class="gr-ev">'+grFascia(col,d.getDate(),GR_MESI[d.getMonth()])+'<div class="gr-corpo">';
    h+='<div style="display:flex;align-items:flex-start;gap:8px">'
      +'<div class="gr-tit" style="flex:1">'+agEsc(c.titolo)+'</div>'
      +'<span style="background:'+col+'1f;color:'+col+';border-radius:9px;padding:4px 9px;font-size:11.5px;font-weight:700;white-space:nowrap">'+quando+'</span></div>';
    const esteso=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
    h+='<div style="font-size:12.5px;color:#999">'+esteso.charAt(0).toUpperCase()+esteso.slice(1)+'</div>';

    const az=[];
    if(c.luogo) az.push('<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.luogo)+'" target="_blank" rel="noopener"><span>&#128205;</span><span class="et">'+agEsc(c.luogo)+'</span></a>');
    [1,2,3].forEach(function(n){
      const nome=c['contatto'+n+'nome'], tel=c['contatto'+n+'tel'];
      if(tel) az.push('<a href="tel:'+agEsc(tel)+'"><span>&#9742;</span><span class="et">'+agEsc(nome||tel)+'</span></a>');
    });
    if(az.length) h+='<div class="gr-az">'+az.join('')+'</div>';

    h+='<div class="gr-az">'
      +'<span class="gr-chip" style="cursor:default">&#127929; <span class="et">'+(c.pianoforte?agEsc(c.pianoforte):'&mdash;')+'</span></span>'
      +'<span class="gr-chip" style="cursor:default">&euro; <span class="et">'+(c.compenso?agEsc(c.compenso):'&mdash;')+'</span></span>'
      +chipPagamento(c.metodoPagamento)+'</div>';

    if(c.dataConsegna||c.dataRitiro){
      h+='<div class="gr-az">'
        +(c.dataConsegna?'<span class="gr-chip" style="cursor:default">&#128666; <span class="et">Consegna '+agEsc(c.dataConsegna)+(c.oraConsegna?' ore '+agEsc(c.oraConsegna):'')+'</span></span>':'')
        +(c.dataRitiro?'<span class="gr-chip" style="cursor:default">&#8617; <span class="et">Ritiro '+agEsc(c.dataRitiro)+(c.oraRitiro?' ore '+agEsc(c.oraRitiro):'')+'</span></span>':'')
        +'</div>';
    }

    h+='<button class="gr-chiaro" style="margin:2px 0 0;border-color:#A01020;color:#A01020" onclick="modificaConcerto(\''+c.id+'\')">&#9998; Modifica</button>';
    h+='</div></div>';
  });
  return h;
}

// I concerti si leggono da TUTTI i calendari, ma la modifica andava sempre sul
// principale: un concerto segnato nel calendario di Rodolfo li' non esiste, e
// Google rispondeva "Not Found". Ora si cerca il calendario giusto; se la copia
// in memoria e' vecchia e non lo sa, si provano i calendari uno per uno.
async function concertoTrovaEvento(id, calNoto){
  const prova=async function(cal){
    const r=await fetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(cal)+'/events/'+encodeURIComponent(id),{headers:{Authorization:'Bearer '+gToken}});
    if(r.status===200) return {cal:cal, evento:await r.json()};
    if(r.status===401){ handleGoogleAuthError({error:{code:401}}); throw new Error('collegamento Google scaduto'); }
    return null;
  };
  if(calNoto){ const t=await prova(calNoto); if(t) return t; }
  const res=await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList',{headers:{Authorization:'Bearer '+gToken}});
  const lista=await res.json();
  if(handleGoogleAuthError(lista)) throw new Error('collegamento Google scaduto');
  for(const c of (lista.items||[])){
    if(c.id===calNoto) continue;
    const t=await prova(c.id);
    if(t) return t;
  }
  return null;
}

function concertoPiuGiorni(iso,n){
  const p=String(iso).split('-');
  const d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  d.setUTCDate(d.getUTCDate()+n);
  return d.toISOString().slice(0,10);
}
function concertoGiorniTra(a,b){
  const pa=String(a).split('-'), pb=String(b).split('-');
  return Math.round((Date.UTC(+pb[0],+pb[1]-1,+pb[2])-Date.UTC(+pa[0],+pa[1]-1,+pa[2]))/86400000);
}

async function aggiornaEventoCalendar(){
  if(!gToken){googleAuth();return;}
  const f=concertoForm;
  if(!f.titolo||!f.data){alert('Inserisci titolo e data');return;}
  const btn=document.getElementById('btn-salva-concerto');
  btn.disabled=true;btn.textContent='Salvataggio...';
  try{
    const trovato=await concertoTrovaEvento(editingConcertoId, f.calId);
    if(!trovato) throw new Error('evento non trovato su nessun calendario: forse e\' stato cancellato su Google. Premi "Aggiorna da Google Calendar".');
    const ev=trovato.evento;

    // La descrizione si ricostruisce partendo da quella che c'e' ADESSO su Google,
    // non dalla copia in memoria: il testo scritto a mano resta in cima com'era, i
    // campi dell'app vengono dopo. Prima si riscriveva solo con i campi, e tutto il
    // resto spariva.
    const letto=parseNotesConcerto(ev.description||'');
    const campi=[
      f.pianoforte?'Pianoforte: '+f.pianoforte:'',
      f.location?'Location: '+f.location:'',
      f.indirizzo?'Indirizzo: '+f.indirizzo:'',
      f.compenso?'Compenso: '+f.compenso+' +IVA':'',
      f.metodoPagamento?'Pagamento: '+f.metodoPagamento:'',
      f.dataConsegna&&f.oraConsegna?'Consegna: '+f.dataConsegna+' '+f.oraConsegna:'',
      f.dataRitiro&&f.oraRitiro?'Ritiro: '+f.dataRitiro+' '+f.oraRitiro:'',
      f.contatto1nome?'Referente1: '+f.contatto1nome+(f.contatto1tel?' '+f.contatto1tel:''):'',
      f.contatto2nome?'Referente2: '+f.contatto2nome+(f.contatto2tel?' '+f.contatto2tel:''):'',
      f.contatto3nome?'Referente3: '+f.contatto3nome+(f.contatto3tel?' '+f.contatto3tel:''):'',
      f.note?'Note: '+f.note:'',
    ].filter(Boolean);
    const modifica={
      summary:f.titolo,
      location:f.luogo||'',
      description:(letto.altreRighe||[]).concat(campi).join('\n'),
    };

    // PATCH e non PUT: si toccano solo titolo, luogo, descrizione e, se e' cambiato,
    // il giorno. Promemoria, colore e invitati restano quelli che erano.
    // Se il giorno cambia, l'evento conserva durata e orario.
    const giornoPrima=ev.start&&(ev.start.date||String(ev.start.dateTime||'').slice(0,10));
    if(giornoPrima && f.data!==giornoPrima){
      if(ev.start.date){
        const lungo=Math.max(1,concertoGiorniTra(ev.start.date, ev.end.date));
        modifica.start={date:f.data};
        modifica.end={date:concertoPiuGiorni(f.data,lungo)};
      } else {
        const zona=ev.start.timeZone||'Europe/Rome';
        const scarto=concertoGiorniTra(giornoPrima, String(ev.end.dateTime).slice(0,10));
        modifica.start={dateTime:f.data+'T'+String(ev.start.dateTime).slice(11,19), timeZone:zona};
        modifica.end={dateTime:concertoPiuGiorni(f.data,scarto)+'T'+String(ev.end.dateTime).slice(11,19), timeZone:ev.end.timeZone||zona};
      }
    }

    const res=await fetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(trovato.cal)+'/events/'+encodeURIComponent(editingConcertoId),{
      method:'PATCH',
      headers:{Authorization:'Bearer '+gToken,'Content-Type':'application/json'},
      body:JSON.stringify(modifica)
    });
    const data=await res.json();
    if(handleGoogleAuthError(data))return;
    if(data.error) throw new Error(data.error.message);
    editingConcertoId=null;
    showFormConcerto=false;
    concertoForm=concertoVuoto();
    await syncConcerti();
  }catch(err){
    alert('Errore: '+err.message);
    btn.disabled=false;btn.textContent='Salva modifiche';
  }
}

   La meta' di Andrea del lavoro dei dipendenti: cosa hanno fatto, quanto ci
   hanno messo e dove, piu' le mansioni che assegna lui e l'elenco di chi puo'
   entrare. I dati non stanno qui: stanno nel foglio "LAVORI PlayPiano", dietro
   lo script "Dipendenti PlayPiano", lo stesso che usa l'app facility. Qui si
   entra col codice di Andrea, che vale come chiave di amministrazione.

   Serve a capire dove se ne vanno le ore, non a pagare nessuno: percio' qui
   dentro non c'e' un solo euro. */

const DIP_API='https://script.google.com/macros/s/AKfycbzYWadcOB4XJqHMps3kuDQpg1nGUHbtegYrZLe8GEdPhkH91jTajZh_ZwaWu0kuOMq-Zw/exec';

let dpPin='', dpDipendenti=[], dpLavori=[], dpListini=null;
let dpSettimana='', dpCaricata='', dpCarico=false, dpVista='report';
let dpForm=null, dpCoda=[], dpErrore='', dpGente=null;

function dpEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function dpOre(min){min=parseInt(min,10)||0;var h=Math.floor(min/60),m=min%60;return h?(h+'h'+(m?' '+m+'m':'')):(m+'m');}
function dpOggi(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function dpPiu(iso,n){var p=iso.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function dpLunedi(iso){var p=iso.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);var g=d.getDay();d.setDate(d.getDate()-(g===0?6:g-1));return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function dpCorto(iso){var g=['dom','lun','mar','mer','gio','ven','sab'];var p=iso.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);return g[d.getDay()]+' '+d.getDate();}
function dpGiorno(iso){var p=iso.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);return d.getDate()+' '+MONTHS_SHORT[d.getMonth()].toLowerCase();}
function dpNome(id){for(var i=0;i<dpDipendenti.length;i++){if(String(dpDipendenti[i].id)===String(id))return dpDipendenti[i].nome;}return '(sconosciuto)';}

// Le letture passano per l'indirizzo, le scritture con piu' voci per il corpo:
// una lista di mansioni non entra in una query.
async function dpChiedi(azione,dati){
  const qp=new URLSearchParams(Object.assign({api:azione},dati||{}));
  const res=await fetch(DIP_API+'?'+qp.toString());
  return await res.json();
}
async function dpManda(azione,dati){
  const res=await fetch(DIP_API,{method:'POST',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify(Object.assign({azione:azione},dati||{}))});
  return await res.json();
}

/* ---------- il codice di amministrazione ---------- */

function dpSchermataCodice(errore){
  return '<div class="card" style="max-width:420px;margin:20px auto">'
    +'<div style="font-size:15px;font-weight:600;margin-bottom:3px">Il tuo codice</div>'
    +'<div style="font-size:12.5px;color:#888;margin-bottom:12px">Serve una volta sola su questo dispositivo.</div>'
    +(errore?'<div style="background:#fdeced;color:#A32D2D;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:10px">'+dpEsc(errore)+'</div>':'')
    +'<input id="dp-pin" type="tel" inputmode="numeric" autocomplete="off" placeholder="- - - -" '
    +'style="width:100%;text-align:center;font-size:24px;letter-spacing:.3em;padding:14px;border:0.5px solid #d8d8d8;border-radius:10px;outline:none">'
    +'<button class="btn-primary" style="margin-top:12px" onclick="dpEntra()">Entra</button></div>';
}

async function dpEntra(){
  const campo=document.getElementById('dp-pin');
  const pin=(campo&&campo.value||'').trim();
  if(!pin) return;
  const m=document.getElementById('main-content');
  m.innerHTML='<div style="text-align:center;color:#aaa;padding:30px;font-size:13px">Controllo...</div>';
  try{
    const r=await dpChiedi('dipendenti',{pin:pin});
    if(!r.ok){ m.innerHTML=dpSchermataCodice(r.errore); return; }
    dpPin=pin; dpDipendenti=r.dipendenti||[];
    lsSet('pf_pin_admin',pin);
    dpSettimana=dpLunedi(dpOggi()); dpCaricata='';
    render();
  }catch(e){ m.innerHTML=dpSchermataCodice('Collegamento non riuscito'); }
}

function dpEsci(){ dpPin=''; dpDipendenti=[]; dpLavori=[]; dpCaricata=''; lsDel('pf_pin_admin'); render(); }

/* ---------- il consuntivo della settimana ---------- */

function renderDipendenti(){
  if(!dpPin){ const p=lsGet('pf_pin_admin'); if(p){ dpPin=p; dpCaricata=''; } }
  if(!dpPin) return dpSchermataCodice();
  if(!dpSettimana) dpSettimana=dpLunedi(dpOggi());
  if(dpVista==='assegna') return renderDpAssegna();
  if(dpVista==='gente') return renderDpGente();
  if(dpCaricata!==dpSettimana && !dpCarico) dpCaricaReport();

  const fine=dpPiu(dpSettimana,6);
  const fatte=dpLavori.filter(function(l){return l.stato==='fatta';});
  const aperte=dpLavori.filter(function(l){return l.stato==='assegnata';});
  const saltate=dpLavori.filter(function(l){return l.stato==='non fatta';});
  const totale=fatte.reduce(function(s,l){return s+(parseInt(l.minuti,10)||0);},0);

  let h='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
    +'<div style="flex:1;font-size:12px;color:#888">Cosa hanno fatto, quanto ci hanno messo e dove.</div>'
    +'<button onclick="dpEsci()" style="background:none;border:0.5px solid #e0e0e0;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;color:#888">esci</button></div>';

  h+='<div style="display:flex;gap:8px;margin-bottom:10px">'
    +'<button class="btn-primary" style="flex:1" onclick="dpApriAssegna()">Assegna lavoro</button>'
    +'<button onclick="dpApriGente()" style="flex:1;background:#fff;border:0.5px solid #d8d8d8;border-radius:8px;padding:11px;font-size:14px;font-family:inherit;cursor:pointer">Chi lavora</button></div>';

  h+='<button onclick="dpSpedisciPianoforti(false)" style="width:100%;margin-bottom:12px;background:none;border:0.5px solid #e0e0e0;border-radius:8px;padding:8px;font-size:12px;color:#888;font-family:inherit;cursor:pointer">Aggiorna l&rsquo;elenco pianoforti che vedono i dipendenti</button>';

  h+='<div class="month-nav">'
    +'<button onclick="dpSposta(-7)">&lsaquo;</button>'
    +'<span>'+dpGiorno(dpSettimana)+' &ndash; '+dpGiorno(fine)+'</span>'
    +'<button onclick="dpSposta(7)">&rsaquo;</button></div>';

  if(dpCarico) return h+'<div style="text-align:center;color:#aaa;padding:30px;font-size:13px">Carico...</div>';

  h+='<div style="background:#1a1a1a;color:#fff;border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:14px">'
    +'<div style="flex:1"><div style="font-size:12px;color:#bbb">Ore della settimana</div>'
    +'<div style="font-size:11.5px;color:#888;margin-top:2px">'+fatte.length+' lavorazioni'
    +(aperte.length?' &middot; '+aperte.length+' ancora aperte':'')
    +(saltate.length?' &middot; '+saltate.length+' non fatte':'')+'</div></div>'
    +'<div style="font-size:22px;font-weight:700">'+dpOre(totale)+'</div></div>';

  if(!dpLavori.length) h+='<div class="card" style="text-align:center;font-size:13px;color:#888">Nessun lavoro segnato in questa settimana</div>';

  // Una scheda per persona: le barre dei giorni dicono a colpo d'occhio dove si
  // e' concentrata la settimana.
  const perDip={};
  dpLavori.forEach(function(l){ const k=String(l.dipendente); if(!perDip[k])perDip[k]=[]; perDip[k].push(l); });
  const ordine=dpDipendenti.filter(function(d){ return perDip[String(d.id)]; })
    .sort(function(a,b){ return dpMinuti(perDip[String(b.id)])-dpMinuti(perDip[String(a.id)]); });
  ordine.forEach(function(d){ h+=dpScheda(d, perDip[String(d.id)]); });

  h+=dpDove(fatte);
  h+=dpStrumenti(fatte);
  if(saltate.length) h+=dpSaltate(saltate);
  if(aperte.length) h+=dpAperte(aperte);
  return h;
}

function dpMinuti(righe){ return righe.reduce(function(s,l){ return s+(l.stato==='fatta'?(parseInt(l.minuti,10)||0):0); },0); }

function dpScheda(dip, righe){
  const fatte=righe.filter(function(l){return l.stato==='fatta';});
  const totale=dpMinuti(righe);
  let perGiorno={}, perCat={}, perSede={};
  for(var i=0;i<7;i++) perGiorno[dpPiu(dpSettimana,i)]=0;
  fatte.forEach(function(l){
    const g=String(l.data).slice(0,10), m=parseInt(l.minuti,10)||0;
    if(perGiorno[g]!==undefined) perGiorno[g]+=m;
    perCat[l.categoria||'ALTRO']=(perCat[l.categoria||'ALTRO']||0)+m;
    perSede[l.sede||'-']=(perSede[l.sede||'-']||0)+m;
  });
  let max=1; Object.keys(perGiorno).forEach(function(g){ if(perGiorno[g]>max) max=perGiorno[g]; });

  let h='<div class="card">'
    +'<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:12px">'
    +'<b style="font-size:15px">'+dpEsc(dip.nome)+'</b>'
    +'<span style="font-size:11.5px;color:#999">'+fatte.length+' lavorazioni</span>'
    +'<b style="margin-left:auto;font-size:18px;color:#A01020">'+dpOre(totale)+'</b></div>';
  Object.keys(perGiorno).forEach(function(g){
    const largo=Math.round((perGiorno[g]/max)*100);
    h+='<div style="display:flex;align-items:center;gap:9px;margin-bottom:5px">'
      +'<span style="font-size:11.5px;color:#999;width:46px">'+dpCorto(g)+'</span>'
      +'<div style="flex:1;height:9px;background:#f0f0f0;border-radius:5px;overflow:hidden"><div style="width:'+largo+'%;height:100%;background:'+(perGiorno[g]?'#A01020':'transparent')+'"></div></div>'
      +'<span style="font-size:11.5px;color:#666;width:52px;text-align:right">'+(perGiorno[g]?dpOre(perGiorno[g]):'&mdash;')+'</span></div>';
  });
  const cats=Object.keys(perCat).sort(function(a,b){return perCat[b]-perCat[a];}).slice(0,4);
  if(cats.length){
    h+='<div style="border-top:0.5px solid #f0f0f0;margin-top:11px;padding-top:9px">';
    cats.forEach(function(c){ h+='<div style="display:flex;font-size:12px;padding:3px 0"><span style="flex:1;color:#666;padding-right:10px">'+dpEsc(c)+'</span><b>'+dpOre(perCat[c])+'</b></div>'; });
    h+='</div>';
  }
  const sedi=Object.keys(perSede).sort(function(a,b){return perSede[b]-perSede[a];});
  if(sedi.length){
    h+='<div style="margin-top:9px;display:flex;flex-wrap:wrap;gap:6px">';
    sedi.forEach(function(s){ h+='<span style="background:#f5f5f5;border-radius:8px;padding:4px 9px;font-size:11px;color:#666">'+dpEsc(s)+' <b style="color:#1a1a1a">'+dpOre(perSede[s])+'</b></span>'; });
    h+='</div>';
  }
  return h+'</div>';
}

function dpDove(fatte){
  if(!fatte.length) return '';
  let perCat={}, totale=0;
  fatte.forEach(function(l){ const m=parseInt(l.minuti,10)||0; perCat[l.categoria||'ALTRO']=(perCat[l.categoria||'ALTRO']||0)+m; totale+=m; });
  const cats=Object.keys(perCat).sort(function(a,b){return perCat[b]-perCat[a];});
  let h='<div class="section-title" style="margin:18px 0 8px">DOVE SE NE VANNO LE ORE</div><div class="card">';
  cats.forEach(function(c){
    const q=Math.round((perCat[c]/totale)*100);
    h+='<div style="margin-bottom:8px"><div style="display:flex;font-size:12.5px;margin-bottom:3px"><span style="flex:1;color:#666;padding-right:10px">'+dpEsc(c)+'</span><b>'+dpOre(perCat[c])+'</b><span style="color:#aaa;width:38px;text-align:right">'+q+'%</span></div>'
      +'<div style="height:7px;background:#f0f0f0;border-radius:4px;overflow:hidden"><div style="width:'+q+'%;height:100%;background:#A01020"></div></div></div>';
  });
  return h+'</div>';
}

// Quante ore costa preparare uno strumento: e' il numero che poi serve quando si
// decide un prezzo, percio' sta qui insieme al resto.
function dpStrumenti(fatte){
  const per={};
  fatte.forEach(function(l){
    let chiave='', etichetta='';
    if(l.pianoNum){ chiave='n'+l.pianoNum; etichetta='#'+l.pianoNum+' '+(l.pianoDesc||''); }
    else if(l.estMarca||l.estMatricola){ chiave='e'+l.estMarca+l.estMatricola; etichetta=(l.estMarca||'')+' '+(l.estModello||'')+(l.estMatricola?' ('+l.estMatricola+')':'')+' - esterno'; }
    else return;
    if(!per[chiave]) per[chiave]={etichetta:etichetta,minuti:0,quante:0};
    per[chiave].minuti+=parseInt(l.minuti,10)||0;
    per[chiave].quante++;
  });
  const chiavi=Object.keys(per).sort(function(a,b){return per[b].minuti-per[a].minuti;});
  if(!chiavi.length) return '';
  let h='<div class="section-title" style="margin:18px 0 8px">ORE PER STRUMENTO</div><div class="card">';
  chiavi.slice(0,15).forEach(function(k){
    h+='<div class="summary-row"><span style="flex:1;padding-right:10px">'+dpEsc(per[k].etichetta)+'</span>'
      +'<span style="color:#aaa;font-size:11.5px;margin-right:8px">'+per[k].quante+'</span><b>'+dpOre(per[k].minuti)+'</b></div>';
  });
  return h+'</div>';
}

function dpSaltate(saltate){
  let h='<div class="section-title" style="margin:18px 0 8px">NON FATTE</div><div class="card">';
  saltate.forEach(function(l){
    h+='<div style="padding:8px 0;border-bottom:0.5px solid #f0f0f0">'
      +'<div style="font-size:13px;font-weight:500">'+dpEsc(l.lavorazione)+'</div>'
      +'<div style="font-size:11.5px;color:#999;margin-top:3px">'+dpEsc(dpNome(l.dipendente))+' &middot; '+dpCorto(String(l.data).slice(0,10))+'</div>'
      +(l.motivo?'<div style="font-size:12px;color:#C8791A;margin-top:4px">'+dpEsc(l.motivo)+'</div>':'')
      +'</div>';
  });
  return h+'</div>';
}

function dpAperte(aperte){
  let h='<div class="section-title" style="margin:18px 0 8px">ASSEGNATE E NON ANCORA CHIUSE</div><div class="card">';
  aperte.forEach(function(l){
    h+='<div class="summary-row"><span style="flex:1;padding-right:10px">'+dpEsc(l.lavorazione)+'</span>'
      +'<span style="font-size:11.5px;color:#999">'+dpEsc(dpNome(l.dipendente))+' &middot; '+dpCorto(String(l.data).slice(0,10))+'</span></div>';
  });
  return h+'</div>';
}

function dpSposta(n){ dpSettimana=dpPiu(dpSettimana,n); dpCaricata=''; render(); }

async function dpCaricaReport(){
  if(dpCarico||!dpPin) return;
  dpCarico=true;
  try{
    const r=await dpChiedi('report',{pin:dpPin,da:dpSettimana,a:dpPiu(dpSettimana,6)});
    if(r.ok){ dpLavori=r.lavori||[]; dpDipendenti=r.dipendenti||dpDipendenti; dpCaricata=dpSettimana; }
  }catch(e){}
  dpCarico=false;
  render();
}

/* ---------- assegnare le mansioni ---------- */

function dpFormVuoto(){
  return {dipendente:(dpDipendenti[0]&&dpDipendenti[0].id)||'', data:dpOggi(), sede:'', categoria:'',
          lavorazione:'', libera:'', cerca:'', cercaP:'', pianoNum:'', pianoDesc:'', note:''};
}
function dpApriAssegna(){ dpVista='assegna'; dpForm=dpFormVuoto(); dpCoda=[]; dpErrore=''; if(!dpListini) dpCaricaListini(); render(); }
function dpChiudiVista(){ dpVista='report'; dpForm=null; dpCoda=[]; dpErrore=''; dpGente=null; render(); }

async function dpCaricaListini(){
  try{ const r=await dpChiedi('listini',{pin:dpPin}); if(r.ok){ dpListini=r; render(); } }catch(e){}
}

function dpChip(testo,acceso,azione){
  return '<button onclick="'+azione+'" style="border:0.5px solid '+(acceso?'#A01020':'#d8d8d8')+';background:'+(acceso?'rgba(160,16,32,.9)':'#fff')+';color:'+(acceso?'#fff':'#1a1a1a')+';border-radius:16px;padding:8px 13px;font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap">'+testo+'</button>';
}
const DP_INPUT='width:100%;border:0.5px solid #d8d8d8;border-radius:10px;padding:11px;font-size:15px;font-family:inherit;background:#fff;outline:none';
function dpTitolo(t){ return '<div class="section-title" style="margin:16px 0 8px">'+t+'</div>'; }

function renderDpAssegna(){
  const f=dpForm;
  let h='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
    +'<button onclick="dpChiudiVista()" style="background:none;border:none;cursor:pointer;color:#888;font-size:20px">&larr;</button>'
    +'<b style="font-size:16px">Assegna lavoro</b></div>';
  if(dpErrore) h+='<div style="background:#fdeced;color:#A32D2D;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:10px">'+dpEsc(dpErrore)+'</div>';
  if(!dpListini) return h+'<div style="text-align:center;color:#aaa;padding:30px;font-size:13px">Carico l&rsquo;elenco...</div>';

  h+=dpTitolo('A CHI')+'<div style="display:flex;flex-wrap:wrap;gap:7px">'
    +dpDipendenti.filter(function(d){return String(d.attivo).toUpperCase()!=='NO';}).map(function(d){
        return dpChip(dpEsc(d.nome), String(f.dipendente)===String(d.id), "dpForm.dipendente='"+String(d.id).replace(/'/g,"\\'")+"';render()");
      }).join('')+'</div>';

  h+=dpTitolo('QUANDO')+'<input type="date" id="dp-data" value="'+dpEsc(f.data)+'" onchange="dpForm.data=this.value" style="'+DP_INPUT+'">'
    +'<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:8px">'
    +dpChip('oggi', f.data===dpOggi(), "dpForm.data=dpOggi();render()")
    +dpChip('domani', f.data===dpPiu(dpOggi(),1), "dpForm.data=dpPiu(dpOggi(),1);render()")
    +dpChip('dopodomani', f.data===dpPiu(dpOggi(),2), "dpForm.data=dpPiu(dpOggi(),2);render()")
    +'</div>';

  h+=dpTitolo('DOVE')+'<div style="display:flex;flex-wrap:wrap;gap:7px">'
    +(dpListini.sedi||[]).map(function(s){ return dpChip(dpEsc(s), f.sede===s, "dpForm.sede='"+s.replace(/'/g,"\\'")+"';render()"); }).join('')+'</div>';

  const cats=Object.keys(dpListini.lavorazioni||{});
  h+=dpTitolo('CHE COSA')+'<div style="display:flex;flex-wrap:wrap;gap:7px">'
    +cats.map(function(c){ return dpChip(dpEsc(c), f.categoria===c, "dpForm.categoria='"+c.replace(/'/g,"\\'")+"';dpForm.lavorazione='';dpForm.cerca='';render()"); }).join('')+'</div>';

  if(f.categoria){
    let voci=(dpListini.lavorazioni[f.categoria]||[]).slice();
    const q=(f.cerca||'').toUpperCase();
    if(q) voci=voci.filter(function(v){return v.toUpperCase().indexOf(q)>=0;});
    h+='<input id="dp-cerca" placeholder="cerca nella categoria" value="'+dpEsc(f.cerca)+'" oninput="dpForm.cerca=this.value;render()" style="'+DP_INPUT+';margin-top:9px">'
      +'<div style="max-height:34vh;overflow-y:auto;background:#fff;border:0.5px solid #e0e0e0;border-radius:11px;margin-top:8px">'
      +voci.map(function(v){
          const sel=f.lavorazione===v?'background:#fdeced;font-weight:600;':'';
          return '<div onclick="dpForm.lavorazione=\''+v.replace(/'/g,"\\'")+'\';render()" style="'+sel+'padding:11px 13px;border-bottom:0.5px solid #f0f0f0;font-size:13.5px;cursor:pointer">'+dpEsc(v)+'</div>';
        }).join('')
      +'<div onclick="dpForm.lavorazione=\'ALTRO\';render()" style="padding:11px 13px;font-size:13.5px;cursor:pointer;color:#A01020;font-weight:600">ALTRO &mdash; scrivo io</div></div>';
    if(f.lavorazione==='ALTRO'){
      h+='<input id="dp-libera" placeholder="scrivi la lavorazione" value="'+dpEsc(f.libera)+'" oninput="dpForm.libera=this.value" style="'+DP_INPUT+';margin-top:8px">';
    }
  }

  h+=dpTitolo('SU QUALE PIANOFORTE (se serve)');
  if(f.pianoNum){
    h+='<div class="card" style="padding:11px 12px;display:flex;align-items:center;gap:9px;margin-bottom:0"><b>#'+dpEsc(f.pianoNum)+'</b>'
      +'<span style="flex:1">'+dpEsc(f.pianoDesc)+'</span>'
      +dpChip('togli', false, "dpForm.pianoNum='';dpForm.pianoDesc='';render()")+'</div>';
  } else {
    const pf=dpListini.pianoforti||[];
    h+='<input id="dp-cercap" placeholder="numero, marca, modello o matricola" value="'+dpEsc(f.cercaP)+'" oninput="dpForm.cercaP=this.value;render()" style="'+DP_INPUT+'">';
    const qp=(f.cercaP||'').toUpperCase();
    const trovati=qp?pf.filter(function(p){return (String(p.numero)+' '+(p.marca||'')+' '+(p.modello||'')+' '+(p.matricola||'')).toUpperCase().indexOf(qp)>=0;}).slice(0,25):[];
    if(trovati.length){
      h+='<div style="max-height:30vh;overflow-y:auto;background:#fff;border:0.5px solid #e0e0e0;border-radius:11px;margin-top:8px">'
        +trovati.map(function(p){
            const d=((p.marca||'')+' '+(p.modello||'')).trim();
            return '<div onclick="dpScegliPiano(\''+String(p.numero)+'\',\''+d.replace(/'/g,"\\'")+'\')" style="padding:11px 13px;border-bottom:0.5px solid #f0f0f0;font-size:13.5px;cursor:pointer"><b>#'+dpEsc(p.numero)+'</b> '+dpEsc(d)+(p.matricola?' <span style="color:#bbb">'+dpEsc(p.matricola)+'</span>':'')+'</div>';
          }).join('')+'</div>';
    } else if(qp){ h+='<div style="font-size:11.5px;color:#999;margin:6px 3px 0">nessun pianoforte trovato</div>'; }
  }

  h+=dpTitolo('NOTE')+'<textarea id="dp-note" placeholder="facoltative" oninput="dpForm.note=this.value" style="'+DP_INPUT+';min-height:64px">'+dpEsc(f.note)+'</textarea>';

  h+='<button onclick="dpAccoda()" style="width:100%;margin-top:12px;background:#fff;border:0.5px solid #d8d8d8;border-radius:10px;padding:12px;font-size:14px;font-family:inherit;cursor:pointer">+ Aggiungi alla lista</button>';

  if(dpCoda.length){
    h+=dpTitolo('DA ASSEGNARE ('+dpCoda.length+')')+'<div class="card">';
    dpCoda.forEach(function(v,i){
      h+='<div class="summary-row"><span style="flex:1;padding-right:10px">'+dpEsc(v.lavorazione)+'<br><span style="font-size:11px;color:#999">'+dpEsc(dpNome(v.dipendente))+' &middot; '+dpCorto(v.data)+' &middot; '+dpEsc(v.sede)+(v.pianoNum?' &middot; #'+dpEsc(v.pianoNum):'')+'</span></span>'
        +'<button onclick="dpToglieCoda('+i+')" style="background:none;border:none;color:#A32D2D;cursor:pointer;font-size:13px">togli</button></div>';
    });
    h+='</div><button class="btn-primary" id="dp-assegna" style="margin-top:10px" onclick="dpAssegna()">Assegna '+dpCoda.length+(dpCoda.length===1?' lavorazione':' lavorazioni')+'</button>';
  }
  return h;
}

function dpScegliPiano(num,desc){ dpForm.pianoNum=num; dpForm.pianoDesc=desc; dpForm.cercaP=''; render(); }
function dpToglieCoda(i){ dpCoda.splice(i,1); render(); }

function dpAccoda(){
  const f=dpForm;
  const voce=f.lavorazione==='ALTRO'?(f.libera||'').trim():f.lavorazione;
  if(!f.dipendente){ dpErrore='Scegli a chi assegnarla'; return render(); }
  if(!f.sede){ dpErrore='Scegli dove'; return render(); }
  if(!voce){ dpErrore='Scegli la lavorazione'; return render(); }
  dpCoda.push({dipendente:f.dipendente, data:f.data, sede:f.sede, categoria:f.categoria,
               lavorazione:voce, pianoNum:f.pianoNum, pianoDesc:f.pianoDesc, note:f.note});
  const tieni={dipendente:f.dipendente, data:f.data, sede:f.sede};
  dpForm=Object.assign(dpFormVuoto(), tieni);
  dpErrore='';
  render();
}

}

async function dpSalvaGente(){
  const g=dpGente;
  if(!g.nome.trim()){ dpErrore='Manca il nome'; return render(); }
  if(!/^[0-9]{3,8}$/.test(String(g.pin).trim())){ dpErrore='Il codice sono solo cifre, da 3 a 8'; return render(); }
  const doppio=dpDipendenti.filter(function(x){ return String(x.pin)===String(g.pin).trim() && String(x.id)!==String(g.id); });
  if(doppio.length){ dpErrore="Quel codice ce l'ha gia' "+doppio[0].nome; return render(); }
  const b=document.getElementById('dp-g-salva'); if(b){ b.disabled=true; b.textContent='Salvo...'; }
  try{
    const r=await dpChiedi('salvaDipendente',{pin:dpPin, id:g.id||'', nome:g.nome.trim(), pinDipendente:String(g.pin).trim(), attivo:g.attivo?'1':''});
    if(!r.ok){ dpErrore=r.errore||'non riuscito'; if(b){b.disabled=false;b.textContent='Salva';} return render(); }
    // Alla creazione lo script accende sempre il dipendente: se lo si voleva
    // spento bisogna dirglielo subito dopo, con l'id appena nato.
    if(!g.id && !g.attivo && r.id) await dpChiedi('salvaDipendente',{pin:dpPin, id:r.id, nome:g.nome.trim(), attivo:''});
    const el=await dpChiedi('dipendenti',{pin:dpPin});
    if(el.ok) dpDipendenti=el.dipendenti||dpDipendenti;
    dpGente=null; dpErrore='';
    render();
  }catch(e){ dpErrore='Collegamento non riuscito'; if(b){b.disabled=false;b.textContent='Salva';} render(); }
}

// L'elenco dei pianoforti nasce dall'Excel e vive qui: e' questa app a spedirlo
// allo script dopo ogni importazione, altrimenti il dipendente non trova gli
// strumenti da agganciare alle lavorazioni.
async function dpSpedisciPianoforti(silenzioso){
  const pin=dpPin||lsGet('pf_pin_admin')||'';
  if(!pin) return {ok:false, errore:'manca il codice di amministrazione'};
  const elenco=pianos.map(function(p){
    return {numero:p.numero, marca:(p.marca||''), modello:(p.modello||''), matricola:(p.matricola||''), stato:(p.stato||'')};
  });
  // L'elenco spedito SOSTITUISCE quello che i dipendenti vedono. Se questa app
  // non ha l'Excel caricato manderebbe una lista mozza, cancellando la buona:
  // meglio fermarsi.
  if(!elenco.length){
    const m='Qui dentro non c’e’ nessun pianoforte: importa prima l’Excel.';
    if(!silenzioso) alert(m);
    return {ok:false, errore:m};
  }
  if(!silenzioso && elenco.length<100 && !confirm('Qui ci sono solo '+elenco.length+' pianoforti. Spedendoli, i dipendenti vedranno solo questi. Vado avanti?')){
    return {ok:false, errore:'annullato'};
  }
  try{
    const r=await dpManda('pianoforti',{pin:pin, elenco:elenco});
    if(!silenzioso) alert(r.ok?('Spediti '+r.quanti+' pianoforti ai dipendenti'):('Non riuscito: '+r.errore));
    return r;
  }catch(e){
    if(!silenzioso) alert('Non riuscito: '+e.message);
    return {ok:false, errore:e.message};
  }
}

/* ===================== PREZZI CONCORRENTI =====================
   Legge i prezzi pubblicati da Piazzo, Bettin, Longato, Salani e Mercatino Musicale
   e li mette accanto ai nostri, modello per modello. I siti non si possono leggere
   dal telefono: li legge il ponte su Google (PN_API) e qui arrivano gia' in righe.
   Finche' il ponte non c'e', la pagina mostra l'ultima lettura salvata. */
const PN_API='https://script.google.com/macros/s/AKfycby8OEdoFMeYjl058IuBm9DQz1p31YSaZEkKG-u9ujKVrnUpndLPCTjRriVon5yp0rk6ug/exec';
const PZ_FONTI=['Piazzo','Bettin','Longato','Salani','Altri negozi','Privati'];
const PZ_MARCHE=['YAMAHA','KAWAI','STEINWAY','BECHSTEIN','BOSENDORFER','BLUTHNER','PETROF','SCHIMMEL','SCHULZE','SAUTER','FAZIOLI','BOSTON','ESSEX','PEARL RIVER','RITMULLER','KAYSERBURG','YOUNG CHANG','SAMICK','WEINBACH','FURSTEIN','ZIMMERMANN','ROSLER','RONISCH','GROTRIAN','SEILER','PLEYEL','IBACH','FEURICH','HOFFMANN','PFEIFFER','FORSTER','KEMBLE','WENDL','CLEMENT','STEINBACH','ANELLI','TALLONE','BALDWIN','MASON','HAILUN','STEINGRAEBER','IRMLER','BRODMANN','PERZINA','BETTING','CHERNY','STRAUSS','APOLLO','ATLAS','DIAPASON','TOYO','EASTEIN','VICTOR','MIKI','KAISER'];
const PZ_SIGLE={YAMAHA:'YUS|YUA|YUX|YU|UX|U|YM|WX|W|MC|LU|JU|JX|SU|SE|B|P|M|T|E|MX|HQ|GB|GC|CFX|CF|C|G|S|A|DU|DC|N',KAWAI:'KS|KG|KU|K|BL|BS|US|NS|RX|GL|GX|GE|GM|CA|CS|CX|CE|ND|HA|KF|NV|SK|XO'};
const PZ_NUOVI=' B1 B2 B3 P116 P121 P22 GB1 GC1 GC2 C1X C2X C3X C5X C6X C7X YUS1 YUS3 YUS5 SE122 SE132 SU7 CFX K15 K200 K300 K400 K500 K600 K800 GL10 GL20 GL30 GL40 GL50 GX1 GX2 GX3 GX5 GX6 GX7 ND21 E200 E300 ';
var pzDati=null,pzCarico=false,pzMsg='',pzTipo='verticale',pzAperto='',pzQ='',pzSeme=false;

function pzE(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pzEur(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function pzMed(v){if(!v.length)return 0;var a=v.slice().sort(function(x,y){return x-y;}),m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2;}
function pzSt(v){if(!v.length)return {n:0};return {n:v.length,min:Math.min.apply(null,v),max:Math.max.apply(null,v),med:pzMed(v)};}
function pzNome(m){return m.charAt(0)+m.slice(1).toLowerCase();}

/* Da una riga grezza (fonte, nome, prezzo...) a una riga riconosciuta: marca, modello,
   verticale o coda, silent, usato o nuovo. Restituisce null se non serve al confronto. */
function pzRiconosci(r){
  var nome=String(r.n||''); if(!nome||r.t==='digitale') return null;
  var pulito=function(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();};
  var n=pulito(nome).replace(/[“”"«»'’]/g,' ').replace(/\bMOD(ELLO)?\b\.?/g,' ').replace(/\s+/g,' ');
  var tutto=pulito(nome+' '+(r.b||'')+' '+(r.c||''));
  var marca='',pos=1e9;
  PZ_MARCHE.forEach(function(m){var i=n.indexOf(m); if(i>=0&&i<pos){marca=m;pos=i;}});
  if(!PZ_SIGLE[marca]) return null;
  var resto=n.slice(pos+marca.length),fam='',sigla='';
  var re=new RegExp('(^|[^A-Z0-9])('+PZ_SIGLE[marca]+')[ \\-.]?(\\d{1,3})([A-Z0-9]{0,12})(?![A-Z0-9])','g'),m;
  while((m=re.exec(resto))){
    var p=m[2],d=m[3],s=m[4];
    if(marca==='YAMAHA'&&p==='N'&&!/^[123]$/.test(d)){ re.lastIndex=m.index+1; continue; }
    sigla=p+d+s; fam=p+d+((marca==='YAMAHA'&&p==='C'&&/^X/.test(s))?'X':''); break;
  }
  if(!fam) return null;
  var tipo=(r.t==='verticale'||r.t==='coda')?r.t:'';
  if(!tipo) tipo=(/^(C\d|G\d|GB|GC|KG|RX|CA\d|GL|GX|GS|CFX|CF\d|S\d|A\d|DC|GE|GM|SK|KF)/.test(fam)||/\bCODA\b|CODINO|MEZZA ?CODA|GRAN ?CODA/.test(tutto))?'coda':'verticale';
  if(/^(C\d|G\d|GB|GC|KG|RX|CA\d|GL|GX|GS)/.test(fam)) tipo='coda';
  var silent=/SILENT|TRANSACOUSTIC|ANYTIME|ATX|\bSH[23]?\b|\bSC ?[23]\b|\bSG2\b|DISKLAVIER|SC\d?PE/.test(n)||/^[A-Z]+\d+[A-Z]*(SC\d|SH\d?|SG\d|TA\d|TC\d|ATX)/.test(sigla)||/^YM5S/.test(sigla);
  var stato='',src=r.f,dove='';
  if(r.f==='Salani') stato=/^usato/.test(r.b||'')?'usato':'nuovo';
  else if(r.f==='Mercatino') stato=/NUOVO/.test(r.c||'')?'nuovo':'usato';
  else if(r.f==='PlayPiano') stato='usato';
  else if(/\bNUOV[OA]\b/.test(n)&&!/SEMI ?NUOV|PARI AL NUOV|COME NUOV/.test(n)) stato='nuovo';
  else if(/USAT|OCCASION|RICONDIZ|SECOND|EX[ \-]?DEMO|SEMI ?NUOV|RESTAUR|REVISION/.test(tutto)) stato='usato';
  if(!stato) stato=PZ_NUOVI.indexOf(' '+fam+' ')>=0?'nuovo':'usato';
  var prezzo=+r.p||0;
  if(r.f==='Mercatino'){
    if(/longato|bettin|piazzo|salani/i.test(r.chi||'')) return null;
    if(!/PIANO|CODA|VERTICAL/i.test(nome+' '+(r.b||''))) return null;
    if(/DIGITAL|TASTIER|CLAVINOVA|SYNTH|SINTETIZ|CHITARR|AMPLI|SGABELL|PANCHETT|PANCA|COPRITAST|RICAMBI|CERCO|NOLEGGIO/i.test(nome)) return null;
    if(prezzo<700) return null;
    src=r.tv==='Negozio'?'Altri negozi':'Privati';
    dove=[r.chi,String(r.dv||'').replace(/\s+(ieri|oggi|\d+\s+(settiman|giorn|mes|or|minut)).*$/i,'')].filter(Boolean).join(' · ');
  }
  if(r.f!=='PlayPiano'&&(prezzo<500||stato!=='usato')) return null;
  return {o:r.f,s:src,m:marca,f:fam,g:sigla,t:tipo,x:silent?1:0,p:prezzo,d:(r.d&&!/VENDUT/.test(n))?1:0,n:nome.replace(/\s+/g,' ').slice(0,90),u:r.u||'',w:dove};
}

/* Mette da parte la lettura nuova. Se una fonte questa volta non ha risposto, tiene le
   righe della volta prima, e segna cosa e' cambiato rispetto a prima. */
function pzSalva(righe,quando,avvisi,primaVolta){
  var nuove=[],gia={}; (righe||[]).forEach(function(r){var x=pzRiconosci(r); if(x&&!gia[x.o+'|'+x.u]){ gia[x.o+'|'+x.u]=1; nuove.push(x); }});
  var vecchie=(pzDati&&pzDati.righe)||[],tenute=[];
  if(!primaVolta&&vecchie.length){
    var presenti={}; nuove.forEach(function(x){presenti[x.o]=1;});
    var mancanti={}; vecchie.forEach(function(x){ if(!presenti[x.o]){ nuove.push(x); mancanti[x.o]=1; } });
    tenute=Object.keys(mancanti);
  }
  var diff=null;
  if(!primaVolta&&vecchie.length){
    var prima={},ora={}; vecchie.forEach(function(x){ if(x.s!=='PlayPiano'&&x.d) prima[x.u]=x; });
    diff={nuovi:[],spariti:[],cambiati:[],rispetto:pzDati.quando};
    nuove.forEach(function(x){ if(x.s==='PlayPiano'||!x.d) return; ora[x.u]=1; var v=prima[x.u];
      if(!v) diff.nuovi.push(x); else if(Math.abs(v.p-x.p)>=1) diff.cambiati.push({m:x.m,f:x.f,x:x.x,s:x.s,u:x.u,p:x.p,era:v.p}); });
    Object.keys(prima).forEach(function(u){ if(!ora[u]) diff.spariti.push(prima[u]); });
  }
  pzDati={quando:quando,righe:nuove,diff:diff,tenute:tenute,avvisi:avvisi||[]};
  lsSet('pf_prezzi',pzDati);
}
function pzCaricaSalvati(){
  if(pzDati) return;
  try{var d=lsGet('pf_prezzi'); if(d) pzDati=JSON.parse(d);}catch(e){}
  if(pzDati||pzSeme) return;
  pzSeme=true;
  fetch('prezzi-seed.json').then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(j&&j.righe&&!pzDati){ pzSalva(j.righe,j.quando,[],true); if(currentTab==='prezzi') render(); }
  }).catch(function(){});
}
async function pzAggiorna(){
  if(pzCarico) return;
  if(!PN_API){ pzMsg='La lettura in diretta non è ancora attiva: manca il via libera su Google (un clic, una volta sola). Intanto qui sotto c\'è l\'ultima lettura.'; render(); return; }
  var tok=lsGet('pf_gtoken');
  if(!tok||!tokenBuono()){ pzMsg='Prima collegati a Google dalla sezione Sincronizza, poi torna qui e riprova.'; render(); return; }
  pzCarico=true; pzMsg=''; render();
  try{
    const res=await fetch(PN_API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({azione:'prezzi',gtoken:tok})});
    const j=await res.json();
    if(!j.ok) throw new Error(j.errore||'risposta non valida');
    if(!j.righe||!j.righe.length) throw new Error('nessun sito ha risposto');
    pzSalva(j.righe,j.quando,j.avvisi,false);
    pzMsg='Letti '+j.righe.length+' annunci.';
  }catch(e){ pzMsg='Non sono riuscito a leggere i siti: '+(e&&e.message||e); }
  pzCarico=false; render();
}

/* Raggruppa per modello e fa i conti: per ogni fonte il prezzo a meta', il piu' basso,
   il piu' alto. Solo usati disponibili; oltre 2,2 volte il prezzo a meta' e' "fuori scala". */
function pzGruppi(){
  var G={};
  (pzDati.righe||[]).forEach(function(x){
    var k=x.m+'|'+x.f+'|'+x.x, g=G[k]||(G[k]={k:k,m:x.m,f:x.f,x:x.x,t:{},ann:[],miei:[]});
    if(x.s==='PlayPiano'){ g.miei.push(x); return; }
    g.t[x.t]=(g.t[x.t]||0)+1; g.ann.push(x);
  });
  return Object.keys(G).map(function(k){
    var g=G[k], neg=g.ann.filter(function(x){return x.d&&x.s!=='Privati';}).map(function(x){return x.p;});
    var m=pzMed(neg)||pzMed(g.ann.map(function(x){return x.p;}));
    g.ann.forEach(function(x){x.fuori=(m&&x.p>2.2*m)?1:0;});
    var buoni=g.ann.filter(function(x){return x.d&&!x.fuori;});
    g.per={}; PZ_FONTI.forEach(function(c){g.per[c]=pzSt(buoni.filter(function(x){return x.s===c;}).map(function(x){return x.p;}));});
    g.negozi=pzSt(buoni.filter(function(x){return x.s!=='Privati';}).map(function(x){return x.p;}));
    g.privati=g.per['Privati']; g.n=buoni.length;
    g.tipo=(g.t.coda||0)>(g.t.verticale||0)?'coda':(g.ann.length?'verticale':((g.miei[0]&&g.miei[0].t)||'verticale'));
    if(/^(C\d|G\d|GB|GC|KG|RX|CA\d|GL|GX|GS)/.test(g.f)) g.tipo='coda';
    g.nome=pzNome(g.m)+' '+g.f+(g.x?' Silent':'');
    return g;
  });
}
function pzDove(prezzo,s){
  if(!s.n) return '<span class="pz-nd">nessun confronto</span>';
  if(s.n<3) return '<span class="pz-nd">'+(s.n===1?'un solo annuncio':'solo '+s.n+' annunci')+'</span>';
  var d=(prezzo-s.med)/s.med*100;
  if(Math.abs(d)<7) return '<span class="badge">in linea</span>';
  return '<span class="badge '+(d<0?'badge-orange':'badge-red')+'">'+(d<0?'−':'+')+Math.abs(d).toFixed(0)+'%</span>';
}

/* ===================== CONTROLLO PRIMA NOTA =====================
   Incrocia i movimenti di Fineco (il file Excel scaricato dalla banca) con le fatture
   emesse e ricevute in Fatture in Cloud, lette dal ponte su Google (PN_API). Nessun
   aggancio approssimato: o coincide il numero di fattura scritto in causale, o coincidono
   nome e importo al centesimo. Regola della data di taglio: fino al 30/06/2026 e' tutto
   saldato, si controlla solo da li' in avanti.
   Quando una fattura ha piu' rate uguali, l'incasso va PRIMA sulla rata che in Fatture
   in Cloud risulta gia' pagata in quei giorni, e solo dopo su quelle ancora aperte:
   altrimenti la seconda meta' non pagata sembra incassata (successo il 23/11/2026). */
const PN_TAGLIO='2026-07-01';
const PN_STOP=' SRL SNC SAS SPA SRLS DI DE DEL DELLA E C SOCIETA COOPERATIVA ASSOCIAZIONE THE ASD APS ETS SOC COOP AR RL A R L GMBH CO KG ';
var pnRis=null,pnStato='',pnErr='',pnVediOk=false,pnPdf=null,pnSalvando=false,pnCaricato=false,pnVista='in',pnSegnando='';

function pnG(iso){var a=String(iso).slice(0,10).split('-');return Math.round(Date.UTC(+a[0],+a[1]-1,+a[2])/864e5);}
function pnIso(g){return new Date(g*864e5).toISOString().slice(0,10);}
function pnIt(iso,anno){var a=String(iso||'').slice(0,10).split('-');return a.length<3?'':a[2]+'/'+a[1]+(anno?'/'+a[0]:'');}
function pnNorm(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function pnStrip(s){return pnNorm(s).replace(/ /g,'');}
function pnEur(n){var v=Math.abs(+n||0).toFixed(2).split('.');return v[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+v[1];}
function pnSomma(a,k){return a.reduce(function(s,x){return s+(+x[k]||0);},0);}
function pnTit(s){return String(s||'').toLowerCase().replace(/(^|[\s'.-])([a-z\u00e0-\u00ff])/g,function(m,a,b){return a+b.toUpperCase();});}

/* Il file di Fineco: la riga dei titoli e' piu' in basso (sopra c'e' un'intestazione, e una
   nota che contiene le parole "data operazione"), le date arrivano come numero di Excel
   e la banca infila spazi dentro le parole. */
function pnLeggiMovimenti(buf){
  var wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
  var rr=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}),ih=-1;
  for(var i=0;i<rr.length&&i<60;i++){ if(rr[i].some(function(c){return /^Data[_ ]?Operazione$/i.test(String(c).trim());})&&rr[i].some(function(c){return /^Entrate$/i.test(String(c).trim());})){ih=i;break;} }
  if(ih<0) throw new Error('Questo non sembra il file dei movimenti di Fineco: non trovo la riga dei titoli con "Data_Operazione" ed "Entrate".');
  var col={}; rr[ih].forEach(function(c,k){col[String(c).trim().toLowerCase().replace(/\s+/g,'_')]=k;});
  var cD=col['data_operazione'],cE=col['entrate'],cU=col['uscite'],cT=col['descrizione'],cX=col['descrizione_completa'];
  if(cD==null||cE==null||cX==null) throw new Error('Nel file mancano le colonne Entrate o Descrizione_Completa.');
  var EX=pnG('1899-12-30'),mov=[];
  var num=function(v){ if(typeof v==='number') return v; var s=String(v==null?'':v).trim(); if(!s) return 0; if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.'); return parseFloat(s)||0; };
  for(var r=ih+1;r<rr.length;r++){
    var d=rr[r][cD],g=null,m;
    if(typeof d==='number'&&d>20000) g=EX+Math.floor(d);
    else if(/^\d{5}$/.test(String(d).trim())) g=EX+(+String(d).trim());
    else if((m=String(d).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) g=pnG(m[3]+'-'+m[2]+'-'+m[1]);
    if(g==null) continue;
    mov.push({j:g,date:pnIso(g),in:num(rr[r][cE]),out:Math.abs(num(cU==null?0:rr[r][cU])),tipo:String(cT==null?'':rr[r][cT]),txt:String(rr[r][cX]||'').replace(/[\t\r\n]+/g,' ')});
  }
  if(!mov.length) throw new Error('Nel file non ho trovato movimenti.');
  return mov;
}

function pnIncrocia(mov,fatture,ricevute){
  var T=pnG(PN_TAGLIO);
  var inRate=function(lista){ var out=[]; (lista||[]).forEach(function(f){
    var tok=pnNorm(f.c).split(' ').filter(function(t){return t.length>=2&&PN_STOP.indexOf(' '+t+' ')<0;});
    (f.r||[]).forEach(function(p){ if(!(+p.a>0)) return; out.push({num:String(f.n==null?'':f.n),fdate:String(f.d).slice(0,10),fj:pnG(f.d),cli:f.c||'',tok:tok,amt:+p.a,st:p.s,due:String(p.sc||f.d).slice(0,10),paid:String(p.p||'').slice(0,10),fid:f.id||'',rid:p.i||'',used:0}); });
  }); return out; };
  var rate=inRate(fatture),forn=inRate(ricevute);
  var BEN='B\\s*e\\s*n\\s*(?:e\\s*f\\s*i\\s*c\\s*i\\s*a\\s*r\\s*i\\s*o\\s*)?:';
  var reOrd=new RegExp('Ord(?:inante)?:\\s*(.*?)\\s*'+BEN,'i'),reBen=new RegExp(BEN+'\\s*(.*?)\\s*(?:I\\s*n\\s*s\\s*:|I\\s*B\\s*A\\s*N\\s*:)','i');
  var ordinante=function(t){var m=t.match(reOrd); if(m) return m[1]; m=t.match(/O\/C:\s*(.*?)\s*IMP:/i); return m?m[1]:'';};
  var causale=function(t){var m=t.match(/(?:C\s*a\s*u\s*s\s*a\s*l\s*e|Info-Cli|I\s*n\s*f\s*o\s*-\s*C\s*l\s*i|CAU)\s*:\s*(.*)$/i); return m?m[1]:'';};
  var pulisci=function(s){return String(s||'').replace(/\s+/g,' ').trim();};
  var nomeok=function(r,txt){ if(!r.tok.length) return false; var so=pnStrip(txt),no=' '+pnNorm(txt)+' ';
    for(var i=0;i<r.tok.length;i++){var k=r.tok[i]; if(k.length>=3){ if(so.indexOf(k)<0) return false; } else if(no.indexOf(' '+k+' ')<0) return false; } return true; };
  var uguale=function(a,b){return Math.abs(a-b)<0.011;};
  var gia=function(r){return r.st==='paid'&&r.paid;};
  /* Tra piu' rate possibili: prima quella che Fatture in Cloud da' gia' pagata nei giorni
     piu' vicini al movimento; poi le aperte, dalla fattura piu' vicina e dalla scadenza piu' vecchia. */
  var scegli=function(c,e){ return c.slice().sort(function(a,b){ var pa=gia(a)?0:1,pb=gia(b)?0:1; if(pa!==pb) return pa-pb;
    if(!pa) return Math.abs(pnG(a.paid)-e.j)-Math.abs(pnG(b.paid)-e.j);
    return Math.abs(a.fj-e.j)-Math.abs(b.fj-e.j)||(a.due<b.due?-1:(a.due>b.due?1:0)); })[0]; };
  var prendi=function(e,r,liv){ r.used=1; e.liv=liv; e.num=r.num; e.fdate=r.fdate; e.cli=r.cli; e.st=r.st; e.ramt=r.amt; e.fid=r.fid; e.rid=r.rid; };
  var proponi=function(e,r){ e.liv='DA CONFERMARE'; e.num=r.num; e.fdate=r.fdate; e.cli=r.cli; e.st=r.st; e.ramt=r.amt; e.fid=r.fid; e.rid=r.rid; };

  /* ---------- INCASSI contro fatture emesse ---------- */
  var ent=mov.filter(function(m){return m.in>0&&!/Sconto Canone/i.test(m.tipo);}).sort(function(a,b){return a.j-b.j;});
  ent.forEach(function(e){ e.ord=pulisci(ordinante(e.txt)); e.cau=pulisci(causale(e.txt)); e.liv='NESSUNA';
    var m=pnNorm(e.cau).match(/\b(?:FATTURA|FATT|FT)\s*(?:NUMERO|NUM|NR|N)?\s*(\d{1,3})\b/); if(m) e.nf=String(parseInt(m[1],10)); });
  var finestra=function(r,e){return r.fj>=e.j-400&&r.fj<=e.j+60&&(r.st!=='paid'||!r.paid||Math.abs(pnG(r.paid)-e.j)<=45);};
  ent.filter(function(e){return e.nf!=null;}).forEach(function(e){
    var c=rate.filter(function(r){return !r.used&&String(parseInt(r.num,10))===e.nf&&finestra(r,e)&&Math.abs(r.amt-e.in)<=1;});
    var giusti=c.filter(function(r){return uguale(r.amt,e.in);});
    if(giusti.length) prendi(e,scegli(giusti,e),'CERTO'); else if(c.length) prendi(e,scegli(c,e),'CERTO diverso'); });
  ent.filter(function(e){return e.liv==='NESSUNA'&&e.ord;}).forEach(function(e){
    var c=rate.filter(function(r){return !r.used&&uguale(r.amt,e.in)&&finestra(r,e)&&nomeok(r,e.ord);}); if(c.length) prendi(e,scegli(c,e),'CERTO'); });
  ent.filter(function(e){return e.liv==='NESSUNA'&&e.cau;}).forEach(function(e){
    var c=rate.filter(function(r){return !r.used&&uguale(r.amt,e.in)&&finestra(r,e)&&nomeok(r,e.cau);}); if(c.length) prendi(e,scegli(c,e),'CERTO'); });
  ent.filter(function(e){return e.liv==='NESSUNA';}).forEach(function(e){
    var c=rate.filter(function(r){return !r.used&&uguale(r.amt,e.in)&&r.fj>=e.j-75&&r.fj<=e.j+45&&finestra(r,e);});
    var stessi=ent.filter(function(x){return x.liv==='NESSUNA'&&uguale(x.in,e.in)&&Math.abs(x.j-e.j)<=75;});
    if(c.length!==1||stessi.length!==1) return;
    var so=pnStrip(e.ord+' '+e.cau); if(!c[0].tok.some(function(k){return k.length>=4&&so.indexOf(k)>=0;})) return;
    proponi(e,c[0]); });
  var clienti={}; rate.forEach(function(r){ if(!clienti[r.cli]) clienti[r.cli]=r; });
  var nomi=Object.keys(clienti).sort();
  ent.filter(function(e){return e.liv==='NESSUNA';}).forEach(function(e){ for(var i=0;i<nomi.length;i++){ if(nomeok(clienti[nomi[i]],e.ord+' '+e.cau)){ e.noto=nomi[i]; break; } } });

  /* ---------- USCITE contro fatture dei fornitori ---------- */
  var usc=mov.filter(function(m){return m.out>0;}).sort(function(a,b){return a.j-b.j;});
  usc.forEach(function(e){ var t=e.txt,m;
    e.cau=pulisci(causale(t)); e.liv='NESSUNA';
    if((m=t.match(reBen))) e.chi=m[1];
    else if((m=t.match(/presso:\s*(.*?)\s*(?:Carta\b|$)/i))) e.chi=m[1];
    else if(/Direct Debit|Riba/i.test(e.tipo)) e.chi=t.replace(/\s*(Addebito SDD|\bVIA\b|FATTURA).*$/i,'');
    else if(/Visa|Carta/i.test(e.tipo)) e.chi=t.replace(/\s*Carta N.*$/i,'');
    else e.chi='';
    e.chi=pulisci(e.chi);
    e.banca=(/F24|Canone Mensile|Imposta (di )?bollo|Commission|Competenze|Interessi|Prelievo|Giroconto|Ricarica/i.test(e.tipo)||/stipend|emolument|busta paga/i.test(e.cau))?1:0; });
  /* I pianoforti ai fornitori si pagano a rate anche a un anno e piu' dalla fattura (D'Errico). */
  var finU=function(r,e){return r.fj>=e.j-800&&r.fj<=e.j+20&&(r.st!=='paid'||!r.paid||Math.abs(pnG(r.paid)-e.j)<=45);};
  var daCercare=usc.filter(function(e){return !e.banca;});
  daCercare.forEach(function(e){ var so=pnStrip(e.txt);
    /* in fattura "FEP 173_25", nel bonifico "Saldo Fattura 173/25": si confronta anche senza le lettere davanti */
    var c=forn.filter(function(r){var sn=pnStrip(r.num),sd=sn.replace(/^[A-Z]+/,''); return !r.used&&((sn.length>=4&&so.indexOf(sn)>=0)||(sd.length>=4&&so.indexOf(sd)>=0))&&finU(r,e)&&Math.abs(r.amt-e.out)<=1;});
    var giusti=c.filter(function(r){return uguale(r.amt,e.out);});
    if(giusti.length) prendi(e,scegli(giusti,e),'CERTO'); else if(c.length) prendi(e,scegli(c,e),'CERTO diverso'); });
  daCercare.filter(function(e){return e.liv==='NESSUNA';}).forEach(function(e){ var so=pnStrip(e.txt);
    var c=forn.filter(function(r){return !r.used&&uguale(r.amt,e.out)&&finU(r,e)&&r.tok.some(function(k){return k.length>=4&&so.indexOf(k)>=0;});});
