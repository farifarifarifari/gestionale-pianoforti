/* ===================== FOTO DEI PIANOFORTI =====================
   Per ogni pianoforte una cartella su Drive (dentro "FOTO PIANOFORTI") con le foto pronte:
   quadrate, 800x800, sotto i 100 KB come quelle del sito, con il nome
   Marca_Modello_Matricola_NN.jpg. Gli originali a piena risoluzione stanno nella
   sottocartella "originali". Tutto passa dal permesso Drive dell'app (solo i file suoi).
   Lo sfondo sostituito NON c'e' ancora: si decide dopo la prova sulle foto vere. */
const FT_RADICE='FOTO PIANOFORTI',FT_LATO=800,FT_PESO=100*1024;
var ftIndice=null,ftAperto=null,ftFoto=null,ftQ='',ftFiltro='senza',ftMsg='',ftErr='',ftLavoro='',ftAnte={},ftNuovo=false,ftCaricoIndice=false;

function ftPulito(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,' ').trim();}
function ftChiave(p){var m=ftPulito(p.matricola).replace(/ /g,''); return m?m:('n'+p.numero);}
function ftNomeCartella(p){return [ftPulito(p.marca),ftPulito(p.modello),ftChiave(p)].filter(Boolean).join(' ');}
function ftNomeFile(p,n){return [ftPulito(p.marca),ftPulito(p.modello),ftChiave(p)].filter(Boolean).join('_').replace(/ /g,'-')+'_'+(n<10?'0':'')+n+'.jpg';}
function ftQuante(p){ if(!ftIndice) return null; var c=ftIndice.cartelle[ftChiave(p)]; return c?c.n:0; }
function ftBadge(p){ var n=ftQuante(p); if(n===null) return ''; return '<span class="badge '+(n?'badge-green':'badge-red')+'" style="margin-left:6px">'+(n?n+' foto':'senza foto')+'</span>'; }

async function ftDrive(url,opt){
  var tok=lsGet('pf_gtoken');
  if(!tok||!tokenBuono()) throw new Error('Prima collegati a Google dalla sezione Sincronizza, poi torna qui.');
  opt=opt||{}; opt.headers=Object.assign({Authorization:'Bearer '+tok},opt.headers||{});
  var r=await fetch(url,opt);
  if(r.status===401) throw new Error('Il collegamento a Google è scaduto: ricollegati da Sincronizza.');
  if(!r.ok) throw new Error('Drive ha risposto '+r.status);
  return r;
}
async function ftCartella(nome,genitore){
  var q="name='"+nome.replace(/'/g,"\\'")+"' and mimeType='application/vnd.google-apps.folder' and trashed=false"+(genitore?" and '"+genitore+"' in parents":'');
  var l=(await (await ftDrive('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id,name)')).json()).files||[];
  if(l.length) return l[0].id;
  var corpo={name:nome,mimeType:'application/vnd.google-apps.folder'}; if(genitore) corpo.parents=[genitore];
  return (await (await ftDrive('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo)})).json()).id;
}
async function ftElenco(q,campi){
  var out=[],pag='';
  do{
    var j=await (await ftDrive('https://www.googleapis.com/drive/v3/files?pageSize=1000&q='+encodeURIComponent(q)+'&fields=nextPageToken,files('+campi+')'+(pag?'&pageToken='+pag:''))).json();
    out=out.concat(j.files||[]); pag=j.nextPageToken||'';
  }while(pag);
  return out;
}
/* L'indice: quali pianoforti hanno gia' una cartella e quante foto contiene. */
async function ftCaricaIndice(){
  if(ftCaricoIndice) return; ftCaricoIndice=true; ftErr='';
  try{
    var radice=await ftCartella(FT_RADICE);
    var cart=await ftElenco("'"+radice+"' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false",'id,name');
    var foto=await ftElenco("mimeType='image/jpeg' and trashed=false",'id,parents');
    var perCart={}; foto.forEach(function(f){(f.parents||[]).forEach(function(p){perCart[p]=(perCart[p]||0)+1;});});
    var ind={quando:new Date().toISOString(),radice:radice,cartelle:{}};
    cart.forEach(function(c){var k=c.name.split(' ').pop(); ind.cartelle[k]={id:c.id,nome:c.name,n:perCart[c.id]||0};});
    ftIndice=ind; lsSet('pf_foto_indice',ind);
  }catch(e){ ftErr=String(e&&e.message||e); }
  ftCaricoIndice=false; if(currentTab==='foto'||currentTab==='disponibilita') render();
}
function ftTrova(k){ if(ftAperto&&ftChiave(ftAperto)===k) return ftAperto; return pianos.filter(function(p){return ftChiave(p)===k;})[0]||null; }
async function ftApri(k){
  var p=ftTrova(k); if(!p) return;
  ftAperto=p; ftFoto=null; ftMsg=''; ftErr=''; ftNuovo=false; render(); window.scrollTo(0,0);
  await ftRileggi();
}
async function ftRileggi(){
  var p=ftAperto; if(!p) return;
  try{
    var c=ftIndice&&ftIndice.cartelle[ftChiave(p)];
    if(!c){ ftFoto=[]; render(); return; }
    var l=await ftElenco("'"+c.id+"' in parents and mimeType='image/jpeg' and trashed=false",'id,name,size');
    l.sort(function(a,b){return a.name<b.name?-1:1;});
    if(ftAperto!==p) return;
    ftFoto=l; c.n=l.length; lsSet('pf_foto_indice',ftIndice); render();
    for(var i=0;i<l.length;i++){ if(!ftAnte[l[i].id]){ var b=await (await ftDrive('https://www.googleapis.com/drive/v3/files/'+l[i].id+'?alt=media')).blob(); ftAnte[l[i].id]=URL.createObjectURL(b); if(ftAperto===p) render(); } }
  }catch(e){ ftErr=String(e&&e.message||e); render(); }
}

/* Da una foto qualsiasi a un quadrato 800x800 sotto i 100 KB. Se e' gia' cosi', non la tocca. */
async function ftRiduci(file){
  var url=URL.createObjectURL(file);
  try{
    var img=await new Promise(function(ok,ko){var i=new Image(); i.onload=function(){ok(i);}; i.onerror=function(){ko(new Error('Non riesco ad aprire '+file.name+': se è una foto HEIC, imposta la fotocamera su JPEG.'));}; i.src=url;});
    var w=img.naturalWidth,h=img.naturalHeight;
    if(w===h&&w===FT_LATO&&file.size<=FT_PESO&&/jpe?g/i.test(file.type)) return {blob:file,toccata:false,quadrata:true};
    var lato=Math.min(w,h),sx=Math.round((w-lato)/2),sy=Math.round((h-lato)/2);
    var tela=document.createElement('canvas'),src=img,sl=lato,ox=sx,oy=sy;
    /* si scende a meta' per volta: rimpicciolire da 4000 a 800 in un colpo solo sgrana i bordi */
    while(sl/2>=FT_LATO){ var m=document.createElement('canvas'); m.width=m.height=Math.round(sl/2); var mx=m.getContext('2d'); mx.imageSmoothingEnabled=true; mx.imageSmoothingQuality='high'; mx.drawImage(src,ox,oy,sl,sl,0,0,m.width,m.height); src=m; sl=m.width; ox=0; oy=0; }
    tela.width=tela.height=FT_LATO; var x=tela.getContext('2d'); x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high';
    x.fillStyle='#fff'; x.fillRect(0,0,FT_LATO,FT_LATO); x.drawImage(src,ox,oy,sl,sl,0,0,FT_LATO,FT_LATO);
    var blob=null;
    for(var q=0.9;q>=0.5;q-=0.04){ blob=await new Promise(function(ok){tela.toBlob(ok,'image/jpeg',q);}); if(blob&&blob.size<=FT_PESO) break; }
    if(!blob) throw new Error('Non riesco a salvare '+file.name);
    return {blob:blob,toccata:true,quadrata:w===h};
  }finally{ URL.revokeObjectURL(url); }
}
async function ftCarica(nome,blob,genitore){
  var tipo='image/jpeg';
  if(blob.size<4500000){
    var conf='ft'+Date.now()+Math.round(Math.random()*1e6);
    var corpo=new Blob(['--'+conf+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:nome,parents:[genitore]})+'\r\n--'+conf+'\r\nContent-Type: '+tipo+'\r\n\r\n',blob,'\r\n--'+conf+'--']);
    return (await (await ftDrive('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+conf},body:corpo})).json());
  }
  var r=await ftDrive('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,size',{method:'POST',headers:{'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':tipo},body:JSON.stringify({name:nome,parents:[genitore]})});
  var dove=r.headers.get('Location'); if(!dove) throw new Error('caricamento grande non disponibile');
  return (await (await ftDrive(dove,{method:'PUT',headers:{'Content-Type':tipo},body:blob})).json());
}
async function ftAggiungi(inp){
  var files=[].slice.call(inp.files||[]),p=ftAperto; inp.value='';
  if(!files.length||!p||ftLavoro) return;
  ftErr=''; ftMsg=''; ftLavoro='Preparo…'; render();
  var fatte=0,saltate=[],senzaOrig=0;
  try{
    if(!ftIndice) await ftCaricaIndice();
    if(!ftIndice) throw new Error(ftErr||'Drive non raggiungibile');
    var k=ftChiave(p),c=ftIndice.cartelle[k];
    if(!c){ c={id:await ftCartella(ftNomeCartella(p),ftIndice.radice),nome:ftNomeCartella(p),n:0}; ftIndice.cartelle[k]=c; }
    var orig=null,usati=(ftFoto||[]).map(function(f){var m=f.name.match(/_(\d+)\.jpg$/i); return m?+m[1]:0;}),n=usati.length?Math.max.apply(null,usati):0;
    for(var i=0;i<files.length;i++){
      ftLavoro='Foto '+(i+1)+' di '+files.length+'…'; render();
      try{
        var r=await ftRiduci(files[i]); n++;
        await ftCarica(ftNomeFile(p,n),r.blob,c.id); fatte++;
        if(r.toccata){ try{ if(!orig) orig=await ftCartella('originali',c.id); await ftCarica(ftNomeFile(p,n).replace(/\.jpg$/,'_originale.jpg'),files[i],orig); }catch(e1){ senzaOrig++; } }
      }catch(e2){ saltate.push(files[i].name+': '+String(e2&&e2.message||e2)); }
    }
    ftMsg=fatte+(fatte===1?' foto salvata':' foto salvate')+' su Drive, in "'+c.nome+'".'+(senzaOrig?' Di '+senzaOrig+' non ho potuto tenere l\'originale.':'');
    if(saltate.length) ftErr='Non salvate: '+saltate.join(' · ');
  }catch(e){ ftErr=String(e&&e.message||e); }
  ftLavoro=''; render(); await ftRileggi();
}
async function ftCestina(id){
  var f=(ftFoto||[]).filter(function(x){return x.id===id;})[0]; if(!f||ftLavoro) return;
  if(!confirm('Sposto nel cestino di Drive la foto '+f.name+'?')) return;
  try{ await ftDrive('https://www.googleapis.com/drive/v3/files/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})}); }catch(e){ ftErr=String(e&&e.message||e); }
  await ftRileggi();
}
/* Manda le foto: sul telefono si apre la scelta delle app (WhatsApp), con le foto gia' allegate. */
async function ftManda(){
  var p=ftAperto; if(!p||!ftFoto||!ftFoto.length||ftLavoro) return;
  ftErr=''; ftLavoro='Preparo le foto da mandare…'; render();
  try{
    var files=[];
    for(var i=0;i<ftFoto.length;i++){ var b=await (await ftDrive('https://www.googleapis.com/drive/v3/files/'+ftFoto[i].id+'?alt=media')).blob(); files.push(new File([b],ftFoto[i].name,{type:'image/jpeg'})); }
    ftLavoro='';
    if(navigator.canShare&&navigator.canShare({files:files})){ render(); await navigator.share({files:files,text:[p.marca,p.modello,p.matricola?'matr. '+p.matricola:''].filter(Boolean).join(' ')}); }
    else { ftErr='Da qui non posso aprire WhatsApp con le foto allegate (succede sul computer). Apri la cartella su Drive e trascina le foto in WhatsApp Web, oppure fallo dal telefono.'; }
  }catch(e){ if(!(e&&e.name==='AbortError')) ftErr=String(e&&e.message||e); }
  ftLavoro=''; render();
}
function ftApriNuovo(){

  var p={marca:g('ft-marca'),modello:g('ft-modello'),matricola:g('ft-matricola'),numero:0,stato:'',fuori:1};

}

function renderFoto(){
  if(!ftIndice){ try{var d=lsGet('pf_foto_indice'); if(d) ftIndice=JSON.parse(d);}catch(e){} if(lsGet('pf_gtoken')&&tokenBuono()&&!ftCaricoIndice) setTimeout(ftCaricaIndice,50); }
  var h='';
  if(ftAperto){
    var p=ftAperto,c=ftIndice&&ftIndice.cartelle[ftChiave(p)];
    h+='<div class="card"><div style="font-size:12.5px;color:#A01020;cursor:pointer;margin-bottom:8px" onclick="ftAperto=null;ftFoto=null;ftMsg=\'\';ftErr=\'\';render()">‹ Tutti i pianoforti</div>';
    h+='<div style="font-size:17px;font-weight:600">'+pzE((p.marca||'').trim()+' '+(p.modello||''))+'</div><div style="font-size:12.5px;color:#888;margin:2px 0 12px">'+(p.numero?'#'+p.numero+' · ':'')+'matricola '+pzE(p.matricola||'—')+(p.stato?' · '+({N:'a noleggio',D:'in deposito',V:'venduto'}[p.stato]||p.stato):'')+'</div>';
    h+='<label class="btn-primary" style="display:block;text-align:center'+(ftLavoro?';opacity:.6':'')+'">'+(ftLavoro?pzE(ftLavoro):'Aggiungi foto')+'<input type="file" accept="image/*" multiple style="display:none" onchange="ftAggiungi(this)"'+(ftLavoro?' disabled':'')+'></label>';
    h+='<div class="pn-nota" style="margin-top:8px">Le porto a 800×800 sotto i 100 KB, come quelle del sito, e le salvo su Drive con il nome giusto. L\'originale resta nella sottocartella “originali”.</div>';
    if(ftMsg) h+='<div class="pz-msg" style="background:#EAF3DE;color:#2e5d1e">'+pzE(ftMsg)+'</div>';
    if(ftErr) h+='<div class="pz-msg">'+pzE(ftErr)+'</div>';
    h+='</div>';
    if(ftFoto===null) h+='<div class="empty-state">Carico le foto…</div>';
    else if(!ftFoto.length) h+='<div class="empty-state">Nessuna foto per questo pianoforte.</div>';
    else{
      h+='<div class="card"><div class="section-title">'+ftFoto.length+' foto pronte</div><div class="ft-griglia">'+ftFoto.map(function(f){
        return '<div class="ft-f">'+(ftAnte[f.id]?'<img src="'+ftAnte[f.id]+'" alt="">':'<div class="ft-vuota"></div>')+'<button onclick="ftCestina(\''+f.id+'\')" title="Cestina">×</button><span>'+Math.round((+f.size||0)/1024)+' KB</span></div>'; }).join('')+'</div>';
      h+='<button class="btn-primary" style="margin-top:12px" onclick="ftManda()"'+(ftLavoro?' disabled':'')+'>Manda le foto (WhatsApp)</button>';
      if(c) h+='<a class="btn-secondary" style="display:block;text-align:center;text-decoration:none" href="https://drive.google.com/drive/folders/'+c.id+'" target="_blank" rel="noopener">Apri la cartella su Drive</a>';
      h+='</div>';
    }
    return h;
  }
  h+='<div class="card"><div class="section-title">Foto dei pianoforti</div><div style="font-size:13px;color:#444;line-height:1.45;margin-bottom:10px">Scegli un pianoforte e aggiungi le foto: le preparo come quelle del sito e le tengo su Drive, pronte da mandare.</div>';
  h+='<input id="ft-q" class="pz-cerca" type="search" placeholder="Cerca per modello, matricola o numero…" value="'+pzE(ftQ)+'" oninput="ftQ=this.value;render()" style="margin-bottom:0">';
  if(ftErr) h+='<div class="pz-msg">'+pzE(ftErr)+'</div>';
  if(!ftIndice) h+='<div class="pz-msg">'+(ftCaricoIndice?'Leggo da Drive quali pianoforti hanno già le foto…':'Per vedere chi ha già le foto collegati a Google da Sincronizza.')+'</div>';
  h+='</div>';
  var q=ftQ.trim().toLowerCase(),base=pianos.filter(function(p){return q?true:p.stato==='D';});
  if(q) base=base.filter(function(p){return ((p.marca||'')+' '+(p.modello||'')+' '+(p.matricola||'')+' #'+p.numero).toLowerCase().indexOf(q)>=0;});
  var con=base.filter(function(p){return ftQuante(p)>0;}),senza=base.filter(function(p){return !(ftQuante(p)>0);});
  h+='<div class="pz-chips"><button class="'+(ftFiltro==='senza'?'on':'')+'" onclick="ftFiltro=\'senza\';render()">Senza foto · '+senza.length+'</button><button class="'+(ftFiltro==='con'?'on':'')+'" onclick="ftFiltro=\'con\';render()">Con foto · '+con.length+'</button></div>';
  var lista=(ftFiltro==='con'?con:senza).slice().sort(function(a,b){return (a.marca||'').localeCompare(b.marca||'')||(a.modello||'').localeCompare(b.modello||'')||a.numero-b.numero;});
  h+='<div style="font-size:12px;color:#888;padding:0 4px 8px">'+(q?'Risultati in tutto l\'elenco':'Pianoforti in deposito')+' · '+lista.length+'</div>';
  if(!pianos.length) h+='<div class="empty-state">L\'elenco dei pianoforti è vuoto: importa il file Excel dalla sezione Excel.</div>';
  h+=lista.slice(0,150).map(function(p){var n=ftQuante(p); return '<div class="card ft-riga" onclick="ftApri(\''+ftChiave(p)+'\')"><div><b>'+pzE((p.marca||'').trim()+' '+(p.modello||''))+'</b><i>#'+p.numero+' · matr. '+pzE(p.matricola||'—')+(q&&p.stato?' · '+p.stato:'')+'</i></div>'+(n===null?'':'<span class="badge '+(n?'badge-green':'badge-red')+'">'+(n?n+' foto':'senza foto')+'</span>')+'</div>';}).join('');
  h+='<div class="card">'+(ftNuovo?'<div class="section-title">Pianoforte non in elenco</div><input id="ft-marca" class="pz-cerca" placeholder="Marca" style="margin-bottom:8px"><input id="ft-modello" class="pz-cerca" placeholder="Modello" style="margin-bottom:8px"><input id="ft-matricola" class="pz-cerca" placeholder="Matricola" style="margin-bottom:10px"><button class="btn-primary" onclick="ftApriNuovo()">Apri</button>':'<div class="pz-piu" style="padding-top:0" onclick="ftNuovo=true;render()">Il pianoforte non è in elenco? Scrivilo a mano</div>')+'</div>';
  return h;
}
try{var ftSalvato=lsGet('pf_foto_indice'); if(ftSalvato) ftIndice=JSON.parse(ftSalvato);}catch(e){}

load();scaricaRubricaSeManca();render();
</script>
